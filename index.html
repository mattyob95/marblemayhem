<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marble Mayhem Deluxe</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070c;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.panel{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(720px,92vw);
  padding:28px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  background:rgba(7,11,20,.92);
  box-shadow:0 20px 80px rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
}

h1{
  margin:0 0 8px;
  font-size:clamp(34px,7vw,68px);
  text-align:center;
  letter-spacing:2px;
  text-shadow:0 5px 20px rgba(0,0,0,.7);
}

.subtitle{
  text-align:center;
  color:#8eeeff;
  margin-bottom:24px;
}

.row{
  display:flex;
  gap:12px;
  align-items:center;
  margin:12px 0;
}

.row label{
  width:130px;
  color:#bfc8d8;
}

select,
input{
  flex:1;
  min-width:0;
  padding:12px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.18);
  background:#111827;
  color:#fff;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  background:#20c9ff;
  color:#031019;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  transition:.15s transform,.15s filter;
}

button:hover{
  transform:translateY(-2px);
  filter:brightness(1.12);
}

button:active{
  transform:translateY(0);
}

.primary{
  width:100%;
  margin-top:18px;
  font-size:20px;
  padding:16px;
}

.racers{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:8px;
}

.racer{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px;
  border-radius:9px;
  background:rgba(255,255,255,.045);
}

.racer input{
  flex:none;
  width:auto;
}

.dot{
  width:15px;
  height:15px;
  border-radius:50%;
  box-shadow:0 0 10px currentColor;
}

.bank{
  text-align:right;
  font-weight:bold;
  color:#ffe08a;
}

#hud{
  position:absolute;
  inset:0;
  pointer-events:none;
  display:none;
}

#raceInfo{
  position:absolute;
  top:16px;
  left:16px;
  padding:10px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.55);
  font-weight:bold;
  font-size:14px;
}

#cameraInfo{
  position:absolute;
  top:16px;
  right:16px;
  padding:10px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.55);
  font-weight:bold;
  font-size:14px;
}

#message{
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  font-size:clamp(70px,15vw,180px);
  font-weight:900;
  text-shadow:0 8px 35px #000;
}

.controls{
  margin-top:18px;
  color:#8d99aa;
  text-align:center;
  font-size:13px;
  line-height:1.7;
}

#finishPanel{
  display:none;
}

#winnerText{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin:10px 0 20px;
}

#results{
  margin:15px 0;
}

.result{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  margin:5px 0;
  background:rgba(255,255,255,.055);
  border-radius:8px;
}

.resultLeft{
  display:flex;
  align-items:center;
  gap:10px;
}

.resultDot{
  width:14px;
  height:14px;
  border-radius:50%;
}

#payoutText{
  text-align:center;
  color:#ffe08a;
  font-size:18px;
  font-weight:bold;
  margin:18px 0;
}

.finishButtons{
  display:flex;
  gap:10px;
}

.finishButtons button{
  flex:1;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){
  .panel{
    padding:18px;
  }

  .racers{
    grid-template-columns:1fr;
  }

  .row{
    flex-direction:column;
    align-items:stretch;
  }

  .row label{
    width:auto;
  }

  .finishButtons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="menu" class="panel">

  <h1>MARBLE MAYHEM</h1>

  <div class="subtitle">
    DELUXE EDITION
  </div>

  <div class="row">
    <label>Track</label>
    <select id="trackSelect"></select>
  </div>

  <div>
    <div style="margin-bottom:7px;color:#bfc8d8">
      Choose your marble
    </div>

    <div id="racers" class="racers"></div>
  </div>

  <div class="row">
    <label>Bet</label>
    <input id="bet" type="number" min="0" step="5" value="25">
  </div>

  <div class="bank">
    Bank: $<span id="bankText">100</span>
  </div>

  <button id="startBtn" class="primary">
    START RACE
  </button>

  <div class="controls">
    V — Switch camera<br>
    R — Restart race<br>
    M — Mute<br>
    SPACE — Pause
  </div>

</div>

<div id="hud">

  <div id="raceInfo">
    RACE
  </div>

  <div id="cameraInfo">
    CAMERA: FIRST PERSON
  </div>

  <div id="message"></div>

</div>

<div id="finishPanel" class="panel">

  <h1>FINISH!</h1>

  <div id="winnerText"></div>

  <div id="results"></div>

  <div id="payoutText"></div>

  <div class="finishButtons">
    <button id="nextBtn">
      NEXT TRACK
    </button>

    <button id="menuBtn">
      MENU
    </button>
  </div>

</div>

<script>
"use strict";


/* ============================================================
   CANVAS
============================================================ */

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W=window.innerWidth;
let H=window.innerHeight;
let DPR=Math.min(window.devicePixelRatio||1,2);

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  DPR=Math.min(
    window.devicePixelRatio||1,
    2
  );

  canvas.width=
    Math.floor(W*DPR);

  canvas.height=
    Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* ============================================================
   UTILITIES
============================================================ */

function clamp(v,a,b){
  return Math.max(
    a,
    Math.min(b,v)
  );
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function seededRandom(seed){

  let x=(seed*99991+17)|0;

  return function(){

    x=
      (x*1664525+
       1013904223)|0;

    return (
      (x>>>0)/
      4294967296
    );
  };
}


/* ============================================================
   RACERS
============================================================ */

const racerData=[
  {
    id:"fetson",
    name:"fetson",
    color:"#e74c3c"
  },
  {
    id:"doober",
    name:"doober",
    color:"#3498db"
  },
  {
    id:"fadgeril",
    name:"fadgeril",
    color:"#f1c40f"
  },
  {
    id:"scrappy",
    name:"scrappy doo",
    color:"#9b59b6"
  },
  {
    id:"scubadaa",
    name:"scubadaa",
    color:"#1abc9c"
  },
  {
    id:"pisswolf",
    name:"pisswolf",
    color:"#f39c12"
  },
  {
    id:"malty",
    name:"malty",
    color:"#e67e22"
  },
  {
    id:"morning",
    name:"morning roll",
    color:"#ecf0f1"
  }
];


/* ============================================================
   TRACKS
============================================================ */

const trackNames=[
  "Neon Run",
  "Dust Devil",
  "Marble Mountain",
  "The Snake",
  "Turbo Tunnel",
  "Crystal Coast",
  "Red Canyon",
  "The Gauntlet",
  "Moon Rock",
  "Lava Loop",
  "Blue Thunder",
  "Pinball Ridge",
  "Green Machine",
  "The Spiral",
  "Sunset Sprint",
  "Chaos Valley",
  "Rocket Road",
  "Frostbite",
  "Thunder Alley",
  "Golden Mile",
  "Black Diamond",
  "Jungle Run",
  "Final Frenzy",
  "Mayhem Grand Prix"
];


/* ============================================================
   STATE
============================================================ */

let marble=[];
let track=[];
let obstacles=[];

let selected="fetson";
let trackIndex=0;

let state="menu";
let paused=false;
let muted=false;
let firstPerson=true;

let bank=100;
let currentBet=25;

let raceTime=0;
let countdown=0;

let finishOrder=[];

let cameraShake=0;
let lastTime=0;


/* ============================================================
   CAMERA
============================================================ */

let spectatorX=0;
let spectatorY=0;

let fpX=0;
let fpY=0;
let fpAngle=0;


/* ============================================================
   AUDIO
============================================================ */

let audioCtx=null;

function tone(freq,duration){

  if(muted)return;

  try{

    if(!audioCtx){

      audioCtx=new(
        window.AudioContext||
        window.webkitAudioContext
      )();
    }

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.type="sine";

    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
      .0001,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .08,
      audioCtx.currentTime+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
      audioCtx.currentTime+
      duration+
      .02
    );

  }catch(e){}
}


/* ============================================================
   MENU
============================================================ */

function setupMenu(){

  const racers=
    document.getElementById("racers");

  racers.innerHTML="";

  racerData.forEach(r=>{

    const div=
      document.createElement("label");

    div.className="racer";

    div.innerHTML=`
      <input
        type="radio"
        name="racer"
        value="${r.id}"
        ${r.id===selected?"checked":""}
      >
      <span
        class="dot"
        style="
          background:${r.color};
          color:${r.color}
        "
      ></span>
      <span>${r.name}</span>
    `;

    racers.appendChild(div);
  });

  racers
    .querySelectorAll("input")
    .forEach(input=>{

      input.addEventListener(
        "change",
        ()=>{
          selected=input.value;
        }
      );
    });

  const select=
    document.getElementById(
      "trackSelect"
    );

  if(!select.options.length){

    trackNames.forEach(
      (name,index)=>{

        const option=
          document.createElement(
            "option"
          );

        option.value=index;

        option.textContent=
          `${index+1}. ${name}`;

        select.appendChild(option);
      }
    );
  }

  select.value=trackIndex;

  document.getElementById(
    "bankText"
  ).textContent=
    Math.floor(bank);

  document.getElementById(
    "bet"
  ).value=currentBet;
}


/* ============================================================
   TRACK
============================================================ */

function buildTrack(seed){

  const rnd=
    seededRandom(seed);

  track=[];
  obstacles=[];

  const total=
    1800+
    Math.floor(rnd()*700);

  let px=0;
  let py=0;
  let angle=0;

  for(
    let i=0;
    i<total;
    i++
  ){

    const turn=
      Math.sin(
        i*.021+seed
      )*.026+
      (rnd()-.5)*.018;

    angle+=turn;

    px+=
      Math.cos(angle)*4.2;

    py+=
      Math.sin(angle)*4.2;

    if(i<180){
      angle*=.985;
    }

    track.push({
      x:px,
      y:py
    });
  }

  /*
    Smooth the generated track.
  */

  for(
    let pass=0;
    pass<2;
    pass++
  ){

    const copy=
      track.map(p=>({
        x:p.x,
        y:p.y
      }));

    for(
      let i=1;
      i<track.length-1;
      i++
    ){

      track[i].x=
        (
          copy[i-1].x+
          copy[i].x*2+
          copy[i+1].x
        )/4;

      track[i].y=
        (
          copy[i-1].y+
          copy[i].y*2+
          copy[i+1].y
        )/4;
    }
  }


  /*
    Obstacles.

    They are deliberately spread around the
    track instead of being placed directly
    in one fixed racing line.
  */

  for(
    let i=150;
    i<track.length-80;
    i+=Math.floor(
      75+rnd()*80
    )
  ){

    if(rnd()<.72){

      obstacles.push({

        s:i,

        side:
          rnd()>.5
            ?1
            :-1,

        type:
          rnd()<.5
            ?"bumper"
            :"block",

        size:
          8+rnd()*8,

        /*
          A little variation in obstacle
          position makes every race different.
        */

        offset:
          (rnd()-.5)*18
      });
    }
  }

  return track;
}


/* ============================================================
   TRACK SAMPLING
============================================================ */

function sample(s){

  if(!track.length){

    return {
      x:0,
      y:0
    };
  }

  s=clamp(
    s,
    0,
    track.length-1
  );

  const i=Math.floor(s);

  const f=s-i;

  const a=track[i];

  const b=
    track[
      Math.min(
        i+1,
        track.length-1
      )
    ];

  return {
    x:lerp(a.x,b.x,f),
    y:lerp(a.y,b.y,f)
  };
}


function tan(s){

  const a=
    sample(
      clamp(
        s-1,
        0,
        track.length-1
      )
    );

  const b=
    sample(
      clamp(
        s+1,
        0,
        track.length-1
      )
    );

  const dx=b.x-a.x;
  const dy=b.y-a.y;

  const len=
    Math.hypot(dx,dy)||1;

  return {
    x:dx/len,
    y:dy/len
  };
}


/* ============================================================
   TRACK CURVATURE
============================================================ */

function curvatureAt(s){

  const a=tan(
    clamp(
      s-5,
      0,
      track.length-1
    )
  );

  const b=tan(
    clamp(
      s+5,
      0,
      track.length-1
    )
  );

  const cross=
    a.x*b.y-
    a.y*b.x;

  /*
    Positive = turning one direction.
    Negative = turning the other.
  */

  return cross/10;
}


/* ============================================================
   MARBLES
============================================================ */

function makeMarbles(){

  marble=
    racerData.map(
      (r,i)=>({

        ...r,

        /*
          Longitudinal track position.
        */

        s:-i*9,

        /*
          Forward velocity.
        */

        v:
          25+
          Math.random()*8,

        /*
          Actual lateral position.
        */

        lane:
          (i-3.5)*7,

        /*
          Actual lateral velocity.

          This is the major difference from
          the old physics.
        */

        laneV:
          (Math.random()-.5)*1.5,

        /*
          Individual physical characteristics.
        */

        mass:
          .92+
          Math.random()*.16,

        restitution:
          .55+
          Math.random()*.15,

        rollingResistance:
          .7+
          Math.random()*.2,

        grip:
          .72+
          Math.random()*.25,

        wobble:
          Math.random()*Math.PI*2,

        finished:false,

        finishTime:0,

        hitCooldown:0,

        wallCooldown:0,

        impact:0,

        spin:Math.random()*Math.PI*2
      })
    );
}


/* ============================================================
   CAMERA RESET
============================================================ */

function resetCameras(){

  if(!marble.length)return;

  const me=
    marble.find(
      m=>m.id===selected
    )||
    marble[0];

  const p=sample(me.s);
  const t=tan(me.s);

  spectatorX=p.x;
  spectatorY=p.y;

  fpX=p.x;
  fpY=p.y;

  fpAngle=
    Math.atan2(
      t.y,
      t.x
    );

  cameraShake=0;
}


/* ============================================================
   PHYSICS HELPERS
============================================================ */

/*
  Convert a local track coordinate into
  a real world position.

  This is used for collision calculations.
*/

function worldPosition(m){

  const p=sample(m.s);
  const t=tan(m.s);

  const rx=-t.y;
  const ry=t.x;

  return {
    x:
      p.x+
      rx*m.lane,

    y:
      p.y+
      ry*m.lane
  };
}


/*
  Calculate how much the track is turning.

  Fast marbles naturally want to continue
  straight, so curvature pushes them outward.
*/

function applyCornering(m,dt){

  const curvature=
    curvatureAt(m.s);

  /*
    Centrifugal force.

    Higher speed = dramatically more lateral
    force, just like a real marble entering
    a bend too quickly.
  */

  const force=
    curvature*
    m.v*
    m.v*
    .018;

  m.laneV+=
    force*
    dt/
    m.mass;
}


/*
  Wall collision.

  The walls are not invisible rails.

  A marble can reach them, hit them,
  bounce, lose energy, and move back
  onto the track.
*/

function handleWalls(m){

  const halfWidth=54;

  const radius=4.5;

  const limit=
    halfWidth-radius;

  if(
    m.lane>
    limit
  ){

    m.lane=limit;

    if(
      m.laneV>0
    ){

      m.laneV=
        -m.laneV*
        m.restitution;

      /*
        Tangential friction against wall.
      */

      m.v*=
        .94;

      /*
        Slightly spin the marble
        when it hits.
      */

      m.spin+=
        m.laneV*.03;

      m.impact=
        Math.max(
          m.impact,
          Math.abs(m.laneV)
        );

      cameraShake=
        Math.max(
          cameraShake,
          .06
        );
    }

  }else if(
    m.lane<
    -limit
  ){

    m.lane=-limit;

    if(
      m.laneV<0
    ){

      m.laneV=
        -m.laneV*
        m.restitution;

      m.v*=.94;

      m.spin+=
        m.laneV*.03;

      m.impact=
        Math.max(
          m.impact,
          Math.abs(m.laneV)
        );

      cameraShake=
        Math.max(
          cameraShake,
          .06
        );
    }
  }
}


/*
  Obstacle collision.

  Instead of merely multiplying speed by .72,
  the obstacle produces an actual impulse.
*/

function handleObstacles(m){

  if(
    m.hitCooldown>0
  )return;

  const marbleRadius=4.5;

  for(
    const o of obstacles
  ){

    const ds=
      o.s-m.s;

    /*
      Collision zone.
    */

    if(
      Math.abs(ds)>
      7
    )continue;

    /*
      Obstacle's lateral location.
    */

    const obstacleLane=
      o.side*
      o.size+
      o.offset;

    const dl=
      obstacleLane-
      m.lane;

    const collisionWidth=
      o.size+
      marbleRadius+
      3;

    if(
      Math.abs(dl)>
      collisionWidth
    ){
      continue;
    }

    /*
      We have a collision.
    */

    const sign=
      dl>=0
        ?1
        :-1;

    /*
      Strong lateral impulse.

      This is what actually knocks a marble
      out of its previous racing line.
    */

    const lateralImpulse=
      (
        8+
        Math.abs(m.v)*.18
      )*
      sign/
      m.mass;

    m.laneV+=
      lateralImpulse;

    /*
      Different obstacles affect speed
      differently.
    */

    if(
      o.type==="bumper"
    ){

      m.v*=
        .86;

      /*
        Bumpers give energy back
        laterally.
      */

      m.laneV+=
        sign*
        (
          7+
          Math.random()*5
        );

    }else{

      m.v*=
        .72;

      /*
        Blocks cause a sharper,
        less elastic impact.
      */

      m.laneV+=
        sign*
        (
          10+
          Math.random()*8
        );
    }

    /*
      A small forward/backward impulse.
    */

    m.v+=
      (
        Math.random()-.5
      )*
      5;

    m.v=clamp(
      m.v,
      8,
      65
    );

    /*
      Prevent repeated collision every frame.
    */

    m.hitCooldown=
      .18+
      Math.random()*.12;

    m.impact=
      Math.max(
        m.impact,
        Math.abs(lateralImpulse)
      );

    m.spin+=
      lateralImpulse*.12;

    cameraShake=
      Math.max(
        cameraShake,
        .16
      );

    /*
      Slightly move the marble away
      from the obstacle immediately.
    */

    m.lane+=
      sign*
      Math.min(
        5,
        collisionWidth-
        Math.abs(dl)
      );
  }
}


/* ============================================================
   MARBLE VS MARBLE COLLISIONS
============================================================ */

function handleMarbleCollisions(){

  const radius=4.5;

  for(
    let i=0;
    i<marble.length;
    i++
  ){

    const a=marble[i];

    if(a.finished)continue;

    for(
      let j=i+1;
      j<marble.length;
      j++
    ){

      const b=marble[j];

      if(b.finished)continue;

      /*
        Compare positions in the local track
        coordinate system.

        This means marbles can collide even
        when they are not exactly side-by-side.
      */

      const ds=
        b.s-a.s;

      const dl=
        b.lane-a.lane;

      const distance=
        Math.hypot(
          ds,
          dl
        );

      const minDistance=
        radius*2.05;

      if(
        distance>=minDistance||
        distance<.0001
      ){
        continue;
      }

      /*
        Collision normal.
      */

      const nx=
        ds/distance;

      const ny=
        dl/distance;

      /*
        Relative velocity.
      */

      const relativeForward=
        b.v-a.v;

      const relativeLateral=
        b.laneV-a.laneV;

      const relativeAlongNormal=
        relativeForward*nx+
        relativeLateral*ny;

      /*
        If they are separating,
        only resolve overlap.
      */

      if(
        relativeAlongNormal<0
      ){

        const restitution=
          Math.min(
            a.restitution,
            b.restitution
          );

        const impulse=
          -(1+restitution)*
          relativeAlongNormal/
          (
            1/a.mass+
            1/b.mass
          );

        /*
          Forward impulse.
        */

        a.v-=
          impulse*
          nx/
          a.mass;

        b.v+=
          impulse*
          nx/
          b.mass;

        /*
          Lateral impulse.
        */

        a.laneV-=
          impulse*
          ny/
          a.mass;

        b.laneV+=
          impulse*
          ny/
          b.mass;
      }

      /*
        Positional correction.

        This prevents the marbles from becoming
        stuck inside one another.
      */

      const overlap=
        minDistance-
        distance;

      const correction=
        Math.max(
          0,
          overlap*.52
        );

      a.s-=
        nx*
        correction;

      b.s+=
        nx*
        correction;

      a.lane-=
        ny*
        correction;

      b.lane+=
        ny*
        correction;

      /*
        Tiny visual impact.
      */

      a.impact=
        Math.max(
          a.impact,
          Math.abs(relativeAlongNormal)
        );

      b.impact=
        Math.max(
          b.impact,
          Math.abs(relativeAlongNormal)
        );

      a.spin+=
        ny*.2;

      b.spin-=
        ny*.2;
    }
  }
}


/* ============================================================
   RACE PHYSICS
============================================================ */

function updateRace(dt){

  if(state==="countdown"){

    countdown-=dt;

    if(countdown<=0){

      state="race";

      document.getElementById(
        "message"
      ).textContent="GO!";

      tone(880,.12);

      setTimeout(()=>{

        if(state==="race"){

          document.getElementById(
            "message"
          ).textContent="";
        }

      },500);

    }else{

      document.getElementById(
        "message"
      ).textContent=
        Math.ceil(countdown);
    }

    return;
  }

  if(
    state!=="race"||
    paused
  ){
    return;
  }

  raceTime+=dt;

  const leaderDistance=
    track.length-30;


  /*
    ==========================================================
    PHASE 1
    Apply physical forces
    ==========================================================
  */

  marble.forEach(
    (m,index)=>{

      if(m.finished)return;

      /*
        Timers.
      */

      m.hitCooldown=
        Math.max(
          0,
          m.hitCooldown-dt
        );

      m.wallCooldown=
        Math.max(
          0,
          m.wallCooldown-dt
        );

      /*
        ------------------------------------------------------
        Rolling / gravity-like acceleration
        ------------------------------------------------------

        Marbles have slightly different natural
        rolling characteristics.

        There is deliberately NO fixed target
        speed anymore.
      */

      const baseDrive=
        15+
        Math.sin(
          raceTime*.37+
          m.wobble
        )*
        1.4;

      /*
        Faster marbles experience more drag.
      */

      const aerodynamicDrag=
        m.v*
        m.v*
        .012;

      /*
        Rolling resistance.
      */

      const rolling=
        m.rollingResistance*
        .55;

      /*
        Net forward acceleration.
      */

      const acceleration=
        baseDrive-
        aerodynamicDrag-
        rolling;

      m.v+=
        acceleration*
        dt;


      /*
        Small individual variation.
      */

      m.v+=
        Math.sin(
          raceTime*
          (.65+m.grip*.2)+
          m.wobble
        )*
        .08*
        dt;


      /*
        Cornering.

        The faster a marble enters a bend,
        the more it wants to slide outward.
      */

      applyCornering(
        m,
        dt
      );


      /*
        Lateral friction.

        This gives some grip, but does NOT
        force the marble back to its lane.
      */

      const lateralDrag=
        1.4+
        m.grip*.9;

      m.laneV*=
        Math.max(
          0,
          1-
          lateralDrag*
          dt
        );


      /*
        Lateral position.
      */

      m.lane+=
        m.laneV*
        dt;


      /*
        Forward position.
      */

      m.s+=
        Math.max(
          0,
          m.v
        )*
        dt;


      /*
        Spin.
      */

      m.spin+=
        m.v*
        dt*
        .08;


      /*
        Impact decays.
      */

      m.impact=
        Math.max(
          0,
          m.impact-
          dt*12
        );


      /*
        Speed limits.

        These are physical safety bounds rather
        than a target speed.
      */

      m.v=clamp(
        m.v,
        8,
        65
      );


      /*
        Walls.
      */

      handleWalls(m);


      /*
        Obstacles.
      */

      handleObstacles(m);


      /*
        Finish.
      */

      if(
        m.s>=leaderDistance
      ){

        m.finished=true;

        m.finishTime=
          raceTime;

        finishOrder.push(m);

        tone(
          520+
          finishOrder.length*60,
          .08
        );
      }
    }
  );


  /*
    ==========================================================
    PHASE 2
    Marble-to-marble collisions
    ==========================================================
  */

  handleMarbleCollisions();


  /*
    ==========================================================
    PHASE 3
    Check finish
    ==========================================================
  */

  if(
    finishOrder.length>=
    marble.length-1
  ){

    setTimeout(()=>{

      if(state==="race"){
        finishRace();
      }

    },700);
  }
}

/* ============================================================
   FIRST PERSON
============================================================ */

function drawFirstPerson(){

  drawBackground();

  const me=
    marble.find(
      m=>m.id===selected
    )||
    marble[0];

  if(
    !me||
    !track.length
  )return;

  const target=
    sample(me.s);

  const targetT=
    tan(me.s);

  const desiredAngle=
    Math.atan2(
      targetT.y,
      targetT.x
    );

  const cameraBack=13;

  const desiredX=
    target.x-
    targetT.x*
    cameraBack;

  const desiredY=
    target.y-
    targetT.y*
    cameraBack;

  const cameraSmooth=
    Math.min(
      1,
      7*.016
    );

  fpX+=
    (
      desiredX-fpX
    )*
    cameraSmooth;

  fpY+=
    (
      desiredY-fpY
    )*
    cameraSmooth;

  let angleDifference=
    desiredAngle-
    fpAngle;

  while(
    angleDifference>
    Math.PI
  ){
    angleDifference-=
      Math.PI*2;
  }

  while(
    angleDifference<
    -Math.PI
  ){
    angleDifference+=
      Math.PI*2;
  }

  fpAngle+=
    angleDifference*.075;

  const cameraPoint={
    x:fpX,
    y:fpY
  };

  const tangent={
    x:Math.cos(fpAngle),
    y:Math.sin(fpAngle)
  };

  const horizonY=H*.36;
  const focal=H*.82;
  const cameraHeight=6;
  const roadWidth=78;


  function project(
    wx,
    wy,
    height=0
  ){

    const dx=
      wx-cameraPoint.x;

    const dy=
      wy-cameraPoint.y;

    const rightX=
      -tangent.y;

    const rightY=
      tangent.x;

    const forward=
      dx*tangent.x+
      dy*tangent.y;

    const side=
      dx*rightX+
      dy*rightY;

    if(forward<1){
      return null;
    }

    const scale=
      focal/forward;

    return {

      x:
        W/2+
        side*scale,

      y:
        horizonY+
        (
          cameraHeight-
          height
        )*
        scale,

      scale,
      depth:forward
    };
  }


  /*
    Sky.
  */

  const sky=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H*.6
    );

  sky.addColorStop(
    0,
    "#07111f"
  );

  sky.addColorStop(
    .65,
    "#16384a"
  );

  sky.addColorStop(
    1,
    "#315d4b"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H*.6
  );


  /*
    Ground.
  */

  ctx.fillStyle="#17362b";

  ctx.fillRect(
    0,
    H*.37,
    W,
    H*.63
  );


  const startS=
    Math.max(
      0,
      me.s-10
    );

  const endS=
    Math.min(
      track.length-1,
      me.s+340
    );

  const roadWidthFP=78;


  /*
    Road.
  */

  for(
    let s=startS;
    s<endS;
    s+=3
  ){

    const p=sample(s);
    const t=tan(s);

    const rx=-t.y;
    const ry=t.x;

    const nextS=
      Math.min(
        endS,
        s+3
      );

    const np=
      sample(nextS);

    const nt=
      tan(nextS);

    const left=
      project(
        p.x+
          rx*
          roadWidthFP,
        p.y+
          ry*
          roadWidthFP,
        0
      );

    const right=
      project(
        p.x-
          rx*
          roadWidthFP,
        p.y-
          ry*
          roadWidthFP,
        0
      );

    const nleft=
      project(
        np.x-
          nt.y*
          roadWidthFP,
        np.y+
          nt.x*
          roadWidthFP,
        0
      );

    const nright=
      project(
        np.x+
          nt.y*
          roadWidthFP,
        np.y-
          nt.x*
          roadWidthFP,
        0
      );

    if(
      !left||
      !right||
      !nleft||
      !nright
    )continue;

    ctx.fillStyle=
      Math.floor(s/12)%2
      ?
      "#343b42"
      :
      "#3c4349";

    ctx.beginPath();

    ctx.moveTo(
      left.x,
      left.y
    );

    ctx.lineTo(
      nleft.x,
      nleft.y
    );

    ctx.lineTo(
      nright.x,
      nright.y
    );

    ctx.lineTo(
      right.x,
      right.y
    );

    ctx.closePath();

    ctx.fill();
  }


  /*
    Road edges.
  */

  for(
    const side of [-1,1]
  ){

    ctx.strokeStyle="#76eaff";
    ctx.lineWidth=3;

    ctx.beginPath();

    let started=false;

    for(
      let s=startS;
      s<endS;
      s+=3
    ){

      const p=sample(s);
      const t=tan(s);

      const q=
        project(
          p.x+
            (-t.y)*
            roadWidthFP*
            side,
          p.y+
            t.x*
            roadWidthFP*
            side,
          0
        );

      if(!q)continue;

      if(!started){

        ctx.moveTo(
          q.x,
          q.y
        );

        started=true;

      }else{

        ctx.lineTo(
          q.x,
          q.y
        );
      }
    }

    ctx.stroke();
  }


  /*
    Center markings.
  */

  for(
    let s=
      Math.ceil(startS/12)*12;
    s<endS;
    s+=24
  ){

    const p1=
      sample(s);

    const p2=
      sample(
        Math.min(
          s+8,
          endS
        )
      );

    const a=
      project(
        p1.x,
        p1.y,
        .2
      );

    const b=
      project(
        p2.x,
        p2.y,
        .2
      );

    if(!a||!b)continue;

    ctx.strokeStyle=
      "rgba(255,255,255,.55)";

    ctx.lineWidth=
      Math.max(
        1,
        a.scale*1.2
      );

    ctx.beginPath();

    ctx.moveTo(
      a.x,
      a.y
    );

    ctx.lineTo(
      b.x,
      b.y
    );

    ctx.stroke();
  }


  /*
    Obstacles.
  */

  obstacles
    .filter(
      o=>
        o.s>startS&&
        o.s<endS
    )
    .sort(
      (a,b)=>
        b.s-a.s
    )
    .forEach(o=>{

      const p=sample(o.s);
      const t=tan(o.s);

      const wx=
        p.x+
        (-t.y)*
        (
          o.side*
          o.size+
          o.offset
        );

      const wy=
        p.y+
        t.x*
        (
          o.side*
          o.size+
          o.offset
        );

      const base=
        project(
          wx,
          wy,
          0
        );

      const top=
        project(
          wx,
          wy,
          o.size*2
        );

      if(!base||!top)return;

      const size=
        Math.max(
          2,
          base.scale*
          o.size*
          .7
        );

      if(
        o.type==="bumper"
      ){

        const g=
          ctx.createRadialGradient(
            base.x-size*.3,
            base.y-size*.7,
            size*.05,
            base.x,
            base.y-size*.5,
            size
          );

        g.addColorStop(
          0,
          "#fff"
        );

        g.addColorStop(
          .2,
          "#ffe873"
        );

        g.addColorStop(
          .65,
          "#f39c12"
        );

        g.addColorStop(
          1,
          "#612700"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
          base.x,
          base.y-size*.55,
          size,
          0,
          Math.PI*2
        );

        ctx.fill();

      }else{

        const width=
          size*1.5;

        const height=
          size*2;

        ctx.fillStyle=
          "#521f24";

        ctx.fillRect(
          base.x-width/2,
          base.y-height,
          width,
          height
        );

        ctx.fillStyle=
          "#ff5656";

        ctx.beginPath();

        ctx.moveTo(
          base.x-width/2,
          base.y-height
        );

        ctx.lineTo(
          base.x,
          base.y-height-size*.35
        );

        ctx.lineTo(
          base.x+width/2,
          base.y-height
        );

        ctx.closePath();

        ctx.fill();
      }
    });


  /*
    Other marbles.

    Their actual lane positions are now used,
    so impacts are visible in the camera.
  */

  const others=[];

  marble.forEach(m=>{

    if(
      m.id===me.id
    )return;

    if(
      m.s<startS-30||
      m.s>endS
    )return;

    const p=sample(m.s);
    const t=tan(m.s);

    const q=
      project(
        p.x+
          (-t.y)*m.lane,
        p.y+
          t.x*m.lane,
        4
      );

    if(q){

      others.push({
        m,
        q
      });
    }
  });

  others.sort(
    (a,b)=>
      b.q.depth-
      a.q.depth
  );

  others.forEach(
    ({m,q})=>{

      const r=
        Math.max(
          2,
          Math.min(
            38,
            q.scale*6
          )
        );

      ctx.fillStyle=
        "rgba(0,0,0,.45)";

      ctx.beginPath();

      ctx.ellipse(
        q.x,
        q.y+r*.85,
        r*1.3,
        r*.4,
        0,
        0,
        Math.PI*2
      );

      ctx.fill();

      const g=
        ctx.createRadialGradient(
          q.x-r*.35,
          q.y-r*.45,
          r*.05,
          q.x,
          q.y,
          r
        );

      g.addColorStop(
        0,
        "#fff"
      );

      g.addColorStop(
        .2,
        m.color
      );

      g.addColorStop(
        .75,
        m.color
      );

      g.addColorStop(
        1,
        "#111"
      );

      ctx.fillStyle=g;

      ctx.beginPath();

      ctx.arc(
        q.x,
        q.y,
        r,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.fillStyle=
        "rgba(255,255,255,.65)";

      ctx.beginPath();

      ctx.arc(
        q.x-r*.3,
        q.y-r*.35,
        r*.2,
        0,
        Math.PI*2
      );

      ctx.fill();

      if(r>6){

        ctx.font=
          `bold ${Math.max(
            8,
            Math.min(
              16,
              r*1.4
            )
          )}px Arial`;

        ctx.textAlign="center";

        ctx.fillStyle=
          "rgba(0,0,0,.6)";

        const tw=
          ctx.measureText(
            m.name
          ).width+10;

        ctx.fillRect(
          q.x-tw/2,
          q.y-r*2,
          tw,
          16
        );

        ctx.fillStyle="#fff";

        ctx.fillText(
          m.name,
          q.x,
          q.y-r*.9
        );
      }
    }
  );


  /*
    Speed streaks.
  */

  const speedIntensity=
    clamp(
      (me.v-25)/40,
      0,
      1
    );

  if(
    speedIntensity>.05
  ){

    ctx.strokeStyle=
      `rgba(190,235,255,${
        .12*
        speedIntensity
      })`;

    ctx.lineWidth=1;

    for(
      let i=0;
      i<30;
      i++
    ){

      const x=
        Math.random()*W;

      const y=
        H*.4+
        Math.random()*H*.55;

      const length=
        (
          15+
          Math.random()*100
        )*
        speedIntensity;

      ctx.beginPath();

      ctx.moveTo(
        x,
        y
      );

      ctx.lineTo(
        x,
        y+length
      );

      ctx.stroke();
    }
  }


  /*
    Vignette.
  */

  const vignette=
    ctx.createRadialGradient(
      W/2,
      H/2,
      H*.1,
      W/2,
      H/2,
      H*.75
    );

  vignette.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  vignette.addColorStop(
    .72,
    "rgba(0,0,0,.08)"
  );

  vignette.addColorStop(
    1,
    "rgba(0,0,0,.62)"
  );

  ctx.fillStyle=vignette;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}


/* ============================================================
   3D SPECTATOR
============================================================ */

function drawSpectator(){

  drawBackground();

  if(
    !track.length||
    !marble.length
  )return;

  const leader=
    marble.reduce(
      (a,b)=>
        b.s>a.s?b:a,
      marble[0]
    );

  /*
    Follow behind the leader.
  */

  const camS=
    Math.max(
      0,
      leader.s-125
    );

  const cp=
    sample(camS);

  const lookS=
    Math.min(
      track.length-1,
      leader.s+90
    );

  const lp=
    sample(lookS);

  const dx=
    lp.x-cp.x;

  const dy=
    lp.y-cp.y;

  const len=
    Math.hypot(dx,dy)||1;

  const forwardX=
    dx/len;

  const forwardY=
    dy/len;

  const rightX=
    -forwardY;

  const rightY=
    forwardX;

  const horizon=
    H*.27;

  const focal=
    H*.95;

  const roadWidth=58;


  function project(
    wx,
    wy,
    height=0
  ){

    const vx=
      wx-cp.x;

    const vy=
      wy-cp.y;

    const forward=
      vx*forwardX+
      vy*forwardY;

    const side=
      vx*rightX+
      vy*rightY;

    if(forward<2){
      return null;
    }

    const scale=
      focal/forward;

    return {

      x:
        W*.5+
        side*scale,

      y:
        horizon+
        (8-height)*
        scale,

      scale,
      depth:forward
    };
  }


  /*
    Sky.
  */

  const sky=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H*.6
    );

  sky.addColorStop(
    0,
    "#07111f"
  );

  sky.addColorStop(
    .55,
    "#123449"
  );

  sky.addColorStop(
    1,
    "#285044"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H*.6
  );


  /*
    Horizon glow.
  */

  const glow=
    ctx.createRadialGradient(
      W*.5,
      H*.28,
      10,
      W*.5,
      H*.28,
      W*.6
    );

  glow.addColorStop(
    0,
    "rgba(255,220,150,.3)"
  );

  glow.addColorStop(
    1,
    "rgba(255,220,150,0)"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(
    0,
    0,
    W,
    H*.6
  );


  /*
    Distant hills.
  */

  ctx.fillStyle="#142e27";

  ctx.beginPath();

  ctx.moveTo(
    0,
    H*.39
  );

  for(
    let x=0;
    x<=W;
    x+=30
  ){

    const y=
      H*.38+
      Math.sin(x*.008)*20+
      Math.sin(x*.022)*12;

    ctx.lineTo(
      x,
      y
    );
  }

  ctx.lineTo(
    W,
    H
  );

  ctx.lineTo(
    0,
    H
  );

  ctx.closePath();

  ctx.fill();


  /*
    Ground.
  */

  ctx.fillStyle="#17352a";

  ctx.fillRect(
    0,
    H*.42,
    W,
    H*.58
  );


  const visibleStart=
    Math.max(
      0,
      camS-30
    );

  const visibleEnd=
    Math.min(
      track.length-1,
      camS+390
    );


  /*
    Road segments.
  */

  const segments=[];

  for(
    let s=visibleStart;
    s<=visibleEnd;
    s+=3
  ){

    const p=sample(s);
    const t=tan(s);

    const L=
      project(
        p.x-
          t.y*
          roadWidth,
        p.y+
          t.x*
          roadWidth,
        0
      );

    const R=
      project(
        p.x+
          t.y*
          roadWidth,
        p.y-
          t.x*
          roadWidth,
        0
      );

    if(L&&R){

      segments.push({
        s,
        L,
        R
      });
    }
  }


  /*
    Road.
  */

  for(
    let i=0;
    i<segments.length-1;
    i++
  ){

    const a=segments[i];
    const b=segments[i+1];

    ctx.fillStyle=
      Math.floor(a.s/15)%2
      ?
      "#353c42"
      :
      "#41484e";

    ctx.beginPath();

    ctx.moveTo(
      a.L.x,
      a.L.y
    );

    ctx.lineTo(
      b.L.x,
      b.L.y
    );

    ctx.lineTo(
      b.R.x,
      b.R.y
    );

    ctx.lineTo(
      a.R.x,
      a.R.y
    );

    ctx.closePath();

    ctx.fill();
  }


  /*
    Track edges.
  */

  for(
    const side of [-1,1]
  ){

    ctx.strokeStyle=
      "rgba(130,235,255,.9)";

    ctx.lineWidth=3;

    ctx.beginPath();

    let started=false;

    for(
      let s=visibleStart;
      s<=visibleEnd;
      s+=3
    ){

      const p=sample(s);
      const t=tan(s);

      const q=
        project(
          p.x+
            (-t.y)*
            roadWidth*
            side,
          p.y+
            t.x*
            roadWidth*
            side,
          0
        );

      if(!q)continue;

      if(!started){

        ctx.moveTo(
          q.x,
          q.y
        );

        started=true;

      }else{

        ctx.lineTo(
          q.x,
          q.y
        );
      }
    }

    ctx.stroke();
  }


  /*
    Center stripes.
  */

  for(
    let s=
      Math.ceil(
        visibleStart/18
      )*18;
    s<visibleEnd;
    s+=36
  ){

    const a=
      project(
        sample(s).x,
        sample(s).y,
        .2
      );

    const end=
      Math.min(
        visibleEnd,
        s+12
      );

    const b=
      project(
        sample(end).x,
        sample(end).y,
        .2
      );

    if(!a||!b)continue;

    ctx.strokeStyle=
      "rgba(255,255,255,.42)";

    ctx.lineWidth=
      Math.max(
        1,
        a.scale
      );

    ctx.beginPath();

    ctx.moveTo(
      a.x,
      a.y
    );

    ctx.lineTo(
      b.x,
      b.y
    );

    ctx.stroke();
  }


  /*
    3D roadside posts.
  */

  for(
    let s=
      Math.ceil(
        visibleStart/20
      )*20;
    s<visibleEnd;
    s+=20
  ){

    const p=sample(s);
    const t=tan(s);

    for(
      const side of [-1,1]
    ){

      const wx=
        p.x+
        (-t.y)*
        (roadWidth+12)*
        side;

      const wy=
        p.y+
        t.x*
        (roadWidth+12)*
        side;

      const base=
        project(
          wx,
          wy,
          0
        );

      const top=
        project(
          wx,
          wy,
          18
        );

      if(!base||!top)continue;

      const width=
        Math.max(
          2,
          base.scale*3
        );

      ctx.fillStyle=
        "#26353c";

      ctx.fillRect(
        base.x-width/2,
        top.y,
        width,
        base.y-top.y
      );

      ctx.fillStyle=
        "#70f4ff";

      ctx.fillRect(
        base.x-width/2,
        top.y,
        width,
        Math.max(
          1,
          width*.18
        )
      );
    }
  }


  /*
    Obstacles.
  */

  obstacles
    .filter(
      o=>
        o.s>=visibleStart&&
        o.s<=visibleEnd
    )
    .sort(
      (a,b)=>
        b.s-a.s
    )
    .forEach(o=>{

      const p=sample(o.s);
      const t=tan(o.s);

      const lane=
        o.side*
        o.size+
        o.offset;

      const base=
        project(
          p.x+
            (-t.y)*lane,
          p.y+
            t.x*lane,
          0
        );

      const top=
        project(
          p.x+
            (-t.y)*lane,
          p.y+
            t.x*lane,
          o.size*2.2
        );

      if(!base||!top)return;

      const size=
        Math.max(
          3,
          base.scale*
          o.size*.75
        );

      if(
        o.type==="bumper"
      ){

        const g=
          ctx.createRadialGradient(
            base.x-size*.3,
            top.y-size*.3,
            size*.05,
            base.x,
            base.y-size*.35,
            size
          );

        g.addColorStop(
          0,
          "#fff"
        );

        g.addColorStop(
          .2,
          "#ffe873"
        );

        g.addColorStop(
          .7,
          "#e67e22"
        );

        g.addColorStop(
          1,
          "#6b300d"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
          base.x,
          base.y-size*.55,
          size,
          0,
          Math.PI*2
        );

        ctx.fill();

      }else{

        const width=
          size*1.25;

        const height=
          size*1.7;

        ctx.fillStyle=
          "rgba(0,0,0,.35)";

        ctx.fillRect(
          base.x-width*.6,
          base.y-height*.05,
          width*1.2,
          height*.25
        );

        ctx.fillStyle=
          "#512126";

        ctx.fillRect(
          base.x-width*.5,
          base.y-height,
          width,
          height
        );

        ctx.fillStyle=
          "#ff5656";

        ctx.beginPath();

        ctx.moveTo(
          base.x-width*.5,
          base.y-height
        );

        ctx.lineTo(
          base.x,
          base.y-height-size*.35
        );

        ctx.lineTo(
          base.x+width*.5,
          base.y-height
        );

        ctx.closePath();

        ctx.fill();
      }
    });


  /*
    Marbles.
  */

  const visibleMarbles=
    marble
      .filter(
        m=>
          m.s>=visibleStart-30&&
          m.s<=visibleEnd
      )
      .map(m=>{

        const p=sample(m.s);
        const t=tan(m.s);

        const q=
          project(
            p.x+
              (-t.y)*m.lane,
            p.y+
              t.x*m.lane,
            4
          );

        return {
          m,
          p:q
        };
      })
      .filter(
        x=>x.p
      )
      .sort(
        (a,b)=>
          b.p.depth-
          a.p.depth
      );


  visibleMarbles.forEach(
    ({m,p})=>{

      const r=
        Math.max(
          3,
          Math.min(
            36,
            p.scale*6.5
          )
        );

      ctx.fillStyle=
        "rgba(0,0,0,.45)";

      ctx.beginPath();

      ctx.ellipse(
        p.x,
        p.y+r*.9,
        r*1.25,
        r*.38,
        0,
        0,
        Math.PI*2
      );

      ctx.fill();


      const gradient=
        ctx.createRadialGradient(
          p.x-r*.35,
          p.y-r*.45,
          r*.05,
          p.x,
          p.y,
          r
        );

      gradient.addColorStop(
        0,
        "#fff"
      );

      gradient.addColorStop(
        .18,
        m.color
      );

      gradient.addColorStop(
        .72,
        m.color
      );

      gradient.addColorStop(
        1,
        "#111"
      );

      ctx.fillStyle=gradient;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        r,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.fillStyle=
        "rgba(255,255,255,.7)";

      ctx.beginPath();

      ctx.arc(
        p.x-r*.32,
        p.y-r*.35,
        r*.22,
        0,
        Math.PI*2
      );

      ctx.fill();


      if(
        m.id===selected
      ){

        ctx.strokeStyle="#fff";

        ctx.lineWidth=
          Math.max(
            1.5,
            r*.12
          );

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          r*1.45,
          0,
          Math.PI*2
        );

        ctx.stroke();
      }


      if(r>5){

        ctx.font=
          `bold ${Math.max(
            8,
            Math.min(
              16,
              r*1.5
            )
          )}px Arial`;

        ctx.textAlign="center";

        const nameWidth=
          ctx.measureText(
            m.name
          ).width+12;

        ctx.fillStyle=
          "rgba(0,0,0,.65)";

        ctx.fillRect(
          p.x-nameWidth/2,
          p.y-r*2.15,
          nameWidth,
          Math.max(
            12,
            r*1.2
          )
        );

        ctx.fillStyle="#fff";

        ctx.fillText(
          m.name,
          p.x,
          p.y-r*1.3
        );
      }
    }
  );


  /*
    Speed effects.
  */

  const me=
    marble.find(
      m=>m.id===selected
    )||
    leader;

  const intensity=
    clamp(
      (me.v-25)/33,
      0,
      1
    );

  if(
    intensity>.05
  ){

    ctx.strokeStyle=
      `rgba(190,230,255,${
        .1*intensity
      })`;

    ctx.lineWidth=1;

    for(
      let i=0;
      i<28;
      i++
    ){

      const x=
        Math.random()*W;

      const y=
        H*.43+
        Math.random()*H*.5;

      const length=
        (
          20+
          Math.random()*90
        )*
        intensity;

      ctx.beginPath();

      ctx.moveTo(
        x,
        y
      );

      ctx.lineTo(
        x,
        y+length
      );

      ctx.stroke();
    }
  }


  /*
    Vignette.
  */

  const vignette=
    ctx.createRadialGradient(
      W*.5,
      H*.5,
      H*.1,
      W*.5,
      H*.5,
      H*.8
    );

  vignette.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  vignette.addColorStop(
    .7,
    "rgba(0,0,0,.08)"
  );

  vignette.addColorStop(
    1,
    "rgba(0,0,0,.65)"
  );

  ctx.fillStyle=vignette;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}


/* ============================================================
   RENDER
============================================================ */

function render(){

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );

  if(
    state==="race"||
    state==="countdown"
  ){

    if(firstPerson){
      drawFirstPerson();
    }else{
      drawSpectator();
    }

  }else{

    drawBackground();
  }
}


/* ============================================================
   START
============================================================ */

function start(){

  const betValue=
    Math.floor(
      Number(
        document.getElementById("bet").value
      )||0
    );

  currentBet=
    clamp(
      betValue,
      0,
      bank
    );

  bank-=currentBet;

  trackIndex=
    parseInt(
      document.getElementById(
        "trackSelect"
      ).value,
      10
    )||0;

  buildTrack(
    trackIndex+1
  );

  makeMarbles();

  state="countdown";

  paused=false;

  raceTime=0;

  countdown=3.2;

  finishOrder=[];

  cameraShake=0;

  resetCameras();

  document
    .getElementById("menu")
    .classList.add("hidden");

  document
    .getElementById("finishPanel")
    .classList.add("hidden");

  document
    .getElementById("hud")
    .style.display="block";

  document
    .getElementById("message")
    .textContent="3";

  tone(
    440,
    .12
  );
}


/* ============================================================
   RESTART
============================================================ */

function restart(){

  if(
    state==="menu"
  )return;

  const oldBet=
    currentBet;

  bank+=oldBet;

  document.getElementById(
    "bet"
  ).value=oldBet;

  start();
}


/* ============================================================
   FINISH
============================================================ */

function finishRace(){

  if(
    state==="finish"
  )return;

  state="finish";

  const ordered=
    [...finishOrder];

  marble
    .filter(
      m=>!ordered.includes(m)
    )
    .sort(
      (a,b)=>
        b.s-a.s
    )
    .forEach(
      m=>{
        ordered.push(m);
      }
    );

  const winner=
    ordered[0];

  const selectedMarble=
    marble.find(
      m=>m.id===selected
    );

  let payout=0;

  if(
    winner&&
    selectedMarble&&
    winner.id===
    selectedMarble.id
  ){

    payout=
      currentBet*3;

    bank+=payout;
  }

  document.getElementById(
    "winnerText"
  ).textContent=
    winner
      ? `${winner.name.toUpperCase()} WINS!`
      : "RACE COMPLETE";

  const results=
    document.getElementById(
      "results"
    );

  results.innerHTML="";

  ordered.forEach(
    (m,index)=>{

      const div=
        document.createElement(
          "div"
        );

      div.className="result";

      const left=
        document.createElement(
          "div"
        );

      left.className="resultLeft";

      const dot=
        document.createElement(
          "span"
        );

      dot.className=
        "resultDot";

      dot.style.background=
        m.color;

      const name=
        document.createElement(
          "span"
        );

      name.textContent=
        `${index+1}. ${m.name}`;

      left.appendChild(dot);
      left.appendChild(name);

      const time=
        document.createElement(
          "span"
        );

      time.textContent=
        m.finished
          ? `${m.finishTime.toFixed(2)}s`
          : "DNF";

      div.appendChild(left);
      div.appendChild(time);

      results.appendChild(div);
    }
  );

  if(payout>0){

    document.getElementById(
      "payoutText"
    ).textContent=
      `YOU WON $${payout}!`;

  }else{

    document.getElementById(
      "payoutText"
    ).textContent=
      `Bet: $${currentBet} • Winner: ${
        winner
          ? winner.name
          : "—"
      }`;
  }

  document.getElementById(
    "hud"
  ).style.display="none";

  document.getElementById(
    "finishPanel"
  ).style.display="block";

  document.getElementById(
    "bankText"
  ).textContent=
    Math.floor(bank);

  tone(
    winner&&
    winner.id===selected
      ?1000
      :420,
    .35
  );
}


/* ============================================================
   NEXT TRACK
============================================================ */

function nextTrack(){

  trackIndex=
    (
      trackIndex+1
    )%
    trackNames.length;

  document.getElementById(
    "trackSelect"
  ).value=
    trackIndex;

  state="menu";

  paused=false;

  document.getElementById(
    "finishPanel"
  ).style.display="none";

  document.getElementById(
    "menu"
  ).classList.remove("hidden");

  setupMenu();
}


/* ============================================================
   MENU
============================================================ */

function showMenu(){

  state="menu";

  paused=false;

  document.getElementById(
    "finishPanel"
  ).style.display="none";

  document.getElementById(
    "hud"
  ).style.display="none";

  document.getElementById(
    "menu"
  ).classList.remove("hidden");

  document.getElementById(
    "message"
  ).textContent="";

  setupMenu();
}


/* ============================================================
   INPUT
============================================================ */

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  start
);

document.getElementById(
  "nextBtn"
).addEventListener(
  "click",
  nextTrack
);

document.getElementById(
  "menuBtn"
).addEventListener(
  "click",
  showMenu
);


window.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="Space"
    ){

      e.preventDefault();

      if(
        state==="race"||
        state==="countdown"
      ){

        paused=!paused;
      }

      return;
    }


    if(
      e.key.toLowerCase()==="v"
    ){

      if(
        state==="race"||
        state==="countdown"
      ){

        firstPerson=!firstPerson;

        document.getElementById(
          "cameraInfo"
        ).textContent=
          firstPerson
            ? "CAMERA: FIRST PERSON"
            : "CAMERA: 3D SPECTATOR";
      }

      return;
    }


    if(
      e.key.toLowerCase()==="r"
    ){

      if(
        state==="race"||
        state==="countdown"
      ){

        restart();
      }

      return;
    }


    if(
      e.key.toLowerCase()==="m"
    ){

      muted=!muted;

      if(!muted){
        tone(660,.08);
      }

      return;
    }
  }
);


/* ============================================================
   GAME LOOP
============================================================ */

function loop(timestamp){

  if(!lastTime){
    lastTime=timestamp;
  }

  let dt=
    (timestamp-lastTime)/
    1000;

  lastTime=timestamp;

  /*
    Prevent physics exploding after
    switching tabs.
  */

  dt=clamp(
    dt,
    0,
    .033
  );

  updateRace(dt);

  render();

  requestAnimationFrame(
    loop
  );
}


/* ============================================================
   INITIALIZATION
============================================================ */

setupMenu();

buildTrack(1);

makeMarbles();

resetCameras();

document.getElementById(
  "cameraInfo"
).textContent=
  "CAMERA: FIRST PERSON";

requestAnimationFrame(
  loop
);

</script>

</body>
