<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marble Mayhem Deluxe</title>
<style>
    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070b;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #05070b;
    }

    #menu {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }

    .panel {
        width: min(560px, calc(100vw - 30px));
        padding: 28px;
        border-radius: 18px;
        background: rgba(8, 11, 18, .94);
        border: 1px solid rgba(255,255,255,.16);
        box-shadow: 0 20px 80px rgba(0,0,0,.65);
        pointer-events: auto;
        backdrop-filter: blur(12px);
    }

    h1 {
        margin: 0 0 5px;
        font-size: 38px;
        letter-spacing: -1px;
    }

    .subtitle {
        color: #9aa4b2;
        margin-bottom: 22px;
    }

    .row {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 12px 0;
    }

    label {
        color: #aab4c2;
        font-size: 14px;
    }

    select,
    input,
    button {
        border: 0;
        border-radius: 9px;
        padding: 11px 13px;
        font: inherit;
    }

    select,
    input {
        width: 100%;
        color: white;
        background: #171d28;
        outline: 1px solid rgba(255,255,255,.08);
    }

    button {
        cursor: pointer;
        font-weight: bold;
        background: #f1f3f5;
        color: #080a0d;
        transition: transform .12s, filter .12s;
    }

    button:hover {
        filter: brightness(1.12);
        transform: translateY(-1px);
    }

    #startBtn {
        width: 100%;
        margin-top: 16px;
        padding: 14px;
        font-size: 17px;
    }

    .money {
        color: #67e8a5;
        font-weight: bold;
    }

    #hud {
        position: fixed;
        top: 15px;
        left: 15px;
        right: 15px;
        display: none;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
    }

    .hudBox {
        padding: 9px 12px;
        border-radius: 10px;
        background: rgba(0,0,0,.58);
        border: 1px solid rgba(255,255,255,.12);
        text-shadow: 0 2px 4px #000;
        backdrop-filter: blur(5px);
    }

    #countdown {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: clamp(70px, 15vw, 180px);
        font-weight: 900;
        text-shadow: 0 8px 30px #000;
        z-index: 20;
        pointer-events: none;
    }

    #finish {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 30;
    }

    .finishPanel {
        width: min(600px, calc(100vw - 30px));
        padding: 28px;
        border-radius: 18px;
        background: rgba(7,10,16,.96);
        border: 1px solid rgba(255,255,255,.16);
        box-shadow: 0 25px 100px rgba(0,0,0,.75);
    }

    .finishPanel h2 {
        margin: 0 0 15px;
        font-size: 32px;
    }

    #results {
        margin: 15px 0;
    }

    .result {
        display: flex;
        justify-content: space-between;
        padding: 8px 10px;
        margin: 4px 0;
        border-radius: 7px;
        background: rgba(255,255,255,.05);
    }

    .controls {
        color: #9aa4b2;
        font-size: 12px;
        line-height: 1.7;
        margin-top: 14px;
    }
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="menu">
    <div class="panel">
        <h1>Marble Mayhem Deluxe</h1>
        <div class="subtitle">Fast marbles. Short tracks. Maximum chaos.</div>

        <div class="row">
            <div style="flex:1">
                <label for="trackSelect">Track</label>
                <select id="trackSelect"></select>
            </div>

            <div style="flex:1">
                <label for="playerSelect">Your marble</label>
                <select id="playerSelect"></select>
            </div>
        </div>

        <div class="row">
            <div style="flex:1">
                <label for="betInput">Bet</label>
                <input id="betInput" type="number" min="1" step="1" value="25">
            </div>

            <div style="flex:1">
                <label>Bank</label>
                <div class="money" style="padding:11px 0" id="bankDisplay">$100</div>
            </div>
        </div>

        <button id="startBtn">START RACE</button>

        <div class="controls">
            V — switch camera &nbsp; | &nbsp;
            SPACE — pause &nbsp; | &nbsp;
            R — restart &nbsp; | &nbsp;
            M — mute
        </div>
    </div>
</div>

<div id="hud">
    <div class="hudBox" id="hudLeft"></div>
    <div class="hudBox" id="hudRight"></div>
</div>

<div id="countdown"></div>

<div id="finish">
    <div class="finishPanel">
        <h2 id="finishTitle">Race Finished</h2>
        <div id="results"></div>
        <button id="restartBtn" style="width:100%">RACE AGAIN</button>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1, 2);

function resize() {
    W = innerWidth;
    H = innerHeight;
    DPR = Math.min(devicePixelRatio || 1, 2);

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

addEventListener("resize", resize);
resize();


/* =========================================================
   GAME DATA
========================================================= */

const names = [
    "fetson",
    "doober",
    "fadgeril",
    "scrappy doo",
    "scubadaa",
    "pisswolf",
    "malty",
    "morning roll"
];

const colors = [
    "#e74c3c",
    "#3498db",
    "#f1c40f",
    "#9b59b6",
    "#1abc9c",
    "#f39c12",
    "#e67e22",
    "#ecf0f1"
];

const tracks = [
    "Neon Run",
    "Dust Devil",
    "Marble Mountain",
    "The Snake",
    "Turbo Tunnel",
    "Crystal Coast",
    "Red Canyon",
    "The Gauntlet",
    "Moon Rock",
    "Lava Loop",
    "Blue Thunder",
    "Pinball Ridge",
    "Green Machine",
    "The Spiral",
    "Sunset Sprint",
    "Chaos Valley",
    "Rocket Road",
    "Frostbite",
    "Thunder Alley",
    "Golden Mile",
    "Black Diamond",
    "Jungle Run",
    "Final Frenzy",
    "Mayhem Grand Prix"
];

const trackSelect = document.getElementById("trackSelect");
const playerSelect = document.getElementById("playerSelect");
const betInput = document.getElementById("betInput");
const bankDisplay = document.getElementById("bankDisplay");
const menu = document.getElementById("menu");
const hud = document.getElementById("hud");
const hudLeft = document.getElementById("hudLeft");
const hudRight = document.getElementById("hudRight");
const countdown = document.getElementById("countdown");
const finish = document.getElementById("finish");
const results = document.getElementById("results");
const finishTitle = document.getElementById("finishTitle");

tracks.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = t;
    trackSelect.appendChild(o);
});

names.forEach((n, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = n;
    playerSelect.appendChild(o);
});


/* =========================================================
   SETTINGS
========================================================= */

/*
    The original track was around 2200 units long.

    This version is deliberately around 950 units.
    At roughly 30-34 units/sec that gives races in the
    neighborhood of 28-34 seconds.
*/

const TRACK_LENGTH = 960;

const ROAD_HALF = 52;
const MARBLE_RADIUS = 5.0;

/* FAST PHYSICS */

const MAX_SPEED = 35.5;
const MIN_SPEED = 8.0;

const BASE_ACCEL = 13.0;

/*
    Very low drag.
    Marbles should keep almost all of their speed.
*/
const ROLLING_DRAG = 0.004;
const AIR_DRAG = 0.00018;
const CORNER_DRAG = 0.0015;

/*
    Wall impacts mostly reverse lateral motion.
    They should NOT kill forward velocity.
*/
const WALL_RESTITUTION = 0.975;
const WALL_FRICTION = 0.9995;

/*
    Marble collisions are close to elastic.
*/
const MARBLE_RESTITUTION = 0.97;

/*
    Obstacles redirect marbles rather than stopping them.
*/
const OBSTACLE_RESTITUTION = 0.97;


/* =========================================================
   STATE
========================================================= */

let track = [];
let obstacles = [];
let marble = [];

let selected = 0;
let cameraMode = "first";

let raceRunning = false;
let paused = false;
let raceFinished = false;
let countdownActive = false;

let raceTime = 0;
let lastTime = performance.now();

let bank = 100;
let currentBet = 25;

let muted = false;

let audioCtx = null;


/* =========================================================
   AUDIO
========================================================= */

function beep(freq = 440, duration = .08, volume = .035) {
    if (muted) return;

    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.frequency.value = freq;
        osc.type = "sine";

        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioCtx.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}


/* =========================================================
   UTILITY
========================================================= */

function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function smoothstep(t) {
    return t * t * (3 - 2 * t);
}

function wrapS(s) {
    while (s < 0) s += TRACK_LENGTH;
    while (s >= TRACK_LENGTH) s -= TRACK_LENGTH;
    return s;
}

function distanceForward(a, b) {
    let d = b - a;
    while (d < 0) d += TRACK_LENGTH;
    return d;
}


/* =========================================================
   TRACK GENERATION
========================================================= */

function generateTrack(seed) {
    const points = [];
    const step = 4;

    /*
        Deterministic pseudo-random generator.
    */
    let rng = (seed * 99991 + 17) >>> 0;

    function rand() {
        rng ^= rng << 13;
        rng ^= rng >>> 17;
        rng ^= rng << 5;
        return ((rng >>> 0) % 10000) / 10000;
    }

    let x = 0;
    let y = 0;
    let angle = 0;

    const count = Math.floor(TRACK_LENGTH / step);

    /*
        Moderate bends rather than extreme hairpins.
        This keeps speed high and makes walls useful as
        bouncing side barriers.
    */

    const waves = [
        {
            amp: 0.014 + rand() * .006,
            freq: .8 + rand() * .4,
            phase: rand() * 10
        },
        {
            amp: 0.009 + rand() * .005,
            freq: 1.7 + rand() * .7,
            phase: rand() * 10
        },
        {
            amp: 0.005 + rand() * .004,
            freq: 3.4 + rand() * 1.2,
            phase: rand() * 10
        }
    ];

    for (let i = 0; i < count; i++) {
        const s = i * step;
        const u = s / TRACK_LENGTH;

        let turn =
            Math.sin(u * Math.PI * 2 * waves[0].freq + waves[0].phase) * waves[0].amp +
            Math.sin(u * Math.PI * 2 * waves[1].freq + waves[1].phase) * waves[1].amp +
            Math.sin(u * Math.PI * 2 * waves[2].freq + waves[2].phase) * waves[2].amp;

        /*
            Additional smooth long bends.
        */
        turn += Math.sin(u * Math.PI * 4.0 + seed) * .004;

        angle += turn;

        x += Math.cos(angle) * step;
        y += Math.sin(angle) * step;

        points.push({
            x,
            y,
            angle
        });
    }

    /*
        Smooth the heading values.
    */
    for (let pass = 0; pass < 4; pass++) {
        for (let i = 0; i < points.length; i++) {
            const a = points[(i - 1 + points.length) % points.length];
            const b = points[i];
            const c = points[(i + 1) % points.length];

            const dx = c.x - a.x;
            const dy = c.y - a.y;

            b.angle = Math.atan2(dy, dx);
        }
    }

    return points;
}

function sample(s) {
    s = clamp(s, 0, TRACK_LENGTH - .001);

    const step = 4;
    const f = s / step;
    const i = Math.floor(f);
    const t = f - i;

    const a = track[i];
    const b = track[Math.min(i + 1, track.length - 1)];

    return {
        x: lerp(a.x, b.x, t),
        y: lerp(a.y, b.y, t)
    };
}

function tan(s) {
    s = clamp(s, 0, TRACK_LENGTH - .001);

    const step = 4;
    const f = s / step;
    const i = Math.floor(f);

    const a = track[Math.max(0, i)];
    const b = track[Math.min(track.length - 1, i + 1)];

    let dx = b.x - a.x;
    let dy = b.y - a.y;

    const len = Math.hypot(dx, dy) || 1;

    return {
        x: dx / len,
        y: dy / len
    };
}

function trackFrame(s) {
    const p = sample(s);
    const t = tan(s);

    return {
        p,
        t,
        n: {
            x: -t.y,
            y: t.x
        }
    };
}


/* =========================================================
   MARBLE WORLD POSITION
========================================================= */

function marbleWorldPosition(m) {
    const f = trackFrame(m.s);

    return {
        x: f.p.x + f.n.x * m.lane,
        y: f.p.y + f.n.y * m.lane
    };
}


/* =========================================================
   OBSTACLES
========================================================= */

function generateObstacles(seed) {
    obstacles = [];

    let rng = (seed * 7777 + 12345) >>> 0;

    function rand() {
        rng ^= rng << 13;
        rng ^= rng >>> 17;
        rng ^= rng << 5;
        return ((rng >>> 0) % 10000) / 10000;
    }

    /*
        Fewer obstacles than the original.
        They are there to create chaos, not stop races.
    */

    let s = 90;

    while (s < TRACK_LENGTH - 50) {
        s += 90 + rand() * 90;

        if (s > TRACK_LENGTH - 45) break;

        const lane = (rand() * 2 - 1) * 30;

        obstacles.push({
            s,
            lane,
            radius: 6 + rand() * 3,
            type: rand() < .72 ? "bumper" : "block"
        });
    }

    /*
        A few larger center bumpers.
    */
    for (let i = 0; i < 4; i++) {
        obstacles.push({
            s: 110 + i * 210 + rand() * 35,
            lane: (rand() * 2 - 1) * 10,
            radius: 7,
            type: "bumper"
        });
    }
}


/* =========================================================
   MARBLES
========================================================= */

function createMarbles() {
    marble = [];

    const stats = [
        { accel: 1.00, grip: 1.00, mass: 1.00 },
        { accel: 1.05, grip: .96, mass: 1.02 },
        { accel: .98, grip: 1.08, mass: .96 },
        { accel: 1.03, grip: .92, mass: 1.06 },
        { accel: 1.01, grip: 1.02, mass: 1.00 },
        { accel: 1.08, grip: .90, mass: .94 },
        { accel: .97, grip: 1.10, mass: 1.08 },
        { accel: 1.02, grip: .98, mass: 1.01 }
    ];

    for (let i = 0; i < names.length; i++) {
        marble.push({
            id: i,
            name: names[i],
            color: colors[i],

            /*
                Staggered starting positions.
                Starting speed is deliberately high.
            */
            s: -i * 5,
            v: 16.5 + Math.random() * 2.0,

            lane: (i - 3.5) * 7.2,
            laneV: 0,

            radius: MARBLE_RADIUS,

            accelMul: stats[i].accel,
            grip: stats[i].grip,
            mass: stats[i].mass,

            finished: false,
            finishTime: 0,
            place: 0,

            hitFlash: 0,
            wobble: Math.random() * Math.PI * 2
        });
    }
}


/* =========================================================
   COLLISION HELPERS
========================================================= */

/*
    Important:

    We deliberately treat the wall as a side barrier.

    A wall collision changes ONLY the lateral velocity.
    Forward speed is preserved.

    This prevents the old "sticking" behavior where a
    collision repeatedly drained m.v until the marble
    became almost stationary.
*/

function resolveWall(m) {
    const limit = ROAD_HALF - m.radius;

    if (m.lane > limit) {
        m.lane = limit;

        /*
            If travelling outward, bounce inward.
        */
        if (m.laneV > 0) {
            m.laneV = -m.laneV * WALL_RESTITUTION;
        }

        /*
            Tiny amount of lateral friction only.
        */
        m.laneV *= WALL_FRICTION;

        /*
            Absolutely no significant forward-speed loss.
        */
        m.v = Math.max(m.v * .9998, MIN_SPEED);
    }

    if (m.lane < -limit) {
        m.lane = -limit;

        if (m.laneV < 0) {
            m.laneV = -m.laneV * WALL_RESTITUTION;
        }

        m.laneV *= WALL_FRICTION;
        m.v = Math.max(m.v * .9998, MIN_SPEED);
    }
}


function resolveObstacle(m, o) {
    const ds = Math.abs(o.s - m.s);

    /*
        Obstacles only matter when close along the track.
    */
    if (ds > 12) return;

    const laneDistance = o.lane - m.lane;
    const minDist = o.radius + m.radius;

    if (Math.abs(laneDistance) < minDist) {
        const sign = laneDistance >= 0 ? -1 : 1;

        /*
            Push sideways out of the obstacle.
        */
        const overlap = minDist - Math.abs(laneDistance);

        m.lane += sign * (overlap + .15);

        /*
            Bounce lateral velocity.
        */
        m.laneV += sign * 13;
        m.laneV *= OBSTACLE_RESTITUTION;

        /*
            Preserve forward velocity.
        */
        m.v = Math.max(m.v * .999, MIN_SPEED);

        m.hitFlash = .12;
    }
}


function resolveMarbleCollisions() {
    for (let i = 0; i < marble.length; i++) {
        const a = marble[i];

        if (a.finished) continue;

        for (let j = i + 1; j < marble.length; j++) {
            const b = marble[j];

            if (b.finished) continue;

            /*
                Compare along-track and lateral position.
            */
            let ds = b.s - a.s;

            if (ds > TRACK_LENGTH / 2) ds -= TRACK_LENGTH;
            if (ds < -TRACK_LENGTH / 2) ds += TRACK_LENGTH;

            const dl = b.lane - a.lane;

            const dist = Math.hypot(ds, dl);
            const minDist = a.radius + b.radius;

            if (dist >= minDist || dist < .001) continue;

            const nx = ds / dist;
            const ny = dl / dist;

            const relV =
                (b.v - a.v) * nx +
                (b.laneV - a.laneV) * ny;

            /*
                Only resolve if moving toward one another.
            */
            if (relV < 0) {
                const invA = 1 / a.mass;
                const invB = 1 / b.mass;

                const impulse =
                    -(1 + MARBLE_RESTITUTION) *
                    relV /
                    (invA + invB);

                a.v -= impulse * invA * nx;
                a.laneV -= impulse * invA * ny;

                b.v += impulse * invB * nx;
                b.laneV += impulse * invB * ny;
            }

            /*
                Separate overlapping marbles without killing speed.
            */
            const push = (minDist - dist) * .52;

            a.s -= nx * push;
            a.lane -= ny * push;

            b.s += nx * push;
            b.lane += ny * push;

            a.v = clamp(a.v, MIN_SPEED, MAX_SPEED);
            b.v = clamp(b.v, MIN_SPEED, MAX_SPEED);
        }
    }
}


/* =========================================================
   UPDATE PHYSICS
========================================================= */

function updateMarble(m, dt) {
    if (m.finished) return;

    /*
        Forward acceleration is always positive.

        This means a marble that hits a wall does not remain
        slow for the rest of the race.
    */
    const speedRatio = m.v / MAX_SPEED;

    const acceleration =
        BASE_ACCEL *
        m.accelMul *
        (1 - speedRatio * .72);

    m.v += acceleration * dt;

    /*
        Tiny drag only.
    */
    m.v -= m.v * ROLLING_DRAG * dt;
    m.v -= m.v * m.v * AIR_DRAG * dt;

    /*
        Prevent cornering from becoming a giant speed brake.
    */
    const frameAhead = trackFrame(m.s + 8);
    const frameHere = trackFrame(m.s);

    const dot =
        frameAhead.t.x * frameHere.t.x +
        frameAhead.t.y * frameHere.t.y;

    const cornerAmount = Math.max(0, 1 - dot);

    m.v -= m.v * cornerAmount * CORNER_DRAG * dt;

    /*
        Keep racing speed high.
    */
    m.v = clamp(m.v, MIN_SPEED, MAX_SPEED);

    /*
        Lateral steering naturally pulls the marble toward
        its lane while allowing impacts to knock it around.
    */
    const targetLane = clamp(m.lane, -ROAD_HALF + 8, ROAD_HALF - 8);

    /*
        Gentle lateral damping.
    */
    m.laneV *= Math.pow(.35, dt);

    /*
        Small amount of track guidance.
    */
    m.laneV +=
        (-m.lane * .075 * m.grip) * dt;

    /*
        Mild chaos so racers don't form one perfect line.
    */
    m.laneV +=
        Math.sin(raceTime * 2.2 + m.wobble) *
        .06 *
        dt;

    m.lane += m.laneV * dt;

    /*
        Forward movement.
    */
    m.s += m.v * dt;

    /*
        Wall collision.
    */
    resolveWall(m);

    /*
        Obstacles.
    */
    for (const o of obstacles) {
        resolveObstacle(m, o);
    }

    /*
        Another wall check after obstacle response.
    */
    resolveWall(m);

    /*
        Final speed clamp.
    */
    m.v = clamp(m.v, MIN_SPEED, MAX_SPEED);

    m.hitFlash = Math.max(0, m.hitFlash - dt);

    /*
        Finish.
    */
    if (m.s >= TRACK_LENGTH) {
        m.finished = true;
        m.finishTime = raceTime;
        m.place = marble.filter(x => x.finished).length;
        m.s = TRACK_LENGTH;
        m.v = 0;
    }
}


function update(dt) {
    if (!raceRunning || paused || raceFinished || countdownActive) {
        return;
    }

    raceTime += dt;

    /*
        Update all marbles.
    */
    for (const m of marble) {
        updateMarble(m, dt);
    }

    /*
        Resolve marble-to-marble impacts after movement.
    */
    resolveMarbleCollisions();

    /*
        Selected marble.
    */
    if (marble[selected].finished) {
        /*
            Camera remains on selected marble.
        */
    }

    /*
        End race once everybody has finished.
    */
    if (marble.every(m => m.finished)) {
        finishRace();
    }
}


/* =========================================================
   3D PROJECTION
========================================================= */

function project3D(
    x,
    y,
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
) {
    const dx = x - cameraX;
    const dy = y - cameraY;

    const forwardX = Math.cos(cameraAngle);
    const forwardY = Math.sin(cameraAngle);

    const rightX = -Math.sin(cameraAngle);
    const rightY = Math.cos(cameraAngle);

    const depth =
        dx * forwardX +
        dy * forwardY;

    const side =
        dx * rightX +
        dy * rightY;

    if (depth < 1.2) {
        return null;
    }

    const focal = Math.min(W, H) * .82;

    const scale =
        focal /
        Math.max(8, depth + cameraHeight);

    const horizon = H * .38;

    const groundY =
        horizon +
        cameraHeight * scale;

    return {
        x: W / 2 + side * scale,
        y: groundY,
        scale,
        depth
    };
}


/* =========================================================
   NAME LABELS
========================================================= */

function drawNameLabel(m, x, y, radius, selectedLabel = false) {
    /*
        Labels are deliberately drawn after the marble.

        A black backing box guarantees readability against
        both bright track surfaces and dark backgrounds.
    */

    const size = clamp(radius * 1.35, 12, 25);

    ctx.save();

    ctx.font = `900 ${size}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const textWidth = ctx.measureText(m.name).width;
    const padX = 7;
    const padY = 4;

    const boxX = x - textWidth / 2 - padX;
    const boxY = y - radius - size - 8 - padY;
    const boxW = textWidth + padX * 2;
    const boxH = size + padY * 2;

    /*
        Shadow / backing.
    */
    ctx.fillStyle = selectedLabel
        ? "rgba(0,0,0,.88)"
        : "rgba(0,0,0,.78)";

    ctx.beginPath();
    ctx.roundRect(
        boxX,
        boxY,
        boxW,
        boxH,
        Math.min(6, boxH / 3)
    );
    ctx.fill();

    /*
        Selected marble gets a small color border.
    */
    if (selectedLabel) {
        ctx.strokeStyle = m.color;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.lineWidth = Math.max(3, size * .28);
    ctx.strokeStyle = "rgba(0,0,0,.95)";
    ctx.strokeText(
        m.name,
        x,
        boxY + boxH / 2
    );

    ctx.fillStyle = "#ffffff";
    ctx.fillText(
        m.name,
        x,
        boxY + boxH / 2
    );

    ctx.restore();
}


/* =========================================================
   MARBLE DRAWING
========================================================= */

function draw3DMarble(x, y, r, color, selectedMarble = false) {
    if (r < .5) return;

    ctx.save();

    /*
        Shadow.
    */
    ctx.globalAlpha = .35;

    const shadow = ctx.createRadialGradient(
        x,
        y + r * .65,
        0,
        x,
        y + r * .65,
        r * 1.35
    );

    shadow.addColorStop(0, "#000");
    shadow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = shadow;

    ctx.beginPath();
    ctx.ellipse(
        x,
        y + r * .65,
        r * 1.2,
        r * .65,
        0,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.globalAlpha = 1;

    /*
        Marble body.
    */
    const g = ctx.createRadialGradient(
        x - r * .35,
        y - r * .4,
        r * .1,
        x,
        y,
        r
    );

    g.addColorStop(0, "#fff");
    g.addColorStop(.16, color);
    g.addColorStop(.82, color);
    g.addColorStop(1, "rgba(0,0,0,.85)");

    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    if (selectedMarble) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = Math.max(2, r * .11);

        ctx.beginPath();
        ctx.arc(x, y, r * 1.15, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   WORLD TRACK DRAWING
========================================================= */

function drawWorldTrack(
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
) {
    /*
        Draw many cross-sections from near to far.
        This gives the first-person and spectator views
        their pseudo-3D track appearance.
    */

    const maxDistance = 380;
    const step = 5;

    const sections = [];

    /*
        Determine track distance from camera by projecting
        points around the selected marble.
    */
    const me = marble[selected];

    for (
        let ds = -15;
        ds <= maxDistance;
        ds += step
    ) {
        const s = clamp(me.s + ds, 0, TRACK_LENGTH - 1);

        const frame = trackFrame(s);

        const left = {
            x: frame.p.x - frame.n.x * ROAD_HALF,
            y: frame.p.y - frame.n.y * ROAD_HALF
        };

        const right = {
            x: frame.p.x + frame.n.x * ROAD_HALF,
            y: frame.p.y + frame.n.y * ROAD_HALF
        };

        const lp = project3D(
            left.x,
            left.y,
            cameraX,
            cameraY,
            cameraAngle,
            cameraHeight
        );

        const rp = project3D(
            right.x,
            right.y,
            cameraX,
            cameraY,
            cameraAngle,
            cameraHeight
        );

        const cp = project3D(
            frame.p.x,
            frame.p.y,
            cameraX,
            cameraY,
            cameraAngle,
            cameraHeight
        );

        if (lp && rp && cp) {
            sections.push({
                lp,
                rp,
                cp,
                s
            });
        }
    }

    /*
        Far to near.
    */
    sections.sort((a, b) => b.cp.depth - a.cp.depth);

    /*
        Road.
    */
    for (let i = 0; i < sections.length - 1; i++) {
        const a = sections[i];
        const b = sections[i + 1];

        ctx.beginPath();
        ctx.moveTo(a.lp.x, a.lp.y);
        ctx.lineTo(a.rp.x, a.rp.y);
        ctx.lineTo(b.rp.x, b.rp.y);
        ctx.lineTo(b.lp.x, b.lp.y);
        ctx.closePath();

        const stripe =
            Math.floor(a.s / 18) % 2 === 0;

        ctx.fillStyle = stripe
            ? "#242a32"
            : "#20262e";

        ctx.fill();
    }

    /*
        Road edge lines.
    */
    for (let side = -1; side <= 1; side += 2) {
        ctx.beginPath();

        let started = false;

        for (const sec of sections) {
            const p = side < 0 ? sec.lp : sec.rp;

            if (!started) {
                ctx.moveTo(p.x, p.y);
                started = true;
            } else {
                ctx.lineTo(p.x, p.y);
            }
        }

        ctx.strokeStyle = "#e7edf3";
        ctx.lineWidth = 3;
        ctx.globalAlpha = .85;
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    /*
        Center dashed line.
    */
    for (let i = 0; i < sections.length - 1; i += 3) {
        const a = sections[i];
        const b = sections[Math.min(i + 1, sections.length - 1)];

        ctx.strokeStyle = "rgba(255,255,255,.16)";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(a.cp.x, a.cp.y);
        ctx.lineTo(b.cp.x, b.cp.y);
        ctx.stroke();
    }
}


/* =========================================================
   WORLD OBSTACLES
========================================================= */

function drawWorldObstacles(
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
) {
    const me = marble[selected];

    const visible = [];

    for (const o of obstacles) {
        const relative = o.s - me.s;

        if (relative < -30 || relative > 350) {
            continue;
        }

        const frame = trackFrame(o.s);

        const p = {
            x: frame.p.x + frame.n.x * o.lane,
            y: frame.p.y + frame.n.y * o.lane
        };

        const projected = project3D(
            p.x,
            p.y,
            cameraX,
            cameraY,
            cameraAngle,
            cameraHeight
        );

        if (projected) {
            visible.push({
                o,
                p: projected
            });
        }
    }

    visible.sort(
        (a, b) => b.p.depth - a.p.depth
    );

    for (const item of visible) {
        const o = item.o;
        const p = item.p;

        const r =
            Math.max(2, o.radius * p.scale);

        ctx.save();

        if (o.type === "bumper") {
            const g = ctx.createRadialGradient(
                p.x - r * .3,
                p.y - r * .35,
                r * .1,
                p.x,
                p.y,
                r
            );

            g.addColorStop(0, "#ffffff");
            g.addColorStop(.2, "#ffcc66");
            g.addColorStop(1, "#d35400");

            ctx.fillStyle = g;

            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#fff";
            ctx.lineWidth = Math.max(1, r * .1);
            ctx.stroke();
        } else {
            ctx.fillStyle = "#777";
            ctx.fillRect(
                p.x - r,
                p.y - r,
                r * 2,
                r * 2
            );

            ctx.strokeStyle = "#bbb";
            ctx.strokeRect(
                p.x - r,
                p.y - r,
                r * 2,
                r * 2
            );
        }

        ctx.restore();
    }
}


/* =========================================================
   WORLD MARBLES
========================================================= */

function renderMarbles(
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
) {
    const me = marble[selected];

    const visible = [];

    for (const m of marble) {
        if (m.finished && m !== me) continue;

        /*
            Include a little distance behind the camera as well.
            This prevents labels disappearing immediately when
            another racer falls just behind the player.
        */
        const relative = m.s - me.s;

        if (relative < -35 || relative > 340) {
            continue;
        }

        const pos = marbleWorldPosition(m);

        const p = project3D(
            pos.x,
            pos.y,
            cameraX,
            cameraY,
            cameraAngle,
            cameraHeight
        );

        if (!p) continue;

        visible.push({
            marble: m,
            projection: p
        });
    }

    /*
        Draw farthest first.
    */
    visible.sort(
        (a, b) =>
            b.projection.depth -
            a.projection.depth
    );

    for (const item of visible) {
        const m = item.marble;
        const p = item.projection;

        const r = clamp(
            m.radius * p.scale * 1.18,
            2.5,
            80
        );

        draw3DMarble(
            p.x,
            p.y,
            r,
            m.color,
            m.id === selected
        );

        /*
            NAME IS ALWAYS DRAWN AFTER THE MARBLE.
        */
        drawNameLabel(
            m,
            p.x,
            p.y,
            r,
            m.id === selected
        );
    }

    /*
        Guaranteed player marker/name at the bottom of
        first-person view.
    */
    if (cameraMode === "first") {
        const bottomR = Math.min(W, H) * .065;
        const bottomX = W / 2;
        const bottomY = H * .89;

        draw3DMarble(
            bottomX,
            bottomY,
            bottomR,
            me.color,
            true
        );

        drawNameLabel(
            me,
            bottomX,
            bottomY,
            bottomR,
            true
        );
    }
}


/* =========================================================
   CAMERA
========================================================= */

function getFirstPersonCamera() {
    const me = marble[selected];
    const frame = trackFrame(me.s);

    /*
        Camera sits slightly behind the marble.
    */
    const pos = marbleWorldPosition(me);

    const cameraX =
        pos.x - frame.t.x * 5;

    const cameraY =
        pos.y - frame.t.y * 5;

    const cameraAngle =
        Math.atan2(frame.t.y, frame.t.x);

    return {
        x: cameraX,
        y: cameraY,
        angle: cameraAngle,
        height: 25
    };
}


function getSpectatorCamera() {
    const me = marble[selected];
    const frame = trackFrame(me.s);

    const pos = marbleWorldPosition(me);

    /*
        Spectator camera follows behind and above.
    */
    const cameraX =
        pos.x - frame.t.x * 78;

    const cameraY =
        pos.y - frame.t.y * 78;

    const cameraAngle =
        Math.atan2(frame.t.y, frame.t.x);

    return {
        x: cameraX,
        y: cameraY,
        angle: cameraAngle,
        height: 48
    };
}


/* =========================================================
   SKY / BACKGROUND
========================================================= */

function drawBackground() {
    const g = ctx.createLinearGradient(
        0,
        0,
        0,
        H
    );

    g.addColorStop(0, "#080b14");
    g.addColorStop(.42, "#101727");
    g.addColorStop(1, "#05070b");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /*
        Stars / distant lights.
    */
    ctx.save();
    ctx.globalAlpha = .35;

    for (let i = 0; i < 70; i++) {
        const x = (i * 137.7) % W;
        const y = (i * 71.3) % (H * .42);

        ctx.fillStyle = "#fff";
        ctx.fillRect(x, y, 1, 1);
    }

    ctx.restore();

    /*
        Horizon glow.
    */
    const glow = ctx.createRadialGradient(
        W / 2,
        H * .42,
        10,
        W / 2,
        H * .42,
        Math.max(W, H) * .7
    );

    glow.addColorStop(0, "rgba(90,120,180,.14)");
    glow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
}


/* =========================================================
   SCENE
========================================================= */

function drawScene() {
    drawBackground();

    if (!raceRunning) return;

    const camera =
        cameraMode === "first"
            ? getFirstPersonCamera()
            : getSpectatorCamera();

    /*
        Track first.
    */
    drawWorldTrack(
        camera.x,
        camera.y,
        camera.angle,
        camera.height
    );

    /*
        Obstacles.
    */
    drawWorldObstacles(
        camera.x,
        camera.y,
        camera.angle,
        camera.height
    );

    /*
        Marbles and names are deliberately last so that
        labels cannot be hidden by the road or scenery.
    */
    renderMarbles(
        camera.x,
        camera.y,
        camera.angle,
        camera.height
    );

    /*
        Spectator reticle.
    */
    if (cameraMode === "spectator") {
        ctx.save();

        ctx.strokeStyle = "rgba(255,255,255,.32)";
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(W / 2 - 8, H / 2);
        ctx.lineTo(W / 2 + 8, H / 2);
        ctx.moveTo(W / 2, H / 2 - 8);
        ctx.lineTo(W / 2, H / 2 + 8);
        ctx.stroke();

        ctx.restore();
    }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {
    if (!raceRunning) return;

    const me = marble[selected];

    const speed = me.v;

    const progress =
        clamp(me.s / TRACK_LENGTH, 0, 1) * 100;

    const position =
        1 +
        marble.filter(
            m => m.s > me.s && !m.finished
        ).length;

    hudLeft.innerHTML =
        `<b>${me.name}</b><br>` +
        `Position: ${position}/${marble.length}<br>` +
        `Speed: ${speed.toFixed(1)}`;

    hudRight.innerHTML =
        `${tracks[Number(trackSelect.value)]}<br>` +
        `${progress.toFixed(0)}% &nbsp; ${raceTime.toFixed(1)}s`;
}


/* =========================================================
   COUNTDOWN
========================================================= */

function runCountdown() {
    countdownActive = true;
    countdown.style.display = "flex";

    const sequence = ["3", "2", "1", "GO!"];

    let i = 0;

    function next() {
        if (i >= sequence.length) {
            countdown.style.display = "none";
            countdownActive = false;
            beep(880, .15);
            return;
        }

        countdown.textContent = sequence[i];

        if (sequence[i] === "GO!") {
            beep(880, .16);
        } else {
            beep(440 + i * 70, .1);
        }

        i++;

        setTimeout(next, 650);
    }

    next();
}


/* =========================================================
   START / RESTART
========================================================= */

function startRace() {
    const requestedBet =
        Math.max(1, Number(betInput.value) || 25);

    if (requestedBet > bank) {
        betInput.value = bank;
        currentBet = bank;
    } else {
        currentBet = requestedBet;
    }

    bank -= currentBet;
    updateBank();

    selected = Number(playerSelect.value);

    const seed =
        Number(trackSelect.value) + 1;

    /*
        Generate a deliberately short track.
    */
    track = generateTrack(seed);

    generateObstacles(seed);
    createMarbles();

    raceTime = 0;
    raceRunning = true;
    paused = false;
    raceFinished = false;

    cameraMode = "first";

    menu.style.display = "none";
    finish.style.display = "none";
    hud.style.display = "flex";

    lastTime = performance.now();

    runCountdown();
}


function restartRace() {
    /*
        If a race was completed, return the current bet
        before charging the new race.
    */
    if (raceFinished) {
        bank += currentBet;
        updateBank();
    }

    startRace();
}


/* =========================================================
   FINISH
========================================================= */

function finishRace() {
    raceFinished = true;
    raceRunning = false;

    hud.style.display = "none";
    finish.style.display = "flex";

    const sorted =
        [...marble].sort((a, b) => {
            if (a.place && b.place) {
                return a.place - b.place;
            }

            return b.s - a.s;
        });

    const winner = sorted[0];

    /*
        3x payout if player's selected marble wins.
    */
    let payout = 0;

    if (winner.id === selected) {
        payout = currentBet * 3;
        bank += payout;
        finishTitle.textContent =
            `🏆 ${winner.name} wins!`;
    } else {
        finishTitle.textContent =
            `${winner.name} wins the race`;
    }

    updateBank();

    results.innerHTML = "";

    sorted.forEach((m, i) => {
        const div = document.createElement("div");
        div.className = "result";

        const place =
            i === 0 ? "🥇" :
            i === 1 ? "🥈" :
            i === 2 ? "🥉" :
            `${i + 1}.`;

        div.innerHTML =
            `<span>${place} <b style="color:${m.color}">${m.name}</b></span>` +
            `<span>${m.finishTime ? m.finishTime.toFixed(2) + "s" : ""}</span>`;

        results.appendChild(div);
    });

    if (payout > 0) {
        const payoutDiv =
            document.createElement("div");

        payoutDiv.style.marginTop = "15px";
        payoutDiv.style.textAlign = "center";
        payoutDiv.style.color = "#67e8a5";
        payoutDiv.style.fontWeight = "bold";

        payoutDiv.textContent =
            `You won $${payout}!`;

        results.appendChild(payoutDiv);
    }
}


/* =========================================================
   BANK
========================================================= */

function updateBank() {
    bankDisplay.textContent =
        "$" + bank.toFixed(0);
}


/* =========================================================
   INPUT
========================================================= */

document.getElementById("startBtn")
    .addEventListener("click", startRace);

document.getElementById("restartBtn")
    .addEventListener("click", restartRace);

addEventListener("keydown", e => {
    /*
        Don't trigger shortcuts while typing a bet.
    */
    if (
        document.activeElement === betInput &&
        e.key !== "Escape"
    ) {
        return;
    }

    if (e.key.toLowerCase() === "v") {
        if (!raceRunning) return;

        cameraMode =
            cameraMode === "first"
                ? "spectator"
                : "first";

        beep(620, .06);
    }

    if (e.key.toLowerCase() === "r") {
        if (raceRunning || raceFinished) {
            restartRace();
        }
    }

    if (e.key.toLowerCase() === "m") {
        muted = !muted;
        beep(500, .05);
    }

    if (e.code === "Space") {
        e.preventDefault();

        if (raceRunning && !countdownActive) {
            paused = !paused;
        }
    }

    /*
        Number keys select marbles.
    */
    if (e.key >= "1" && e.key <= "8") {
        const n = Number(e.key) - 1;

        if (marble[n]) {
            selected = n;
        }
    }
});


/* =========================================================
   MAIN LOOP
========================================================= */

function frame(now) {
    let dt =
        (now - lastTime) / 1000;

    lastTime = now;

    /*
        Protect against tab switching / huge frames.
    */
    dt = clamp(dt, 0, .035);

    update(dt);
    drawScene();
    updateHUD();

    requestAnimationFrame(frame);
}


/* =========================================================
   INITIAL DISPLAY
========================================================= */

updateBank();

requestAnimationFrame(frame);

</script>
</body>
</html>
