<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marble Mayhem Deluxe</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b12;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.panel{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(92vw,760px);
max-height:92vh;
overflow:auto;
background:rgba(6,11,20,.96);
border:2px solid #53647c;
border-radius:18px;
padding:26px;
box-shadow:0 25px 90px rgba(0,0,0,.7);
z-index:20
}

h1{margin:0 0 8px;text-align:center;font-size:42px;letter-spacing:2px}
h2{margin:5px 0 18px;text-align:center}
.subtitle{text-align:center;color:#aeb9ca;margin-bottom:22px}
.hidden{display:none!important}

.racers{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin:15px 0
}

.racer{
border:2px solid #354154;
background:#121b2a;
border-radius:12px;
padding:10px;
cursor:pointer;
text-align:center;
transition:.15s
}

.racer:hover{transform:translateY(-2px);border-color:#7f8ea8}
.racer.selected{
border-color:#fff;
background:#1d2a3d;
box-shadow:0 0 20px rgba(255,255,255,.18)
}

.dot{
width:34px;
height:34px;
border-radius:50%;
margin:0 auto 7px;
border:2px solid rgba(255,255,255,.7);
box-shadow:inset -7px -7px 12px rgba(0,0,0,.45),inset 4px 4px 8px rgba(255,255,255,.45)
}

.racer-name{font-weight:bold;font-size:13px}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin:18px 0
}

select,input{
width:100%;
padding:11px;
border-radius:9px;
border:1px solid #46546a;
background:#111a29;
color:#fff;
font-size:16px
}

label{
font-size:12px;
color:#9eabc0;
display:block;
margin-bottom:5px
}

button{
border:0;
border-radius:10px;
padding:13px 18px;
background:#f0f3f7;
color:#101722;
font-size:16px;
font-weight:bold;
cursor:pointer
}

button:hover{filter:brightness(1.08)}
.primary{width:100%;font-size:20px;margin-top:10px}

.small{
text-align:center;
color:#8794a8;
font-size:12px;
margin-top:14px;
line-height:1.5
}

#hud{
position:absolute;
z-index:10;
left:14px;
right:14px;
top:12px;
display:none;
pointer-events:none
}

.hudbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.badge{
background:rgba(5,10,18,.72);
border:1px solid rgba(255,255,255,.18);
border-radius:10px;
padding:8px 11px;
font-size:13px;
backdrop-filter:blur(5px)
}

#message{
position:absolute;
left:50%;
top:18%;
transform:translateX(-50%);
z-index:12;
text-align:center;
font-weight:bold;
font-size:52px;
text-shadow:0 4px 20px #000;
pointer-events:none
}

#finishPanel{text-align:center}

.results{
margin:18px 0;
border-radius:10px;
overflow:hidden;
border:1px solid #354154
}

.result{
display:flex;
justify-content:space-between;
padding:10px 14px;
background:#111a29;
border-bottom:1px solid #293446
}

.result:last-child{border-bottom:0}
.result.you{background:#24324a}

#payoutText{
margin:10px 0 15px;
color:#b8c4d6
}

@media(max-width:650px){
.racers{grid-template-columns:repeat(2,1fr)}
.controls{grid-template-columns:1fr}
h1{font-size:31px}
.panel{padding:18px}
}
</style>
</head>

<body>

<div id="game">

<canvas id="c"></canvas>

<div id="menu" class="panel">

<h1>MARBLE MAYHEM DELUXE</h1>

<div class="subtitle">
Pick your marble. Survive the track. Win the race.
</div>

<h2>Select Your Marble</h2>

<div id="racers" class="racers"></div>

<div class="controls">

<div>
<label for="trackSelect">Track</label>
<select id="trackSelect"></select>
</div>

<div>
<label for="bet">Bet</label>
<input id="bet" type="number" min="0" step="1" value="25">
</div>

</div>

<div id="bankText" style="text-align:center;margin-bottom:10px">
Bank: $100
</div>

<button id="startBtn" class="primary">
START RACE
</button>

<div class="small">
During a race:
<b>V</b> camera •
<b>R</b> restart •
<b>M</b> mute •
<b>SPACE</b> pause
</div>

</div>

<div id="hud">

<div class="hudbar">

<div id="raceInfo" class="badge"></div>

<div id="cameraInfo" class="badge">
FIRST-PERSON MARBLE CAMERA
</div>

</div>

</div>

<div id="message"></div>

<div id="finishPanel" class="panel hidden">

<h1>FINISH!</h1>

<h2 id="winnerText"></h2>

<div id="results" class="results"></div>

<div id="payoutText"></div>

<button id="nextBtn" class="primary">
NEXT RACE
</button>

<button id="menuBtn" style="width:100%;margin-top:8px">
MAIN MENU
</button>

</div>

</div>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W=window.innerWidth;
let H=window.innerHeight;

canvas.width=W;
canvas.height=H;

window.addEventListener("resize",()=>{
W=window.innerWidth;
H=window.innerHeight;
canvas.width=W;
canvas.height=H;
});

const racersData=[
{id:"fetson",name:"fetson",color:"#e74c3c"},
{id:"doober",name:"doober",color:"#3498db"},
{id:"fadgeril",name:"fadgeril",color:"#f1c40f"},
{id:"scrappy",name:"scrappy doo",color:"#9b59b6"},
{id:"scubadaa",name:"scubadaa",color:"#1abc9c"},
{id:"pisswolf",name:"pisswolf",color:"#f39c12"},
{id:"malty",name:"malty",color:"#e67e22"},
{id:"morning",name:"morning roll",color:"#ecf0f1"}
];

const trackNames=[
"Neon Run",
"Dust Devil",
"Marble Mountain",
"The Snake",
"Turbo Tunnel",
"Crystal Coast",
"Red Canyon",
"The Gauntlet",
"Moon Rock",
"Lava Loop",
"Blue Thunder",
"Pinball Ridge",
"Green Machine",
"The Spiral",
"Sunset Sprint",
"Chaos Valley",
"Rocket Road",
"Frostbite",
"Thunder Alley",
"Golden Mile",
"Black Diamond",
"Jungle Run",
"Final Frenzy",
"Mayhem Grand Prix"
];

let selected="fetson";
let trackIndex=0;
let bank=100;
let currentBet=25;

let state="menu";
let paused=false;
let muted=false;

let track=[];
let marbles=[];
let obstacles=[];
let finishOrder=[];

let raceTime=0;
let countdown=0;
let lastTime=0;

let firstPerson=true;

let cameraX=0;
let cameraY=0;
let cameraAngle=0;

let cameraVX=0;
let cameraVY=0;

let cameraShake=0;

function clamp(v,a,b){
return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
return a+(b-a)*t;
}

function seededRandom(seed){

let s=seed%2147483647;

if(s<=0)s+=2147483646;

return function(){

s=s*16807%2147483647;

return(s-1)/2147483646;

};

}

function buildTrack(seed){

const random=seededRandom(seed*991+37);

track=[];
obstacles=[];

let px=0;
let py=0;
let angle=0;

const length=2200;

for(let i=0;i<length;i++){

let turn=
Math.sin(i*.013+seed)*.015+
Math.sin(i*.031+seed*2)*.009+
(random()-.5)*.012;

angle+=turn;

px+=Math.cos(angle)*4;
py+=Math.sin(angle)*4;

track.push({
x:px,
y:py
});

}

for(let pass=0;pass<3;pass++){

const old=track.map(p=>({x:p.x,y:p.y}));

for(let i=1;i<track.length-1;i++){

track[i].x=
(old[i-1].x+
old[i].x*2+
old[i+1].x)/4;

track[i].y=
(old[i-1].y+
old[i].y*2+
old[i+1].y)/4;

}

}

for(let i=130;i<length-100;i+=90+Math.floor(random()*90)){

if(random()<.75){

obstacles.push({
s:i,
offset:(random()-.5)*35,
type:random()<.5?"barrel":"block",
size:7+random()*7
});

}

}

}

function sample(s){

if(track.length===0)return{x:0,y:0};

s=clamp(s,0,track.length-1);

const i=Math.floor(s);
const f=s-i;

const a=track[i];
const b=track[Math.min(i+1,track.length-1)];

return{
x:lerp(a.x,b.x,f),
y:lerp(a.y,b.y,f)
};

}

function tangent(s){

const a=sample(s-2);
const b=sample(s+2);

const dx=b.x-a.x;
const dy=b.y-a.y;

const len=Math.hypot(dx,dy)||1;

return{
x:dx/len,
y:dy/len
};

}

function makeMarbles(){

marbles=racersData.map((r,i)=>{

return{
id:r.id,
name:r.name,
color:r.color,

s:-i*8,

lane:(i-3.5)*7,

speed:0,

finished:false,

finishTime:0,

phase:i*1.37

};

});

}

function setupMenu(){

const racers=document.getElementById("racers");

racers.innerHTML="";

racersData.forEach(r=>{

const div=document.createElement("div");

div.className="racer"+
(r.id===selected?" selected":"");

div.innerHTML=
'<div class="dot" style="background:'+r.color+'"></div>'+
'<div class="racer-name">'+r.name+"</div>";

div.onclick=()=>{

selected=r.id;

document.querySelectorAll(".racer")
.forEach(e=>e.classList.remove("selected"));

div.classList.add("selected");

};

racers.appendChild(div);

});

const select=document.getElementById("trackSelect");

select.innerHTML="";

trackNames.forEach((name,i)=>{

const option=document.createElement("option");

option.value=i;

option.textContent=(i+1)+". "+name;

select.appendChild(option);

});

select.value=trackIndex;

document.getElementById("bankText").textContent=
"Bank: $"+bank;

}

function tone(freq=440,duration=.08){

if(muted)return;

try{

const AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)return;

const audio=new AC();

const osc=audio.createOscillator();

const gain=audio.createGain();

osc.frequency.value=freq;

gain.gain.value=.035;

osc.connect(gain);

gain.connect(audio.destination);

osc.start();

gain.gain.exponentialRampToValueAtTime(
.001,
audio.currentTime+duration
);

osc.stop(audio.currentTime+duration);

}catch(e){}

}

function start(){

const bet=Math.floor(
Number(document.getElementById("bet").value)||0
);

currentBet=clamp(bet,0,bank);

bank-=currentBet;

trackIndex=
parseInt(document.getElementById("trackSelect").value,10)||0;

buildTrack(trackIndex+1);

makeMarbles();

state="countdown";

countdown=3;

raceTime=0;

finishOrder=[];

paused=false;

cameraShake=0;

document.getElementById("menu")
.classList.add("hidden");

document.getElementById("finishPanel")
.classList.add("hidden");

document.getElementById("hud")
.style.display="block";

document.getElementById("message")
.textContent="3";

tone(440,.12);

}

function restart(){

if(state!=="race"&&state!=="countdown")return;

bank+=currentBet;

document.getElementById("bet").value=currentBet;

start();

}

function updateRace(dt){

if(state==="countdown"){

countdown-=dt;

if(countdown<=0){

state="race";

document.getElementById("message")
.textContent="GO!";

tone(880,.15);

setTimeout(()=>{

if(state==="race")
document.getElementById("message").textContent="";

},600);

}else{

document.getElementById("message")
.textContent=Math.ceil(countdown);

}

return;

}

if(state!=="race"||paused)return;

raceTime+=dt;

for(const m of marbles){

if(m.finished)continue;

const desired=
4.15+
Math.sin(raceTime*.8+m.phase)*.22+
Math.sin(raceTime*.31+m.phase)*.12;

m.speed+=
(desired-m.speed)*1.5*dt;

m.speed=clamp(m.speed,1.8,5.9);

for(const o of obstacles){

const difference=o.s-m.s;

if(Math.abs(difference)<6){

const t=tangent(m.s);

const p=sample(m.s);

const op=sample(o.s);

const dx=op.x-p.x;
const dy=op.y-p.y;

const side=
dx*(-t.y)+
dy*t.x;

if(Math.abs(side-m.lane-o.offset)<o.size+8){

m.speed*=.63;

cameraShake=Math.max(cameraShake,.35);

}

}

}

m.s+=m.speed*dt;

if(m.s>=track.length-35){

m.finished=true;

m.finishTime=raceTime;

finishOrder.push(m);

tone(
520+finishOrder.length*55,
.08
);

}

}

if(finishOrder.length>=marbles.length-1){

setTimeout(()=>{

if(state==="race")
finishRace();

},600);

}

}

function finishRace(){

state="finish";

const winner=
finishOrder[0]||
marbles.slice().sort((a,b)=>b.s-a.s)[0];

let payout=0;

if(winner&&winner.id===selected){

payout=currentBet*3;

bank+=payout;

}

document.getElementById("winnerText")
.textContent=
"Winner: "+winner.name;

const results=document.getElementById("results");

results.innerHTML="";

finishOrder.forEach((m,i)=>{

const row=document.createElement("div");

row.className=
"result"+
(m.id===selected?" you":"");

row.innerHTML=
"<span>"+(i+1)+". "+m.name+"</span>"+
"<span>"+m.finishTime.toFixed(2)+"s</span>";

results.appendChild(row);

});

document.getElementById("payoutText")
.textContent=
payout>0
?"Your marble won! Payout: $"+payout+" | Bank: $"+bank
:"Bet lost. Bank: $"+bank;

document.getElementById("finishPanel")
.classList.remove("hidden");

document.getElementById("hud")
.style.display="none";

tone(900,.3);

}

function projectPoint(worldX,worldY,height){

/*
This is the important part.

The world is transformed into the marble's
camera coordinate system.

Forward = distance in front of marble.
Side    = distance left/right of marble.

The perspective scale is focalLength / forward.
*/

const dx=worldX-cameraX;
const dy=worldY-cameraY;

const forwardX=Math.cos(cameraAngle);
const forwardY=Math.sin(cameraAngle);

const rightX=-Math.sin(cameraAngle);
const rightY=Math.cos(cameraAngle);

const forward=
dx*forwardX+
dy*forwardY;

const side=
dx*rightX+
dy*rightY;

if(forward<=1)return null;

const focalLength=H*.95;

const scale=focalLength/forward;

/*
Ground plane projection.

The camera is above the road.
As depth increases, the ground approaches
the horizon.
*/

const cameraHeight=8;

const horizon=H*.39;

const screenX=
W/2+
side*scale;

const screenY=
horizon+
(cameraHeight-height)*scale;

return{
x:screenX,
y:screenY,
scale:scale,
depth:forward
};

}

function drawSky(){

const horizon=H*.39;

const sky=ctx.createLinearGradient(
0,0,
0,horizon
);

sky.addColorStop(0,"#020711");
sky.addColorStop(.45,"#0b1d31");
sky.addColorStop(1,"#31516c");

ctx.fillStyle=sky;

ctx.fillRect(
0,
0,
W,
horizon+2
);

/* distant mountains */

ctx.fillStyle="#122738";

ctx.beginPath();

ctx.moveTo(0,horizon);

for(let i=0;i<=14;i++){

const px=i*(W/14);

const py=
horizon-
35-
Math.sin(i*1.7+trackIndex)*32;

ctx.lineTo(px,py);

}

ctx.lineTo(W,horizon);

ctx.closePath();

ctx.fill();

/* ground */

ctx.fillStyle="#0c2115";

ctx.fillRect(
0,
horizon,
W,
H-horizon
);

}

function drawFirstPerson(){

const me=
marbles.find(m=>m.id===selected)||
marbles[0];

if(!me)return;

const current=sample(me.s);

const direction=tangent(me.s);

/*
Smooth camera position.
*/

cameraX+=
(current.x-cameraX)*
Math.min(1,8/60);

cameraY+=
(current.y-cameraY)*
Math.min(1,8/60);

const desiredAngle=
Math.atan2(
direction.y,
direction.x
);

/*
Keep camera rotation continuous instead
of snapping at -PI/PI.
*/

let angleDifference=
desiredAngle-cameraAngle;

while(angleDifference>Math.PI)
angleDifference-=Math.PI*2;

while(angleDifference<-Math.PI)
angleDifference+=Math.PI*2;

cameraAngle+=
angleDifference*
Math.min(1,10/60);

drawSky();

/*
ROAD
*/

const roadWidth=86;

const segments=[];

const start=
Math.max(
0,
Math.floor(me.s)-2
);

const end=
Math.min(
track.length-2,
Math.floor(me.s)+170
);

for(let i=start;i<end;i++){

const a=track[i];
const b=track[i+1];

const ta=tangent(i);
const tb=tangent(i+1);

const leftA={
x:a.x-ta.y*roadWidth/2,
y:a.y+ta.x*roadWidth/2
};

const rightA={
x:a.x+ta.y*roadWidth/2,
y:a.y-ta.x*roadWidth/2
};

const leftB={
x:b.x-tb.y*roadWidth/2,
y:b.y+tb.x*roadWidth/2
};

const rightB={
x:b.x+tb.y*roadWidth/2,
y:b.y-tb.x*roadWidth/2
};

const p1=projectPoint(
leftA.x,
leftA.y,
0
);

const p2=projectPoint(
rightA.x,
rightA.y,
0
);

const p3=projectPoint(
rightB.x,
rightB.y,
0
);

const p4=projectPoint(
leftB.x,
leftB.y,
0
);

if(p1&&p2&&p3&&p4){

segments.push({
p1,p2,p3,p4,i
});

}

}

/*
Far sections first.
*/

for(let i=segments.length-1;i>=0;i--){

const r=segments[i];

ctx.beginPath();

ctx.moveTo(r.p1.x,r.p1.y);
ctx.lineTo(r.p2.x,r.p2.y);
ctx.lineTo(r.p3.x,r.p3.y);
ctx.lineTo(r.p4.x,r.p4.y);

ctx.closePath();

ctx.fillStyle=
Math.floor(r.i/4)%2===0
?"#30353a"
:"#383e43";

ctx.fill();

/*
Road edge.
*/

ctx.strokeStyle="#858b90";

ctx.lineWidth=
Math.max(
1,
Math.min(
10,
r.p1.scale*.7
)
);

ctx.beginPath();

ctx.moveTo(r.p1.x,r.p1.y);
ctx.lineTo(r.p4.x,r.p4.y);

ctx.moveTo(r.p2.x,r.p2.y);
ctx.lineTo(r.p3.x,r.p3.y);

ctx.stroke();

/*
Dashed centre line.
*/

if(r.i%7===0){

const x1=
(r.p1.x+r.p2.x)/2;

const y1=
(r.p1.y+r.p2.y)/2;

const x2=
(r.p4.x+r.p3.x)/2;

const y2=
(r.p4.y+r.p3.y)/2;

ctx.strokeStyle=
"rgba(255,255,255,.82)";

ctx.lineWidth=
Math.max(
1,
Math.min(8,r.p1.scale*1.4)
);

ctx.beginPath();

ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);

ctx.stroke();

}

}

/*
HAZARDS
*/

const visibleHazards=[];

for(const o of obstacles){

if(o.s<me.s-5)continue;

if(o.s>me.s+145)continue;

const p=sample(o.s);
const t=tangent(o.s);

/*
offset along the track.
*/

const wx=
p.x-
t.y*
o.offset;

const wy=
p.y+
t.x*
o.offset;

const projected=
projectPoint(
wx,
wy,
0
);

if(projected){

visibleHazards.push({
o,
p:projected
});

}

}

/*
Far hazards first.
*/

visibleHazards
.sort((a,b)=>b.p.depth-a.p.depth)
.forEach(item=>{

const o=item.o;
const p=item.p;

const size=
clamp(
o.size*p.scale,
2,
38
);

ctx.save();

ctx.translate(p.x,p.y);

if(o.type==="barrel"){

ctx.fillStyle="#d84343";

ctx.beginPath();

ctx.arc(
0,
-size*.55,
size,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#ffb4b4";

ctx.lineWidth=
Math.max(1,size*.14);

ctx.stroke();

ctx.fillStyle="#ffd34d";

ctx.fillRect(
-size*.75,
-size*.12,
-size*1.5,
-size*.2
);

}else{

ctx.fillStyle="#d99c28";

ctx.fillRect(
-size,
-size,
size*2,
size*2
);

ctx.strokeStyle="#ffe5a0";

ctx.lineWidth=
Math.max(1,size*.13);

ctx.strokeRect(
-size,
-size,
size*2,
size*2
);

}

ctx.restore();

});

/*
OTHER MARBLES
*/

const visibleMarbles=[];

for(const m of marbles){

if(m.id===me.id)continue;

if(m.s<me.s-5)continue;

if(m.s>me.s+140)continue;

const mp=sample(m.s);
const mt=tangent(m.s);

const wx=
mp.x-
mt.y*m.lane;

const wy=
mp.y+
mt.x*m.lane;

const p=
projectPoint(
wx,
wy,
5
);

if(p){

visibleMarbles.push({
m,
p
});

}

}

visibleMarbles
.sort((a,b)=>b.p.depth-a.p.depth)
.forEach(item=>{

const m=item.m;
const p=item.p;

const radius=
clamp(
6*p.scale,
2.5,
32
);

/* shadow */

ctx.beginPath();

ctx.ellipse(
p.x,
p.y+radius*.7,
radius*1.25,
radius*.42,
0,
0,
Math.PI*2
);

ctx.fillStyle="rgba(0,0,0,.42)";
ctx.fill();

/* marble */

const gradient=
ctx.createRadialGradient(
p.x-radius*.38,
p.y-radius*.42,
radius*.08,
p.x,
p.y,
radius
);

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
.18,
m.color
);

gradient.addColorStop(
1,
"#080808"
);

ctx.beginPath();

ctx.arc(
p.x,
p.y,
radius,
0,
Math.PI*2
);

ctx.fillStyle=gradient;

ctx.fill();

/* name */

if(radius>11){

ctx.font=
"bold "+
Math.max(9,radius*.8)+
"px Arial";

ctx.textAlign="center";

ctx.fillStyle="#fff";

ctx.shadowColor="#000";
ctx.shadowBlur=4;

ctx.fillText(
m.name,
p.x,
p.y-radius-5
);

ctx.shadowBlur=0;

}

});

/*
SPEED EFFECT
*/

if(me.speed>4.3){

const amount=
clamp(
(me.speed-4.3)/1.6,
0,
1
);

ctx.strokeStyle=
"rgba(255,255,255,"+
(amount*.11)+
")";

ctx.lineWidth=1;

for(let i=0;i<14;i++){

const sx=Math.random()*W;
const sy=
H*.4+
Math.random()*H*.55;

ctx.beginPath();

ctx.moveTo(
sx,
sy
);

ctx.lineTo(
W/2+
(sx-W/2)*.75,
sy-25-amount*35
);

ctx.stroke();

}

}

/*
DARK LOWER EDGE.

This gives the impression that the
camera is physically attached to the
marble rather than being a floating
top-down camera.
*/

const lower=
ctx.createLinearGradient(
0,
H*.65,
0,
H
);

lower.addColorStop(
0,
"rgba(0,0,0,0)"
);

lower.addColorStop(
.55,
"rgba(0,0,0,.18)"
);

lower.addColorStop(
1,
"rgba(0,0,0,.82)"
);

ctx.fillStyle=lower;

ctx.fillRect(
0,
H*.62,
W,
H*.38
);

/*
Small camera/marble reticle.
*/

ctx.strokeStyle=
"rgba(255,255,255,.35)";

ctx.lineWidth=1;

ctx.beginPath();

ctx.moveTo(
W/2-8,
H*.59
);

ctx.lineTo(
W/2+8,
H*.59
);

ctx.moveTo(
W/2,
H*.59-8
);

ctx.lineTo(
W/2,
H*.59+8
);

ctx.stroke();

/*
Vignette.
*/

const vignette=
ctx.createRadialGradient(
W/2,
H*.5,
H*.2,
W/2,
H*.5,
H*.85
);

vignette.addColorStop(
0,
"rgba(0,0,0,0)"
);

vignette.addColorStop(
1,
"rgba(0,0,0,.42)"
);

ctx.fillStyle=vignette;

ctx.fillRect(
0,
0,
W,
H
);

}

function drawSpectator(){

ctx.fillStyle="#0b1c12";

ctx.fillRect(
0,
0,
W,
H
);

if(!track.length)return;

const me=
marbles.find(m=>m.id===selected)||
marbles[0];

const centre=sample(me.s);

const scale=
Math.min(W,H)/600;

ctx.save();

ctx.translate(
W/2-centre.x*scale,
H/2-centre.y*scale
);

ctx.scale(scale,scale);

/*
Ground.
*/

ctx.fillStyle="#0c2816";

ctx.fillRect(
-5000,
-5000,
10000,
10000
);

/*
Road.
*/

ctx.beginPath();

track.forEach((p,i)=>{

if(i===0)
ctx.moveTo(p.x,p.y);
else
ctx.lineTo(p.x,p.y);

});

ctx.lineCap="round";
ctx.lineJoin="round";

ctx.strokeStyle="#101214";
ctx.lineWidth=98;
ctx.stroke();

ctx.strokeStyle="#41464b";
ctx.lineWidth=84;
ctx.stroke();

/*
Obstacles.
*/

for(const o of obstacles){

const p=sample(o.s);
const t=tangent(o.s);

const ox=
p.x-
t.y*o.offset;

const oy=
p.y+
t.x*o.offset;

ctx.fillStyle=
o.type==="barrel"
?"#d84343"
:"#d99c28";

ctx.beginPath();

ctx.arc(
ox,
oy,
o.size,
0,
Math.PI*2
);

ctx.fill();

}

/*
Marbles.
*/

for(const m of marbles){

const p=sample(m.s);
const t=tangent(m.s);

const mx=
p.x-
t.y*m.lane;

const my=
p.y+
t.x*m.lane;

ctx.beginPath();

ctx.arc(
mx,
my,
9,
0,
Math.PI*2
);

ctx.fillStyle=m.color;

ctx.fill();

if(m.id===selected){

ctx.strokeStyle="#fff";
ctx.lineWidth=2;

ctx.stroke();

}

}

ctx.restore();

}

function drawMenuBackground(){

const gradient=
ctx.createRadialGradient(
W/2,
H*.45,
20,
W/2,
H*.45,
Math.max(W,H)*.75
);

gradient.addColorStop(
0,
"#18304d"
);

gradient.addColorStop(
1,
"#030811"
);

ctx.fillStyle=gradient;

ctx.fillRect(
0,
0,
W,
H
);

}

function draw(){

ctx.clearRect(
0,
0,
W,
H
);

if(
state==="race"||
state==="countdown"
){

if(firstPerson)
drawFirstPerson();
else
drawSpectator();

}else{

drawMenuBackground();

}

if(paused&&state==="race"){

ctx.fillStyle=
"rgba(0,0,0,.55)";

ctx.fillRect(
0,
0,
W,
H
);

ctx.fillStyle="#fff";

ctx.font=
"bold 46px Arial";

ctx.textAlign="center";

ctx.fillText(
"PAUSED",
W/2,
H/2
);

}

if(
state==="race"||
state==="countdown"
){

const me=
marbles.find(m=>m.id===selected);

document.getElementById("raceInfo")
.textContent=
(trackIndex+1)+
". "+
trackNames[trackIndex]+
"  •  "+
(me?me.name:"");

document.getElementById("cameraInfo")
.textContent=
firstPerson
?"FIRST-PERSON MARBLE CAMERA"
:"SPECTATOR CAMERA";

}

}

function loop(time){

if(!lastTime)
lastTime=time;

let dt=
(time-lastTime)/1000;

lastTime=time;

dt=clamp(dt,0,.05);

updateRace(dt);

draw();

requestAnimationFrame(loop);

}

document
.getElementById("startBtn")
.addEventListener(
"click",
start
);

document
.getElementById("nextBtn")
.addEventListener(
"click",
()=>{

trackIndex=
(trackIndex+1)%trackNames.length;

document.getElementById("trackSelect")
.value=trackIndex;

document.getElementById("finishPanel")
.classList.add("hidden");

document.getElementById("menu")
.classList.remove("hidden");

setupMenu();

}
);

document
.getElementById("menuBtn")
.addEventListener(
"click",
()=>{

state="menu";

paused=false;

document.getElementById("finishPanel")
.classList.add("hidden");

document.getElementById("hud")
.style.display="none";

document.getElementById("menu")
.classList.remove("hidden");

setupMenu();

}
);

window.addEventListener(
"keydown",
e=>{

if(e.key.toLowerCase()==="v"){

firstPerson=!firstPerson;

return;

}

if(e.key.toLowerCase()==="r"){

restart();

return;

}

if(e.key.toLowerCase()==="m"){

muted=!muted;

return;

}

if(e.code==="Space"){

if(state==="race"){

e.preventDefault();

paused=!paused;

}

}

}
);

buildTrack(1);

makeMarbles();

setupMenu();

requestAnimationFrame(loop);

</script>

</body>
</html>
