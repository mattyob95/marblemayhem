<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marble Mayhem Deluxe</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  color:#fff;

canvas{

  width:100vw;
  height:100vh;
}

  align-items:center;

  pointer-events:none;

.panel{

  backdrop-filter:blur(12px);

  font-size:38px;

.subtitle{
  color:#9aa4b2;
  margin-bottom:22px;
}

.row{
  display:flex;
  gap:12px;
  margin:12px 0;
}

.row>div{
  flex:1;
}

label{
  display:block;
  color:#aab4c2;
  font-size:14px;
  margin-bottom:5px;
}

select,input,button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:11px 13px;
  font:inherit;
}

select,input{
  color:#fff;
  background:#171d28;
  outline:1px solid rgba(255,255,255,.08);
}

button{
  cursor:pointer;
  font-weight:bold;
  background:#f1f3f5;
  color:#080a0d;
  transition:transform .12s,filter .12s;
}

button:hover{
  filter:brightness(1.1);
  transform:translateY(-1px);
}

#startBtn{
  margin-top:16px;
  padding:14px;
  font-size:17px;
}

.money{
  padding:11px 0;

  font-weight:bold;
}

.controls{
  color:#8993a3;
  font-size:12px;
  line-height:1.7;
  margin-top:14px;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  right:15px;
  display:none;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
  z-index:10;
}

.hudBox{
  padding:9px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.12);
  text-shadow:0 2px 4px #000;
  backdrop-filter:blur(5px);
}

#countdown{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:clamp(70px,15vw,180px);

  text-shadow:0 8px 30px #000;
  z-index:20;
  pointer-events:none;
}

  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:30;
}

.finishPanel{
  width:min(620px,calc(100vw - 30px));
  max-height:90vh;
  overflow:auto;
  padding:28px;
  border-radius:18px;
  background:rgba(7,10,16,.97);

  box-shadow:0 25px 100px rgba(0,0,0,.75);
}

.finishPanel h2{
  margin:0 0 15px;
  font-size:32px;
}

#results{
  margin:15px 0;
}

.result{
  display:flex;
  justify-content:space-between;
  padding:9px 10px;
  margin:4px 0;
  border-radius:7px;
  background:rgba(255,255,255,.05);
}

.finishChoice{
  margin-top:18px;
}

.finishChoice label{
  margin-bottom:6px;
}

.finishControls{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.finishControls button{
  flex:1;
}

#newRaceBtn{
  background:#67e8a5;
}

#restartBtn{
  background:#f1f3f5;
}

@media(max-width:600px){
  .row{
    flex-direction:column;
  }

  .finishControls{
    flex-direction:column;
  }

  h1{
    font-size:31px;
  }
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="menu">
  <div class="panel">

    <h1>Marble Mayhem Deluxe</h1>

    <div class="subtitle">
      Fast marbles. Twisty tracks. Maximum chaos.
    </div>

    <div class="row">

      <div>
        <label for="trackSelect">Track</label>

      </div>

      <button id="newRaceBtn">NEW RACE</button>
      <button id="restartBtn">SAME MARBLE</button>
    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================================================
   DATA
========================================================= */

const names=[
  "fetson",
  "doober",
  "fadgeril",
  "scrappy doo",
  "scubadaa",
  "pisswolf",
  "malty",
  "morning roll"
];

const colors=[
  "#e74c3c",
  "#3498db",
  "#f1c40f",
  "#9b59b6",
  "#1abc9c",
  "#f39c12",
  "#e67e22",
  "#ecf0f1"
];

const tracks=[
  "Neon Run",
  "Dust Devil",
  "Marble Mountain",
  "The Snake",
  "Turbo Tunnel",
  "Crystal Coast",
  "Red Canyon",
  "The Gauntlet",
  "Moon Rock",
  "Lava Loop",
  "Blue Thunder",
  "Pinball Ridge",
  "Green Machine",
  "The Spiral",
  "Sunset Sprint",
  "Chaos Valley",
  "Rocket Road",
  "Frostbite",
  "Thunder Alley",
  "Golden Mile",
  "Black Diamond",
  "Jungle Run",
  "Final Frenzy",
  "Mayhem Grand Prix"
];

const trackSelect=document.getElementById("trackSelect");
const playerSelect=document.getElementById("playerSelect");
const finishPlayerSelect=document.getElementById("finishPlayerSelect");
const betInput=document.getElementById("betInput");
const bankDisplay=document.getElementById("bankDisplay");
const menu=document.getElementById("menu");
const hud=document.getElementById("hud");
const hudLeft=document.getElementById("hudLeft");
const hudRight=document.getElementById("hudRight");
const countdown=document.getElementById("countdown");
const finish=document.getElementById("finish");
const finishTitle=document.getElementById("finishTitle");
const results=document.getElementById("results");
const newRaceBtn=document.getElementById("newRaceBtn");
const restartBtn=document.getElementById("restartBtn");

tracks.forEach((name,i)=>{
  const option=document.createElement("option");
  option.value=i;
  option.textContent=name;
  trackSelect.appendChild(option);
});

names.forEach((name,i)=>{
  const option=document.createElement("option");
  option.value=i;
  option.textContent=name;
  playerSelect.appendChild(option);

  const finishOption=document.createElement("option");
  finishOption.value=i;
  finishOption.textContent=name;
  finishPlayerSelect.appendChild(finishOption);
});

/* =========================================================
   PHYSICS
========================================================= */

const TRACK_LENGTH=1400;
const ROAD_HALF=52;
const MARBLE_RADIUS=5;

const MAX_SPEED=44;
const MIN_SPEED=10.5;
const BASE_ACCEL=20;

const ROLLING_DRAG=.0028;
const AIR_DRAG=.000105;
const CORNER_DRAG=.00125;

const WALL_RESTITUTION=.985;
const WALL_FRICTION=.999;
const MARBLE_RESTITUTION=.96;
const OBSTACLE_RESTITUTION=.97;

/* =========================================================
   STATE
========================================================= */

let track=[];
let obstacles=[];
let marble=[];

let selected=0;

let cameraMode="first";

let raceRunning=false;
let paused=false;
let raceFinished=false;
let countdownActive=false;

let raceTime=0;
let lastTime=performance.now();

let bank=100;
let currentBet=25;

let muted=false;
let audioCtx=null;

/* =========================================================
   HELPERS
========================================================= */

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function randomRange(min,max){
  return min+Math.random()*(max-min);
}

function shuffle(array){
  const a=array.slice();

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

/* =========================================================
   SOUND
========================================================= */

function beep(freq=440,duration=.08,volume=.035){

  if(muted)return;

  try{

    if(!audioCtx){
      audioCtx=new(
        window.AudioContext||
        window.webkitAudioContext
      )();
    }

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.frequency.value=freq;
    osc.type="sine";

    gain.gain.setValueAtTime(
      volume,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+duration);

  }catch(e){}
}

/* =========================================================
   TRACK GENERATION
========================================================= */

function generateTrack(seed){

  const points=[];
  const step=4;

  let rng=(seed*99991+17)>>>0;

  function rand(){
    rng^=rng<<13;
    rng^=rng>>>17;
    rng^=rng<<5;
    return((rng>>>0)%10000)/10000;
  }

  let x=0;
  let y=0;
  let angle=0;

  const zones=[];
  const zoneCount=25;

  for(let i=0;i<zoneCount;i++){

    const center=.035+
      i/(zoneCount-1)*.93;

    const direction=i%2===0?1:-1;
    const type=rand();

    let strength;

    if(type<.18){
      strength=(.020+rand()*.016)*direction;
    }else if(type<.52){
      strength=(.011+rand()*.012)*direction;
    }else{
      strength=(.005+rand()*.009)*direction;
    }

    zones.push({
      center,
      width:.016+rand()*.034,
      strength,
      wobble:rand()*Math.PI*2
    });
  }

  const count=Math.floor(TRACK_LENGTH/step);

  for(let i=0;i<count;i++){

    const s=i*step;
    const u=s/TRACK_LENGTH;

    let turn=0;

    for(const z of zones){

      const d=(u-z.center)/z.width;

      if(Math.abs(d)<3){

        const envelope=Math.exp(-d*d);

        turn+=
          z.strength*
          envelope*
          (
            .72+
            .28*
            Math.sin(
              d*Math.PI+z.wobble
            )
          );
      }
    }

    turn+=
      Math.sin(
        u*Math.PI*2*(3.2+seed%3)+seed*.8
      )*.005;

    turn+=
      Math.sin(
        u*Math.PI*2*(7+seed%4)+seed*1.7
      )*.003;

    turn+=
      Math.sin(
        u*Math.PI*2*17+seed
      )*.0014;

    angle+=turn;

    x+=Math.cos(angle)*step;
    y+=Math.sin(angle)*step;

    points.push({x,y,angle});
  }

  for(let pass=0;pass<3;pass++){

    for(let i=0;i<points.length;i++){

      const a=points[Math.max(0,i-2)];
      const b=points[Math.min(points.length-1,i+2)];

      points[i].angle=
        Math.atan2(
          b.y-a.y,
          b.x-a.x
        );
    }
  }

  return points;
}

function sample(s){

  s=clamp(s,0,TRACK_LENGTH-.001);

  const step=4;
  const f=s/step;
  const i=Math.floor(f);
  const t=f-i;

  const a=track[i];
  const b=track[Math.min(i+1,track.length-1)];

  return{
    x:lerp(a.x,b.x,t),
    y:lerp(a.y,b.y,t)
  };
}

function tan(s){

  s=clamp(s,0,TRACK_LENGTH-.001);

  const step=4;
  const i=Math.floor(s/step);

  const a=track[Math.max(0,i)];
  const b=track[Math.min(track.length-1,i+1)];

  let dx=b.x-a.x;
  let dy=b.y-a.y;

  const len=Math.hypot(dx,dy)||1;

  return{
    x:dx/len,
    y:dy/len
  };
}

function trackFrame(s){

  const p=sample(s);
  const t=tan(s);

  return{
    p,
    t,
    n:{
      x:-t.y,
      y:t.x
    }
  };
}

function marbleWorldPosition(m){

  const frame=trackFrame(m.s);

  return{
    x:frame.p.x+frame.n.x*m.lane,
    y:frame.p.y+frame.n.y*m.lane
  };
}

/* =========================================================
   OBSTACLES
========================================================= */

function generateObstacles(seed){

  obstacles=[];

  let rng=(seed*7777+12345)>>>0;

  function rand(){
    rng^=rng<<13;
    rng^=rng>>>17;
    rng^=rng<<5;
    return((rng>>>0)%10000)/10000;
  }

  let s=80;

  while(s<TRACK_LENGTH-60){

    s+=75+rand()*85;

    if(s>TRACK_LENGTH-50)break;

    obstacles.push({
      s,
      lane:(rand()*2-1)*34,
      radius:6+rand()*3,
      type:rand()<.76?"bumper":"block"
    });
  }

  for(let i=0;i<12;i++){

    const s2=
      90+
      i*(TRACK_LENGTH-180)/12+
      rand()*55;

    obstacles.push({
      s:s2,
      lane:(rand()*2-1)*36,
      radius:6+rand()*3,
      type:rand()<.8?"bumper":"block"
    });
  }
}

/* =========================================================
   RACER PROFILES
========================================================= */

const racerProfiles=[
  {speed:1.00,accel:1.00,corner:1.00,grip:1.00,chaos:.90,variance:.045},
  {speed:1.025,accel:1.06,corner:.94,grip:.98,chaos:1.15,variance:.055},
  {speed:.995,accel:.98,corner:1.10,grip:1.06,chaos:.75,variance:.040},
  {speed:1.015,accel:1.03,corner:.91,grip:.94,chaos:1.30,variance:.065},
  {speed:1.005,accel:1.01,corner:1.04,grip:1.03,chaos:.85,variance:.050},
  {speed:1.035,accel:1.08,corner:.88,grip:.92,chaos:1.40,variance:.070},
  {speed:.990,accel:.96,corner:1.12,grip:1.08,chaos:1.00,variance:.045},
  {speed:1.01,accel:1.02,corner:.99,grip:1.00,chaos:1.08,variance:.060}
];

/* =========================================================
   CREATE MARBLES
========================================================= */

function createMarbles(){

  marble=[];

  /*
    Shuffle the starting grid every race.
    This means fetson is not permanently starting
    in pole position.
  */
  const grid=shuffle(
    [...Array(names.length).keys()]
  );

  for(let gridPos=0;gridPos<grid.length;gridPos++){

    const i=grid[gridPos];
    const p=racerProfiles[i];

    const startingLane=
      (gridPos-3.5)*7.2+
      randomRange(-3.5,3.5);

    const startS=
      -gridPos*6+
      randomRange(-1.5,1.5);

    /*
      Per-race ability variation.
      This is small enough to feel believable,
      but large enough for overtaking.
    */
    const raceSpeed=
      p.speed*
      randomRange(.965,1.035);

    const raceAccel=
      p.accel*
      randomRange(.94,1.06);

    const raceCorner=
      p.corner*
      randomRange(.94,1.06);

    marble.push({

      id:i,
      name:names[i],
      color:colors[i],

      s:startS,
      v:randomRange(20.5,24.5),

      lane:startingLane,
      laneV:randomRange(-1.2,1.2),

      radius:MARBLE_RADIUS,

      /*
        IMPORTANT FIX:
        grip is explicitly defined.
      */
      grip:p.grip,

      speedMul:raceSpeed,
      accelMul:raceAccel,
      cornerMul:raceCorner,

      chaos:p.chaos,
      variance:p.variance,

      rhythm:randomRange(1.4,2.5),
      rhythmPhase:randomRange(0,Math.PI*2),
      randomSeed:Math.random()*10000,

      /*
        Individual temporary form.
      */
      form:0,
      formTarget:0,
      formTimer:randomRange(1.5,4.5),

      /*
        Passing.
      */
      desiredLane:startingLane,
      laneChangeTimer:randomRange(.4,1.8),

      /*
        Rolling animation.
      */
      spin:Math.random()*Math.PI*2,
      wobble:Math.random()*Math.PI*2,

      recentSpeed:24,

      /*
        Collision state.
      */
      hitFlash:0,

      /*
        Finish state.
      */
      finished:false,
      finishTime:0,
      place:0
    });
  }
}

/* =========================================================
   WALL COLLISION
========================================================= */

function resolveWall(m){

  const limit=ROAD_HALF-m.radius;

  if(m.lane>limit){

    m.lane=limit;

    if(m.laneV>0){
      m.laneV=
        -m.laneV*
        WALL_RESTITUTION;
    }

    m.laneV*=WALL_FRICTION;
    m.v*=.996;
  }

  if(m.lane<-limit){

    m.lane=-limit;

    if(m.laneV<0){
      m.laneV=
        -m.laneV*
        WALL_RESTITUTION;
    }

    m.laneV*=WALL_FRICTION;
    m.v*=.996;
  }
}

/* =========================================================
   OBSTACLE COLLISION
========================================================= */

function resolveObstacle(m,o){

  const ds=Math.abs(o.s-m.s);

  if(ds>12)return;

  const laneDistance=o.lane-m.lane;
  const minDist=o.radius+m.radius;

  if(Math.abs(laneDistance)<minDist){

    const sign=
      laneDistance>=0?-1:1;

    const overlap=
      minDist-
      Math.abs(laneDistance);

    m.lane+=sign*(overlap+.15);

    m.laneV+=
      sign*
      randomRange(13,20);

    m.laneV*=OBSTACLE_RESTITUTION;

    /*
      Impacts can alter form.
    */
    if(Math.random()<.30){

      m.formTarget=
        clamp(
          m.formTarget+
          randomRange(-.10,.12),
          -.12,
          .12
        );
    }

    m.hitFlash=.16;
  }
}

/* =========================================================
   MARBLE COLLISIONS
========================================================= */

function resolveMarbleCollisions(){

  for(let i=0;i<marble.length;i++){

    const a=marble[i];

    if(a.finished)continue;

    for(let j=i+1;j<marble.length;j++){

      const b=marble[j];

      if(b.finished)continue;

      let ds=b.s-a.s;

      if(ds>TRACK_LENGTH/2)
        ds-=TRACK_LENGTH;

      if(ds<-TRACK_LENGTH/2)
        ds+=TRACK_LENGTH;

      const dl=b.lane-a.lane;
      const dist=Math.hypot(ds,dl);

      const minDist=a.radius+b.radius;

      if(dist>=minDist||dist<.001)
        continue;

      const nx=ds/dist;
      const ny=dl/dist;

      const relV=
        (b.v-a.v)*nx+
        (b.laneV-a.laneV)*ny;

      /*
        IMPORTANT FIX:
        Use equal marble mass directly rather than
        referring to an undefined m.mass.
      */
      if(relV<0){

        const impulse=
          -(1+MARBLE_RESTITUTION)*
          relV/2;

        a.v-=impulse*nx;
        a.laneV-=impulse*ny;

        b.v+=impulse*nx;
        b.laneV+=impulse*ny;

        if(Math.random()<.25){

          a.formTarget=
            clamp(
              a.formTarget+
              randomRange(-.04,.05),
              -.12,.12
            );

          b.formTarget=
            clamp(
              b.formTarget+
              randomRange(-.04,.05),
              -.12,.12
            );
        }
      }

      const push=(minDist-dist)*.55;

      a.s-=nx*push;
      a.lane-=ny*push;

      b.s+=nx*push;
      b.lane+=ny*push;

      a.v=clamp(
        a.v,
        MIN_SPEED,
        MAX_SPEED*a.speedMul*1.15
      );

      b.v=clamp(
        b.v,
        MIN_SPEED,
        MAX_SPEED*b.speedMul*1.15
      );
    }
  }
}

/* =========================================================
   DRAFTING
========================================================= */

function getDraftBoost(m){

  let boost=0;

  for(const other of marble){

    if(other===m||other.finished)
      continue;

    const ds=other.s-m.s;

    if(ds>3&&ds<38){

      const laneGap=
        Math.abs(other.lane-m.lane);

      if(laneGap<22){

        const distanceFactor=1-ds/38;
        const laneFactor=1-laneGap/22;

        boost+=
          .65*
          distanceFactor*
          laneFactor;
      }
    }
  }

  return clamp(boost,0,1.2);
}

/* =========================================================
   RACING LINE
========================================================= */

function updateRacingLine(m,dt){

  m.laneChangeTimer-=dt;

  let blocker=null;
  let closest=9999;

  for(const other of marble){

    if(other===m||other.finished)
      continue;

    const ds=other.s-m.s;

    const lateral=
      Math.abs(other.lane-m.lane);

    if(
      ds>1&&
      ds<34&&
      lateral<13&&
      ds<closest
    ){
      closest=ds;
      blocker=other;
    }
  }

  if(m.laneChangeTimer<=0){

    let target=m.lane;

    if(blocker){

      const preferred=
        Math.random()<.5?-1:1;

      target=
        blocker.lane+
        preferred*
        randomRange(16,29);

      for(const other of marble){

        if(
          other===m||
          other===blocker||
          other.finished
        )
          continue;

        if(
          Math.abs(other.s-m.s)<28&&
          Math.abs(other.lane-target)<13
        ){

          target=
            blocker.lane-
            preferred*
            randomRange(16,29);

          break;
        }
      }

    }else if(
      Math.random()<.36*m.chaos
    ){

      target=randomRange(-35,35);
    }

    m.desiredLane=clamp(target,-38,38);

    m.laneChangeTimer=
      randomRange(.7,1.8)/
      Math.max(.5,m.chaos);
  }

  const laneDifference=
    m.desiredLane-m.lane;

  m.laneV+=
    clamp(
      laneDifference*.9,
      -15,
      15
    )*dt;

  m.laneV+=
    Math.sin(
      raceTime*m.rhythm+
      m.rhythmPhase
    )*
    .08*
    m.chaos*
    dt;
}

/* =========================================================
   MARBLE UPDATE
========================================================= */

function updateMarble(m,dt){

  if(m.finished)return;

  /*
    Periodically change the marble's form.
    This creates natural overtaking.
  */
  m.formTimer-=dt;

  if(m.formTimer<=0){

    m.formTimer=
      randomRange(2.2,5.5);

    m.formTarget=
      randomRange(
        -.09,
        .09
      )*
      (1+m.variance*4);
  }

  m.form=
    lerp(
      m.form,
      m.formTarget,
      clamp(dt*.55,0,1)
    );

  /*
    Smooth performance waves.
  */
  const wave1=
    Math.sin(
      raceTime*m.rhythm+
      m.rhythmPhase
    )*
    m.variance;

  const wave2=
    Math.sin(
      raceTime*.31+
      m.randomSeed
    )*
    m.variance*.75;

  const wave3=
    Math.sin(
      raceTime*.83+
      m.randomSeed*.37
    )*
    m.variance*.35;

  let performance=
    1+
    wave1+
    wave2+
    wave3+
    m.form;

  /*
    Very subtle catch-up effect.
    This prevents an early leader from simply
    driving away for the entire race.
  */
  const rank=
    1+
    marble.filter(
      x=>
        x!==m&&
        !x.finished&&
        x.s>m.s
    ).length;

  const catchup=
    clamp(
      (rank-1)*.004,
      0,
      .025
    );

  performance+=catchup;

  const draft=getDraftBoost(m);

  performance+=draft*.018;

  const effectiveMax=
    MAX_SPEED*
    m.speedMul*
    performance;

  const speedRatio=
    clamp(
      m.v/effectiveMax,
      0,
      1.2
    );

  const acceleration=
    BASE_ACCEL*
    m.accelMul*
    performance*
    (
      1-
      speedRatio*.60
    );

  m.v+=acceleration*dt;

  if(draft>0)
    m.v+=draft*.85*dt;

  m.v-=m.v*ROLLING_DRAG*dt;
  m.v-=m.v*m.v*AIR_DRAG*dt;

  /*
    Corner handling.
  */
  const ahead=trackFrame(m.s+24);
  const here=trackFrame(m.s);

  const dot=
    ahead.t.x*here.t.x+
    ahead.t.y*here.t.y;

  const cornerAmount=Math.max(0,1-dot);

  m.v-=
    m.v*
    cornerAmount*
    CORNER_DRAG*
    dt/
    Math.max(.7,m.cornerMul);

  /*
    Grip also affects lateral stability.
  */
  const cornerSlip=
    cornerAmount*
    (1-m.grip)*
    m.v*
    .035;

  m.laneV+=
    randomRange(-1,1)*
    cornerSlip*
    dt;

  m.v+=
    Math.sin(
      raceTime*.73+
      m.randomSeed
    )*.018*dt;

  m.v=clamp(
    m.v,
    MIN_SPEED,
    effectiveMax
  );

  updateRacingLine(m,dt);

  /*
    Lateral physics.
  */
  m.laneV*=
    Math.pow(.34,dt);

  m.laneV+=
    (
      -m.lane*
      .055*
      m.grip+
      (
        m.desiredLane-
        m.lane
      )*
      .24*
      m.chaos
    )*
    dt;

  m.lane+=m.laneV*dt;

  resolveWall(m);

  for(const o of obstacles)
    resolveObstacle(m,o);

  resolveWall(m);

  const oldS=m.s;

  m.s+=m.v*dt;

  /*
    Physical rolling rotation:
    circumference = 2πr,
    angular travel = distance/r.
  */
  m.spin+=
    (m.s-oldS)/
    m.radius;

  m.recentSpeed=
    lerp(
      m.recentSpeed,
      m.v,
      clamp(dt*8,0,1)
    );

  m.hitFlash=
    Math.max(
      0,
      m.hitFlash-dt
    );

  if(m.s>=TRACK_LENGTH){

    m.finished=true;
    m.finishTime=raceTime;

    m.place=
      marble.filter(
        x=>x.finished
      ).length;

    m.s=TRACK_LENGTH;
    m.v=0;
  }
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(
    !raceRunning||
    paused||
    raceFinished||
    countdownActive
  )
    return;

  raceTime+=dt;

  for(const m of marble)
    updateMarble(m,dt);

  resolveMarbleCollisions();

  if(marble.every(m=>m.finished))
    finishRace();
}

/* =========================================================
   CAMERAS
========================================================= */

function getSelectedMarble(){

  if(!marble.length)
    return null;

  selected=
    clamp(
      Number.isFinite(selected)?
        selected:0,
      0,
      marble.length-1
    );

  return marble[selected];
}

function getFirstPersonCamera(){

  const me=getSelectedMarble();

  if(!me)
    return{
      x:0,
      y:0,
      angle:0,
      height:25
    };

  const frame=trackFrame(me.s);
  const pos=marbleWorldPosition(me);

  return{
    x:pos.x-frame.t.x*5,
    y:pos.y-frame.t.y*5,
    angle:Math.atan2(frame.t.y,frame.t.x),
    height:25
  };
}

function getSpectatorCamera(){

  const me=getSelectedMarble();

  if(!me)
    return{
      x:0,
      y:0,
      lookX:100,
      lookY:0,
      height:150,
      pitch:.96
    };

  const frame=trackFrame(me.s);
  const pos=marbleWorldPosition(me);

  const behind=125;
  const side=12;
  const height=150;
  const lookAhead=175;

  return{
    x:
      pos.x-
      frame.t.x*behind+
      frame.n.x*side,

    y:
      pos.y-
      frame.t.y*behind+
      frame.n.y*side,

    lookX:
      pos.x+
      frame.t.x*lookAhead,

    lookY:
      pos.y+
      frame.t.y*lookAhead,

    height,
    pitch:.96
  };
}

/* =========================================================
   PROJECTION
========================================================= */

function project3D(
  x,y,
  cameraX,cameraY,
  lookX,lookY,
  cameraHeight
){

  const dx=x-cameraX;
  const dy=y-cameraY;

  let fx=lookX-cameraX;
  let fy=lookY-cameraY;

  const len=Math.hypot(fx,fy)||1;

  fx/=len;
  fy/=len;

  const rightX=-fy;
  const rightY=fx;

  const depth=dx*fx+dy*fy;
  const side=dx*rightX+dy*rightY;

  if(depth<-10)
    return null;

  const focal=Math.min(W,H)*.92;
  const scale=focal/(depth+cameraHeight);

  return{
    x:W/2+side*scale,
    y:H*.12+cameraHeight*scale,
    scale,
    depth
  };
}

function projectSpectator3D(
  x,y,z,camera
){

  const dx=x-camera.x;
  const dy=y-camera.y;

  let fx=camera.lookX-camera.x;
  let fy=camera.lookY-camera.y;

  const len=Math.hypot(fx,fy)||1;

  fx/=len;
  fy/=len;

  const rightX=-fy;
  const rightY=fx;

  const horizontalDepth=
    dx*fx+
    dy*fy;

  const side=
    dx*rightX+
    dy*rightY;

  const vertical=z-camera.height;
  const pitch=camera.pitch;

  const depth=
    horizontalDepth*Math.cos(pitch)-
    vertical*Math.sin(pitch);

  if(depth<5)
    return null;

  const cameraVertical=
    horizontalDepth*Math.sin(pitch)+
    vertical*Math.cos(pitch);

  const focal=Math.min(W,H)*1.18;
  const scale=focal/depth;

  return{
    x:W/2+side*scale,
    y:H*.50-cameraVertical*scale,
    scale,
    depth
  };
}

/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#070a12");
  g.addColorStop(.42,"#101727");
  g.addColorStop(1,"#05070b");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha=.35;

  for(let i=0;i<100;i++){

    const x=(i*137.7)%W;
    const y=(i*71.3)%(H*.45);

    ctx.fillStyle="#fff";
    ctx.fillRect(x,y,1,1);
  }

  ctx.restore();
}

/* =========================================================
   MARBLE RENDERING
========================================================= */

function drawRollingMarble(
  x,y,r,color,spin,
  selectedMarble=false,
  motionAngle=0,
  speed=20
){

  if(r<.45)
    return;

  ctx.save();

  const speedFactor=
    clamp(speed/MAX_SPEED,0,1);

  /*
    Shadow.
  */
  const shadow=
    ctx.createRadialGradient(
      x,
      y+r*.72,
      0,
      x,
      y+r*.72,
      r*1.65
    );

  shadow.addColorStop(0,"rgba(0,0,0,.78)");
  shadow.addColorStop(.45,"rgba(0,0,0,.35)");
  shadow.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=shadow;

  ctx.beginPath();

  ctx.ellipse(
    x,
    y+r*.70,
    r*1.28,
    r*.60,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  const stretch=1+speedFactor*.045;

  /*
    Sphere.
  */
  const g=
    ctx.createRadialGradient(
      x-r*.40,
      y-r*.46,
      r*.03,
      x,
      y,
      r*1.05
    );

  g.addColorStop(0,"#fff");
  g.addColorStop(.11,"#fff");
  g.addColorStop(.22,color);
  g.addColorStop(.68,color);
  g.addColorStop(.88,"#111");
  g.addColorStop(1,"#020202");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.ellipse(
    x,
    y,
    r*stretch,
    r,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Rotating texture.
  */
  ctx.save();

  ctx.beginPath();

  ctx.ellipse(
    x,
    y,
    r*stretch,
    r,
    0,
    0,
    Math.PI*2
  );

  ctx.clip();

  ctx.translate(x,y);
  ctx.rotate(spin);

  ctx.strokeStyle="rgba(255,255,255,.95)";
  ctx.lineWidth=Math.max(1.3,r*.16);

  ctx.beginPath();

  ctx.ellipse(
    0,0,
    r*.98,
    r*.30,
    0,0,Math.PI*2
  );

  ctx.stroke();

  ctx.rotate(Math.PI*.37);

  ctx.strokeStyle="rgba(255,255,255,.62)";
  ctx.lineWidth=Math.max(1,r*.105);

  ctx.beginPath();

  ctx.ellipse(
    0,0,
    r*.91,
    r*.16,
    0,0,Math.PI*2
  );

  ctx.stroke();

  ctx.rotate(Math.PI*.43);

  ctx.strokeStyle="rgba(0,0,0,.62)";
  ctx.lineWidth=Math.max(1,r*.13);

  ctx.beginPath();

  ctx.ellipse(
    0,0,
    r*.86,
    r*.20,
    0,0,Math.PI*2
  );

  ctx.stroke();

  for(let i=-2;i<=2;i++){

    const phase=spin+i*.85;

    const width=
      Math.abs(Math.cos(phase))*.72+.12;

    ctx.strokeStyle=
      i%2===0
        ?"rgba(255,255,255,.48)"
        :"rgba(0,0,0,.30)";

    ctx.lineWidth=Math.max(.7,r*.065);

    ctx.beginPath();

    ctx.ellipse(
      Math.sin(phase)*r*.32,
      0,
      r*width*.38,
      r*.96,
      0,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }

  const patchAngle=spin*1.35;

  const px=Math.cos(patchAngle)*r*.52;
  const py=Math.sin(patchAngle)*r*.52;

  const patch=
    ctx.createRadialGradient(
      px,py,0,
      px,py,r*.38
    );

  patch.addColorStop(
    0,
    "rgba(255,255,255,.65)"
  );

  patch.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=patch;

  ctx.beginPath();

  ctx.arc(
    px,
    py,
    r*.38,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  /*
    Moving highlight.
  */
  const hx=
    x+
    Math.cos(spin*1.25)*
    r*.43;

  const hy=
    y+
    Math.sin(spin*1.25)*
    r*.36;

  const highlight=
    ctx.createRadialGradient(
      hx,hy,0,
      hx,hy,r*.22
    );

  highlight.addColorStop(
    0,
    "rgba(255,255,255,.98)"
  );

  highlight.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=highlight;

  ctx.beginPath();

  ctx.arc(
    hx,
    hy,
    r*.24,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Motion trail.
  */
  const trail=clamp(
    r*(.65+speedFactor*3.2),
    2,
    34
  );

  const backAngle=motionAngle+Math.PI;

  const tx=x+Math.cos(backAngle)*r*.72;
  const ty=y+Math.sin(backAngle)*r*.72;

  const trailGrad=
    ctx.createLinearGradient(
      tx,
      ty,
      tx+Math.cos(backAngle)*trail,
      ty+Math.sin(backAngle)*trail
    );

  trailGrad.addColorStop(
    0,
    "rgba(255,255,255,.55)"
  );

  trailGrad.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.strokeStyle=trailGrad;
  ctx.lineWidth=Math.max(1,r*.10);

  ctx.beginPath();

  ctx.moveTo(tx,ty);

  ctx.lineTo(
    tx+Math.cos(backAngle)*trail,
    ty+Math.sin(backAngle)*trail
  );

  ctx.stroke();

  if(selectedMarble){

    ctx.strokeStyle="#fff";
    ctx.lineWidth=Math.max(2,r*.11);

    ctx.beginPath();

    ctx.arc(
      x,y,r*1.25,
      0,Math.PI*2
    );

    ctx.stroke();
  }

  ctx.restore();
}

/* =========================================================
   NAME LABEL
========================================================= */

function drawNameLabel(
  m,x,y,radius,selectedLabel=false
){

  const size=clamp(radius*1.35,11,25);

  ctx.save();

  ctx.font=`900 ${size}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  const textWidth=ctx.measureText(m.name).width;

  const padX=7;
  const padY=4;

  const boxX=x-textWidth/2-padX;
  const boxY=y-radius-size-8-padY;
  const boxW=textWidth+padX*2;
  const boxH=size+padY*2;

  ctx.fillStyle="rgba(0,0,0,.88)";

  ctx.beginPath();

  ctx.roundRect(
    boxX,
    boxY,
    boxW,
    boxH,
    6
  );

  ctx.fill();

  if(selectedLabel){

    ctx.strokeStyle=m.color;
    ctx.lineWidth=2;
    ctx.stroke();
  }

  ctx.fillStyle="#fff";

  ctx.fillText(
    m.name,
    x,
    boxY+boxH/2
  );

  ctx.restore();
}

/* =========================================================
   FIRST PERSON TRACK
========================================================= */

function drawFirstPersonTrack(camera){

  const me=getSelectedMarble();
  if(!me)return;

  const sections=[];

  for(let ds=-20;ds<=460;ds+=5){

    const s=clamp(
      me.s+ds,
      0,
      TRACK_LENGTH-1
    );

    const frame=trackFrame(s);

    const left={
      x:frame.p.x-frame.n.x*ROAD_HALF,
      y:frame.p.y-frame.n.y*ROAD_HALF
    };

    const right={
      x:frame.p.x+frame.n.x*ROAD_HALF,
      y:frame.p.y+frame.n.y*ROAD_HALF
    };

    const lookX=
      camera.x+
      Math.cos(camera.angle)*100;

    const lookY=
      camera.y+
      Math.sin(camera.angle)*100;

    const lp=project3D(
      left.x,left.y,
      camera.x,camera.y,
      lookX,lookY,
      camera.height
    );

    const rp=project3D(
      right.x,right.y,
      camera.x,camera.y,
      lookX,lookY,
      camera.height
    );

    const cp=project3D(
      frame.p.x,frame.p.y,
      camera.x,camera.y,
      lookX,lookY,
      camera.height
    );

    if(lp&&rp&&cp)
      sections.push({lp,rp,cp,s});
  }

  sections.sort(
    (a,b)=>b.cp.depth-a.cp.depth
  );

  for(let i=0;i<sections.length-1;i++){

    const a=sections[i];
    const b=sections[i+1];

    ctx.beginPath();

    ctx.moveTo(a.lp.x,a.lp.y);
    ctx.lineTo(a.rp.x,a.rp.y);
    ctx.lineTo(b.rp.x,b.rp.y);
    ctx.lineTo(b.lp.x,b.lp.y);
    ctx.closePath();

    ctx.fillStyle=
      Math.floor(a.s/18)%2===0
        ?" #252b34".trim()
        :"#20262d";

    ctx.fill();
  }

  for(const side of[-1,1]){

    ctx.beginPath();

    let started=false;

    for(const section of sections){

      const p=side<0?section.lp:section.rp;

      if(!started){
        ctx.moveTo(p.x,p.y);
        started=true;
      }else{
        ctx.lineTo(p.x,p.y);
      }
    }

    ctx.strokeStyle="#e7edf3";
    ctx.lineWidth=3;
    ctx.stroke();
  }
}

/* =========================================================
   FIRST PERSON MARBLES
========================================================= */

function drawFirstPersonMarbles(camera){

  const me=getSelectedMarble();
  if(!me)return;

  const visible=[];

  for(const m of marble){

    /*
      IMPORTANT:
      The selected marble is NOT drawn here.
      This prevents the duplicate marble bug.
    */
    if(m.id===selected||m.finished)
      continue;

    const relative=m.s-me.s;

    if(relative<-40||relative>450)
      continue;

    const pos=marbleWorldPosition(m);

    const lookX=
      camera.x+
      Math.cos(camera.angle)*100;

    const lookY=
      camera.y+
      Math.sin(camera.angle)*100;

    const p=project3D(
      pos.x,pos.y,
      camera.x,camera.y,
      lookX,lookY,
      camera.height
    );

    if(p)
      visible.push({m,p});
  }

  visible.sort(
    (a,b)=>b.p.depth-a.p.depth
  );

  for(const item of visible){

    const m=item.m;
    const p=item.p;

    const r=clamp(
      m.radius*p.scale*1.18,
      2.5,
      80
    );

    const frame=trackFrame(m.s);

    const angle=
      Math.atan2(
        frame.t.y,
        frame.t.x
      );

    drawRollingMarble(
      p.x,p.y,r,
      m.color,
      m.spin,
      false,
      angle,
      m.v
    );

    drawNameLabel(
      m,
      p.x,
      p.y,
      r,
      false
    );
  }
}

/* =========================================================
   FIRST PERSON OBSTACLES
========================================================= */

function drawFirstPersonObstacles(camera){

  const me=getSelectedMarble();
  if(!me)return;

  for(const o of obstacles){

    const relative=o.s-me.s;

    if(relative<-30||relative>460)
      continue;

    const frame=trackFrame(o.s);

    const pos={
      x:frame.p.x+frame.n.x*o.lane,
      y:frame.p.y+frame.n.y*o.lane
    };

    const lookX=
      camera.x+
      Math.cos(camera.angle)*100;

    const lookY=
      camera.y+
      Math.sin(camera.angle)*100;

    const p=project3D(
      pos.x,pos.y,
      camera.x,camera.y,
      lookX,lookY,
      camera.height
    );

    if(!p)continue;

    const r=Math.max(
      2,
      o.radius*p.scale
    );

    ctx.fillStyle=
      o.type==="bumper"
        ?" #e67e22".trim()
        :"#777";

    ctx.beginPath();

    ctx.arc(
      p.x,p.y,r,
      0,Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=1.5;
    ctx.stroke();
  }
}

/* =========================================================
   SPECTATOR VIEW
========================================================= */

function drawSpectatorView(){

  const camera=getSpectatorCamera();

  const sky=
    ctx.createLinearGradient(
      0,0,0,H
    );

  sky.addColorStop(0,"#111b31");
  sky.addColorStop(.38,"#1b2940");
  sky.addColorStop(1,"#070a0f");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  const me=getSelectedMarble();
  if(!me)return;

  const sections=[];

  const start=clamp(
    me.s-160,
    0,
    TRACK_LENGTH-1
  );

  const end=clamp(
    me.s+600,
    0,
    TRACK_LENGTH-1
  );

  for(let s=start;s<=end;s+=4){

    const frame=trackFrame(s);

    const left={
      x:frame.p.x-frame.n.x*ROAD_HALF,
      y:frame.p.y-frame.n.y*ROAD_HALF
    };

    const right={
      x:frame.p.x+frame.n.x*ROAD_HALF,
      y:frame.p.y+frame.n.y*ROAD_HALF
    };

    const center=projectSpectator3D(
      frame.p.x,
      frame.p.y,
      0,
      camera
    );

    const lp=projectSpectator3D(
      left.x,
      left.y,
      0,
      camera
    );

    const rp=projectSpectator3D(
      right.x,
      right.y,
      0,
      camera
    );

    if(center&&lp&&rp)
      sections.push({
        center,lp,rp,s
      });
  }

  sections.sort(
    (a,b)=>b.center.depth-a.center.depth
  );

  for(let i=0;i<sections.length-1;i++){

    const a=sections[i];
    const b=sections[i+1];

    ctx.beginPath();

    ctx.moveTo(a.lp.x,a.lp.y);
    ctx.lineTo(a.rp.x,a.rp.y);
    ctx.lineTo(b.rp.x,b.rp.y);
    ctx.lineTo(b.lp.x,b.lp.y);
    ctx.closePath();

    ctx.fillStyle=
      Math.floor(a.s/20)%2===0
        ?" #303741".trim()
        :"#252b34";

    ctx.fill();
  }

  /*
    Road edges.
  */
  for(const side of[-1,1]){

    ctx.beginPath();

    let first=true;

    for(const section of sections){

      const p=side<0?section.lp:section.rp;

      if(first){
        ctx.moveTo(p.x,p.y);
        first=false;
      }else{
        ctx.lineTo(p.x,p.y);
      }
    }

    ctx.strokeStyle="#f4f7fa";
    ctx.lineWidth=4;
    ctx.stroke();
  }

  /*
    Center markings.
  */
  for(let i=0;i<sections.length-1;i+=5){

    const a=sections[i];
    const b=sections[
      Math.min(i+1,sections.length-1)
    ];

    ctx.strokeStyle="rgba(255,255,255,.16)";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      a.center.x,
      a.center.y
    );

    ctx.lineTo(
      b.center.x,
      b.center.y
    );

    ctx.stroke();
  }

  /*
    Obstacles.
  */
  const visibleObstacles=[];

  for(const o of obstacles){

    if(o.s<start||o.s>end)
      continue;

    const frame=trackFrame(o.s);

    const pos={
      x:frame.p.x+frame.n.x*o.lane,
      y:frame.p.y+frame.n.y*o.lane
    };

    const p=projectSpectator3D(
      pos.x,
      pos.y,
      o.radius,
      camera
    );

    if(p)
      visibleObstacles.push({o,p});
  }

  visibleObstacles.sort(
    (a,b)=>b.p.depth-a.p.depth
  );

  for(const item of visibleObstacles){

    const o=item.o;
    const p=item.p;

    const r=clamp(
      o.radius*p.scale*1.2,
      2,
      42
    );

    ctx.save();

    if(o.type==="bumper"){

      const g=
        ctx.createRadialGradient(
          p.x-r*.35,
          p.y-r*.35,
          r*.05,
          p.x,
          p.y,
          r
        );

      g.addColorStop(0,"#fff");
      g.addColorStop(.25,"#ffd166");
      g.addColorStop(1,"#d35400");

      ctx.fillStyle=g;

      ctx.beginPath();

      ctx.arc(
        p.x,p.y,r,
        0,Math.PI*2
      );

      ctx.fill();

    }else{

      ctx.fillStyle="#777";

      ctx.fillRect(
        p.x-r,
        p.y-r,
        r*2,
        r*2
      );
    }

    ctx.strokeStyle="#fff";
    ctx.lineWidth=1.5;
    ctx.stroke();

    ctx.restore();
  }

  /*
    Marbles.
    Every marble is drawn exactly once.
  */
  const visibleMarbles=[];

  for(const m of marble){

    if(m.finished)
      continue;

    if(
      m.s<start-20||
      m.s>end+20
    )
      continue;

    const pos=marbleWorldPosition(m);

    const p=projectSpectator3D(
      pos.x,
      pos.y,
      m.radius,
      camera
    );

    if(p)
      visibleMarbles.push({m,p});
  }

  visibleMarbles.sort(
    (a,b)=>b.p.depth-a.p.depth
  );

  for(const item of visibleMarbles){

    const m=item.m;
    const p=item.p;

    const r=clamp(
      m.radius*p.scale*1.5,
      3,
      70
    );

    const frame=trackFrame(m.s);

    const motionAngle=
      Math.atan2(
        frame.t.y,
        frame.t.x
      );

    drawRollingMarble(
      p.x,
      p.y,
      r,
      m.color,
      m.spin,
      m.id===selected,
      motionAngle,
      m.v
    );

    drawNameLabel(
      m,
      p.x,
      p.y,
      r,
      m.id===selected
    );
  }

  /*
    Header.
  */
  const following=getSelectedMarble();

  ctx.save();

  ctx.font="900 15px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  const title=
    `SPECTATOR • FOLLOWING ${following.name}`;

  const tw=ctx.measureText(title).width;

  ctx.fillStyle="rgba(0,0,0,.72)";

  ctx.beginPath();

  ctx.roundRect(
    W/2-tw/2-15,
    18,
    tw+30,
    34,
    9
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.fillText(
    title,
    W/2,
    35
  );

  ctx.restore();

  /*
    Speed bar.
  */
  const speed=following.v;

  const speedPercent=
    clamp(
      speed/MAX_SPEED,
      0,
      1
    );

  ctx.save();

  const barW=220;
  const barX=W/2-barW/2;
  const barY=H-32;

  ctx.fillStyle="rgba(0,0,0,.65)";

  ctx.beginPath();

  ctx.roundRect(
    barX-8,
    barY-6,
    barW+16,
    20,
    7
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.fillRect(
    barX,
    barY,
    barW*speedPercent,
    8
  );

  ctx.font="bold 11px Arial";
  ctx.textAlign="center";
  ctx.fillStyle="#fff";

  ctx.fillText(
    `SPEED ${speed.toFixed(1)}`,
    W/2,
    barY-9
  );

  ctx.restore();
}

/* =========================================================
   SCENE
========================================================= */

function drawScene(){

  drawBackground();

  if(!raceRunning)
    return;

  if(cameraMode==="spectator"){

    drawSpectatorView();

    return;
  }

  const camera=getFirstPersonCamera();

  drawFirstPersonTrack(camera);
  drawFirstPersonObstacles(camera);
  drawFirstPersonMarbles(camera);

  const me=getSelectedMarble();

  if(!me)return;

  const speedRatio=
    clamp(
      me.v/MAX_SPEED,
      0,
      1
    );

  if(speedRatio>.45){

    ctx.save();

    ctx.globalAlpha=speedRatio*.20;
    ctx.strokeStyle="#fff";
    ctx.lineWidth=1;

    for(let i=0;i<30;i++){

      const x=(i*127)%W;
      const y=(i*67)%H;

      ctx.beginPath();

      ctx.moveTo(x,y);

      ctx.lineTo(
        W/2+(x-W/2)*.42,
        H/2+(y-H/2)*.42
      );

      ctx.stroke();
    }

    ctx.restore();
  }
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  if(!raceRunning)
    return;

  const me=getSelectedMarble();

  if(!me)return;

  const position=
    1+
    marble.filter(
      m=>
        m.s>me.s&&
        !m.finished
    ).length;

  const progress=
    clamp(
      me.s/TRACK_LENGTH,
      0,
      1
    )*100;

  hudLeft.innerHTML=
    `<b>${me.name}</b><br>`+
    `Position: ${position}/${marble.length}<br>`+
    `Speed: ${me.v.toFixed(1)}`;

  hudRight.innerHTML=
    `${tracks[Number(trackSelect.value)]}<br>`+
    `${progress.toFixed(0)}% &nbsp; `+
    `${raceTime.toFixed(1)}s`;
}

/* =========================================================
   COUNTDOWN
========================================================= */

function runCountdown(){

  countdownActive=true;
  countdown.style.display="flex";

  const sequence=["3","2","1","GO!"];
  let i=0;

  function next(){

    if(i>=sequence.length){

      countdown.style.display="none";
      countdownActive=false;

      beep(880,.15);

      return;
    }

    countdown.textContent=sequence[i];

    beep(
      sequence[i]==="GO!"
        ?880
        :440+i*70,
      .1
    );

    i++;

    setTimeout(next,650);
  }

  next();
}

/* =========================================================
   BANK
========================================================= */

function updateBank(){

  bankDisplay.textContent=
    "$"+bank.toFixed(0);
}

/* =========================================================
   START RACE
========================================================= */

function startRace(){

  let requestedBet=
    Math.max(
      1,
      Number(betInput.value)||25
    );

  if(requestedBet>bank)
    requestedBet=bank;

  if(requestedBet<=0){

    alert(
      "You need money to place a bet."
    );

    return;
  }

  /*
    IMPORTANT:
    Read the player's selection directly from
    the dropdown every single time.
  */
  const chosen=
    Number(playerSelect.value);

  if(
    !Number.isInteger(chosen)||
    chosen<0||
    chosen>=names.length
  ){

    selected=0;
    playerSelect.value="0";

  }else{

    selected=chosen;
  }

  currentBet=requestedBet;
  bank-=currentBet;

  updateBank();

  const seed=
    Number(trackSelect.value)+1+
    Math.floor(Math.random()*100000);

  track=generateTrack(seed);
  generateObstacles(seed);
  createMarbles();

  /*
    Verify the selected racer exists after creating
    the new field. This prevents a stale selection
    from breaking the camera.
  */
  if(
    !marble[selected]
  ){

    selected=0;
    playerSelect.value="0";
  }

  raceTime=0;

  raceRunning=true;
  paused=false;
  raceFinished=false;
  cameraMode="first";

  menu.style.display="none";
  finish.style.display="none";
  hud.style.display="flex";

  lastTime=performance.now();

  runCountdown();
}

/* =========================================================
   RETURN TO MENU FOR NEW MARBLE
========================================================= */

function returnToMenu(){

  raceRunning=false;
  raceFinished=false;
  paused=false;
  countdownActive=false;

  countdown.style.display="none";
  finish.style.display="none";
  hud.style.display="none";
  menu.style.display="flex";

  /*
    Keep the current marble selected in the menu.
  */
  playerSelect.value=String(selected);

  updateBank();
}

/* =========================================================
   SAME MARBLE RESTART
========================================================= */

function restartSameMarble(){

  /*
    A restart is treated as cancelling the previous race
    and placing the wager again.
  */
  if(
    raceRunning||
    raceFinished
  ){

    bank+=currentBet;
    updateBank();
  }

  playerSelect.value=String(selected);

  startRace();
}

/* =========================================================
   FINISH
========================================================= */

function finishRace(){

  raceFinished=true;
  raceRunning=false;

  hud.style.display="none";
  finish.style.display="flex";

  const sorted=[...marble].sort((a,b)=>{

    if(a.place&&b.place)
      return a.place-b.place;

    if(a.finished&&!b.finished)
      return -1;

    if(!a.finished&&b.finished)
      return 1;

    return b.s-a.s;
  });

  const winner=sorted[0];

  let payout=0;

  if(winner.id===selected){

    payout=currentBet*3;
    bank+=payout;

    finishTitle.textContent=
      `🏆 ${winner.name} wins!`;

  }else{

    finishTitle.textContent=
      `${winner.name} wins the race`;
  }

  updateBank();

  results.innerHTML="";

  sorted.forEach((m,i)=>{

    const div=document.createElement("div");
    div.className="result";

    const place=
      i===0?"🥇":
      i===1?"🥈":
      i===2?"🥉":
      `${i+1}.`;

    div.innerHTML=
      `<span>${place} `+
      `<b style="color:${m.color}">`+
      `${m.name}`+
      `</b></span>`+
      `<span>${
        m.finishTime
          ?m.finishTime.toFixed(2)+"s"
          :""
      }</span>`;

    results.appendChild(div);
  });

  if(payout>0){

    const payoutDiv=document.createElement("div");

    payoutDiv.style.marginTop="15px";
    payoutDiv.style.textAlign="center";
    payoutDiv.style.color="#67e8a5";
    payoutDiv.style.fontWeight="bold";

    payoutDiv.textContent=
      `You won $${payout}!`;

    results.appendChild(payoutDiv);
  }

  /*
    Populate the finish-screen racer selector.
  */
  finishPlayerSelect.innerHTML="";

  names.forEach((name,i)=>{

    const option=document.createElement("option");

    option.value=i;
    option.textContent=name;

    finishPlayerSelect.appendChild(option);
  });

  finishPlayerSelect.value=String(selected);
}

/* =========================================================
   FINISH SCREEN RACER SELECTION
========================================================= */

finishPlayerSelect.addEventListener(
  "change",
  ()=>{

    const n=
      Number(
        finishPlayerSelect.value
      );

    if(
      Number.isInteger(n)&&
      n>=0&&
      n<names.length
    ){

      selected=n;
      playerSelect.value=String(n);
    }
  }
);

/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startRace
  );

restartBtn.addEventListener(
  "click",
  restartSameMarble
);

newRaceBtn.addEventListener(
  "click",
  ()=>{

    /*
      Copy the finish-screen choice to the main
      player selector before returning to the menu.
    */
    const chosen=
      Number(
        finishPlayerSelect.value
      );

    if(
      Number.isInteger(chosen)&&
      chosen>=0&&
      chosen<names.length
    ){

      selected=chosen;
      playerSelect.value=String(chosen);
    }

    returnToMenu();
  }
);

/* =========================================================
   KEYBOARD
========================================================= */

addEventListener("keydown",e=>{

  if(
    document.activeElement===betInput&&
    e.key!=="Escape"
  )
    return;

  /*
    Camera.
  */
  if(e.key.toLowerCase()==="v"){

    if(!raceRunning)
      return;

    cameraMode=
      cameraMode==="first"
        ?"spectator"
        :"first";

    beep(620,.06);
  }

  /*
    Restart.
  */
  if(e.key.toLowerCase()==="r"){

    if(
      raceRunning||
      raceFinished
    ){

      restartSameMarble();
    }
  }

  /*
    Mute.
  */
  if(e.key.toLowerCase()==="m"){

    muted=!muted;

    beep(500,.05);
  }

  /*
    Pause.
  */
  if(e.code==="Space"){

    e.preventDefault();

    if(
      raceRunning&&
      !countdownActive
    ){

      paused=!paused;
    }
  }

  /*
    Racer selection.
    Works during a race and also keeps the menu
    selection synchronized.
  */
  if(
    e.key>="1"&&
    e.key<="8"
  ){

    const n=Number(e.key)-1;

    if(
      Number.isInteger(n)&&
      n>=0&&
      n<names.length
    ){

      selected=n;
      playerSelect.value=String(n);

      if(raceFinished)
        finishPlayerSelect.value=String(n);
    }
  }
});

/* =========================================================
   MAIN LOOP
========================================================= */

function frame(now){

  let dt=(now-lastTime)/1000;

  lastTime=now;

  dt=clamp(dt,0,.035);

  update(dt);
  drawScene();
  updateHUD();

  requestAnimationFrame(frame);
}

updateBank();

requestAnimationFrame(frame);

</script>
</body>
</html>
