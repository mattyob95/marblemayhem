<script>
"use strict";

let H=innerHeight;
let DPR=
  Math.min(
    devicePixelRatio||1,

  );

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=
    Math.min(
      devicePixelRatio||1,
      2
    );

  canvas.width=
    Math.floor(W*DPR);

  canvas.height=
    Math.floor(H*DPR);

  canvas.style.width=
    W+"px";

  canvas.style.height=
    H+"px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

  resize
);

resize();

names.forEach(

/* =========================================================
   PHYSICS
========================================================= */

const TRACK_LENGTH=1400;

const ROAD_HALF=52;

const MARBLE_RADIUS=5;

const MAX_SPEED=44;

const MIN_SPEED=10.5;

const BASE_ACCEL=20;

const ROLLING_DRAG=.0028;

const AIR_DRAG=.000105;

const CORNER_DRAG=.00125;

const WALL_RESTITUTION=.985;

const WALL_FRICTION=.999;

const MARBLE_RESTITUTION=.96;

const OBSTACLE_RESTITUTION=.97;

/* =========================================================
   STATE
========================================================= */

let track=[];
let obstacles=[];
let marble=[];

let selected=0;

let cameraMode="first";

let raceRunning=false;
let paused=false;
let raceFinished=false;
let countdownActive=false;

let raceTime=0;

let lastTime=
  performance.now();

let bank=100;

let currentBet=25;

let muted=false;

let audioCtx=null;

/* =========================================================
   RANDOM
========================================================= */

function clamp(
  v,
  min,
  max
){
  return Math.max(
    min,
    Math.min(max,v)
  );
}

function lerp(
  a,
  b,
  t
){
  return a+(b-a)*t;
}

function randomRange(
  min,
  max
){
  return min+
    Math.random()*
    (max-min);
}

/* =========================================================
   SOUND
========================================================= */

function beep(
  freq=440,
  duration=.08,
  volume=.035
){

  if(muted)return;

  try{

    if(!audioCtx){

      audioCtx=
        new(
          window.AudioContext||
          window.webkitAudioContext
        )();
    }

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.frequency.value=
      freq;

    osc.type="sine";

    gain.gain.setValueAtTime(
      volume,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime+
      duration
    );

    osc.connect(gain);
    gain.connect(
      audioCtx.destination
    );

    osc.start();

    osc.stop(
      audioCtx.currentTime+
      duration
    );

  }catch(e){}
}

/* =========================================================
   TRACK
========================================================= */

function generateTrack(seed){

  const points=[];

  const step=4;

  let rng=
    (seed*99991+17)>>>0;

  function rand(){

    rng^=rng<<13;
    rng^=rng>>>17;
    rng^=rng<<5;

    return(
      (rng>>>0)%10000
    )/10000;
  }

  let x=0;
  let y=0;
  let angle=0;

  const zones=[];

  /*
    More corners than before.
  */
  const zoneCount=25;

  for(
    let i=0;
    i<zoneCount;
    i++
  ){

    const center=
      .035+
      i/(zoneCount-1)*.93;

    const direction=
      i%2===0
        ?1
        :-1;

    const type=rand();

    let strength;

    if(type<.18){

      strength=
        (.020+
        rand()*.016)*
        direction;

    }else if(type<.52){

      strength=
        (.011+
        rand()*.012)*
        direction;

    }else{

      strength=
        (.005+
        rand()*.009)*
        direction;
    }

    zones.push({

      center,

      width:
        .016+
        rand()*.034,

      strength,

      wobble:
        rand()*Math.PI*2
    });
  }

  const count=
    Math.floor(
      TRACK_LENGTH/step
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const s=
      i*step;

    const u=
      s/TRACK_LENGTH;

    let turn=0;

    for(
      const z of zones
    ){

      const d=
        (u-z.center)/
        z.width;

      if(
        Math.abs(d)<3
      ){

        const envelope=
          Math.exp(
            -d*d
          );

        turn+=
          z.strength*
          envelope*
          (
            .72+
            .28*
            Math.sin(
              d*Math.PI+
              z.wobble
            )
          );
      }
    }

    /*
      Extra S curves.
    */
    turn+=
      Math.sin(
        u*Math.PI*2*
        (3.2+seed%3)+
        seed*.8
      )*.005;

    turn+=
      Math.sin(
        u*Math.PI*2*
        (7.0+seed%4)+
        seed*1.7
      )*.003;

    turn+=
      Math.sin(
        u*Math.PI*2*17+
        seed
      )*.0014;

    angle+=turn;

    x+=
      Math.cos(angle)*
      step;

    y+=
      Math.sin(angle)*
      step;

    points.push({
      x,
      y,
      angle
    });
  }

  /*
    Smooth tangent estimates.
  */
  for(
    let pass=0;
    pass<3;
    pass++
  ){

    for(
      let i=0;
      i<points.length;
      i++
    ){

      const a=
        points[
          Math.max(
            0,
            i-2
          )
        ];

      const b=
        points[
          Math.min(
            points.length-1,
            i+2
          )
        ];

      points[i].angle=
        Math.atan2(
          b.y-a.y,
          b.x-a.x
        );
    }
  }

  return points;
}

function sample(s){

  s=
    clamp(
      s,
      0,
      TRACK_LENGTH-.001
    );

  const step=4;

  const f=
    s/step;

  const i=
    Math.floor(f);

  const t=
    f-i;

  const a=
    track[i];

  const b=
    track[
      Math.min(
        i+1,
        track.length-1
      )
    ];

  return{
    x:lerp(
      a.x,
      b.x,
      t
    ),
    y:lerp(
      a.y,
      b.y,
      t
    )
  };
}

function tan(s){

  s=
    clamp(
      s,
      0,
      TRACK_LENGTH-.001
    );

  const step=4;

  const f=
    s/step;

  const i=
    Math.floor(f);

  const a=
    track[
      Math.max(
        0,
        i
      )
    ];

  const b=
    track[
      Math.min(
        track.length-1,
        i+1
      )
    ];

  let dx=
    b.x-a.x;

  let dy=
    b.y-a.y;

  const len=
    Math.hypot(
      dx,
      dy
    )||1;

  return{
    x:dx/len,
    y:dy/len
  };
}

function trackFrame(s){

  const p=
    sample(s);

  const t=
    tan(s);

  return{
    p,
    t,
    n:{
      x:-t.y,
      y:t.x
    }
  };
}

function marbleWorldPosition(m){

  const frame=
    trackFrame(m.s);

  return{
    x:
      frame.p.x+
      frame.n.x*m.lane,

    y:
      frame.p.y+
      frame.n.y*m.lane
  };
}

/* =========================================================
   OBSTACLES
========================================================= */

function generateObstacles(seed){

  obstacles=[];

  let rng=
    (seed*7777+12345)>>>0;

  function rand(){

    rng^=rng<<13;
    rng^=rng>>>17;
    rng^=rng<<5;

    return(
      (rng>>>0)%10000
    )/10000;
  }

  let s=80;

  while(
    s<
    TRACK_LENGTH-60
  ){

    s+=
      75+
      rand()*85;

    if(
      s>
      TRACK_LENGTH-50
    )break;

    obstacles.push({

      s,

      lane:
        (rand()*2-1)*34,

      radius:
        6+
        rand()*3,

      type:
        rand()<.76
          ?"bumper"
          :"block"
    });
  }

  /*
    Additional random obstacle groups.
  */
  for(
    let i=0;
    i<12;
    i++
  ){

    const s2=
      90+
      i*
      (TRACK_LENGTH-180)/12+
      rand()*55;

    obstacles.push({

      s:s2,

      lane:
        (rand()*2-1)*36,

      radius:
        6+
        rand()*3,

      type:
        rand()<.8
          ?"bumper"
          :"block"
    });
  }
}

/* =========================================================
   RACER PERSONALITIES
========================================================= */

/*
  These differences are intentionally meaningful.

  speed:
    maximum cruising potential

  accel:
    how quickly the marble gets there

  corner:
    speed retention in turns

  chaos:
    tendency to change lane / take risks

  variance:
    temporary performance variation
*/

const racerProfiles=[

  {
    speed:1.00,
    accel:1.00,
    corner:1.00,
    chaos:.90,
    variance:.035
  },

  {
    speed:1.035,
    accel:1.06,
    corner:.94,
    chaos:1.15,
    variance:.045
  },

  {
    speed:.985,
    accel:.98,
    corner:1.10,
    chaos:.75,
    variance:.028
  },

  {
    speed:1.025,
    accel:1.03,
    corner:.91,
    chaos:1.30,
    variance:.055
  },

  {
    speed:1.005,
    accel:1.01,
    corner:1.04,
    chaos:.85,
    variance:.038
  },

  {
    speed:1.055,
    accel:1.08,
    corner:.88,
    chaos:1.40,
    variance:.06
  },

  {
    speed:.975,
    accel:.96,
    corner:1.12,
    chaos:1.00,
    variance:.032
  },

  {
    speed:1.015,
    accel:1.02,
    corner:.99,
    chaos:1.08,
    variance:.05
  }

];

/* =========================================================
   CREATE MARBLES
========================================================= */

function createMarbles(){

  marble=[];

  for(
    let i=0;
    i<names.length;
    i++
  ){

    const p=
      racerProfiles[i];

    const startSpeed=
      randomRange(
        20.5,
        24.5
      );

    /*
      Each race gets a different initial lane.
    */
    const startingLane=
      (i-3.5)*7.2+
      randomRange(
        -3.2,
        3.2
      );

    marble.push({

      id:i,

      name:names[i],

      color:colors[i],

      s:
        -i*5+
        randomRange(
          -2,
          2
        ),

      v:startSpeed,

      lane:startingLane,

      laneV:
        randomRange(
          -1.2,
          1.2
        ),

      radius:
        MARBLE_RADIUS,

      speedMul:p.speed,

      accelMul:p.accel,

      cornerMul:p.corner,

      chaos:p.chaos,

      variance:p.variance,

      /*
        Every marble has its own race rhythm.
      */
      rhythm:
        randomRange(
          1.4,
          2.5
        ),

      rhythmPhase:
        randomRange(
          0,
          Math.PI*2
        ),

      randomSeed:
        Math.random()*10000,

      finished:false,

      finishTime:0,

      place:0,

      hitFlash:0,

      wobble:
        Math.random()*
        Math.PI*2,

      spin:
        Math.random()*
        Math.PI*2,

      lastS:
        -i*5,

      texturePhase:
        Math.random()*
        Math.PI*2,

      /*
        Temporary performance boosts.
      */
      boostTimer:0,

      boostPower:0,

      /*
        Lane-change target.
      */
      desiredLane:
        startingLane,

      laneChangeTimer:
        randomRange(
          .5,
          2
        ),

      /*
        Used for visual speed.
      */
      recentSpeed:startSpeed
    });
  }
}

/* =========================================================
   WALLS
========================================================= */

function resolveWall(m){

  const limit=
    ROAD_HALF-
    m.radius;

  if(
    m.lane>
    limit
  ){

    m.lane=limit;

    if(m.laneV>0){

      m.laneV=
        -m.laneV*
        WALL_RESTITUTION;
    }

    m.laneV*=
      WALL_FRICTION;

    /*
      Wall impacts can randomly give a small
      change in momentum.
    */
    m.v*=.996;
  }

  if(
    m.lane<
    -limit
  ){

    m.lane=-limit;

    if(m.laneV<0){

      m.laneV=
        -m.laneV*
        WALL_RESTITUTION;
    }

    m.laneV*=
      WALL_FRICTION;

    m.v*=.996;
  }
}

/* =========================================================
   OBSTACLE COLLISION
========================================================= */

function resolveObstacle(
  m,
  o
){

  const ds=
    Math.abs(
      o.s-m.s
    );

  if(ds>12)return;

  const laneDistance=
    o.lane-m.lane;

  const minDist=
    o.radius+
    m.radius;

  if(
    Math.abs(
      laneDistance
    )<minDist
  ){

    const sign=
      laneDistance>=0
        ?-1
        :1;

    const overlap=
      minDist-
      Math.abs(
        laneDistance
      );

    m.lane+=
      sign*
      (overlap+.15);

    m.laneV+=
      sign*
      randomRange(
        13,
        20
      );

    m.laneV*=
      OBSTACLE_RESTITUTION;

    /*
      Bumper hit can cause a temporary boost or slowdown.
    */
    if(
      Math.random()<.30
    ){

      m.boostTimer=
        randomRange(
          .5,
          1.2
        );

      m.boostPower=
        randomRange(
          -.10,
          .12
        );
    }

    m.hitFlash=.16;
  }
}

/* =========================================================
   MARBLE COLLISIONS
========================================================= */

function resolveMarbleCollisions(){

  for(
    let i=0;
    i<marble.length;
    i++
  ){

    const a=
      marble[i];

    if(a.finished)
      continue;

    for(
      let j=i+1;
      j<marble.length;
      j++
    ){

      const b=
        marble[j];

      if(b.finished)
        continue;

      let ds=
        b.s-a.s;

      if(
        ds>
        TRACK_LENGTH/2
      )
        ds-=
          TRACK_LENGTH;

      if(
        ds<
        -TRACK_LENGTH/2
      )
        ds+=
          TRACK_LENGTH;

      const dl=
        b.lane-a.lane;

      const dist=
        Math.hypot(
          ds,
          dl
        );

      const minDist=
        a.radius+
        b.radius;

      if(
        dist>=minDist||
        dist<.001
      )
        continue;

      const nx=
        ds/dist;

      const ny=
        dl/dist;

      const relV=
        (b.v-a.v)*nx+
        (b.laneV-a.laneV)*ny;

      if(relV<0){

        const invA=
          1/a.mass;

        const invB=
          1/b.mass;

        const impulse=
          -(1+MARBLE_RESTITUTION)*
          relV/
          (invA+invB);

        a.v-=
          impulse*
          invA*
          nx;

        a.laneV-=
          impulse*
          invA*
          ny;

        b.v+=
          impulse*
          invB*
          nx;

        b.laneV+=
          impulse*
          invB*
          ny;

        /*
          Collision turbulence.
        */
        if(
          Math.random()<.24
        ){

          if(
            Math.random()<.5
          ){

            a.v+=
              randomRange(
                -1.2,
                1.2
              );

          }else{

            b.v+=
              randomRange(
                -1.2,
                1.2
              );
          }
        }
      }

      const push=
        (minDist-dist)*.55;

      a.s-=
        nx*push;

      a.lane-=
        ny*push;

      b.s+=
        nx*push;

      b.lane+=
        ny*push;

      a.v=
        clamp(
          a.v,
          MIN_SPEED,
          MAX_SPEED*
          a.speedMul
        );

      b.v=
        clamp(
          b.v,
          MIN_SPEED,
          MAX_SPEED*
          b.speedMul
        );
    }
  }
}

/* =========================================================
   DRAFTING
========================================================= */

function getDraftBoost(m){

  let boost=0;

  for(
    const other of marble
  ){

    if(
      other===m||
      other.finished
    )
      continue;

    const ds=
      other.s-m.s;

    /*
      Only draft from someone directly ahead.
    */
    if(
      ds>3&&
      ds<38
    ){

      const laneGap=
        Math.abs(
          other.lane-
          m.lane
        );

      if(
        laneGap<22
      ){

        const distanceFactor=
          1-
          ds/38;

        const laneFactor=
          1-
          laneGap/22;

        boost+=
          .65*
          distanceFactor*
          laneFactor;
      }
    }
  }

  return clamp(
    boost,
    0,
    1.2
  );
}

/* =========================================================
   OVERTAKING / LANE CHANGES
========================================================= */

function updateRacingLine(
  m,
  dt
){

  m.laneChangeTimer-=dt;

  /*
    Look for racers directly ahead.
  */
  let blocker=null;
  let closest=9999;

  for(
    const other of marble
  ){

    if(
      other===m||
      other.finished
    )
      continue;

    const ds=
      other.s-m.s;

    const lateral=
      Math.abs(
        other.lane-
        m.lane
      );

    if(
      ds>1&&
      ds<34&&
      lateral<13&&
      ds<closest
    ){

      closest=ds;
      blocker=other;
    }
  }

  /*
    Decide on a new lane.
  */
  if(
    m.laneChangeTimer<=0
  ){

    let target=
      m.lane;

    if(blocker){

      /*
        Try one side or the other.
      */
      const preferred=
        Math.random()<.5
          ?-1
          :1;

      target=
        blocker.lane+
        preferred*
        randomRange(
          16,
          29
        );

      /*
        If that side is occupied, try opposite.
      */
      for(
        const other of marble
      ){

        if(
          other===m||
          other===blocker||
          other.finished
        )
          continue;

        if(
          Math.abs(
            other.s-
            m.s
          )<28&&
          Math.abs(
            other.lane-
            target
          )<13
        ){

          target=
            blocker.lane-
            preferred*
            randomRange(
              16,
              29
            );

          break;
        }
      }

    }else{

      /*
        Normal racing line.
        Random movement increases the chance
        of overtakes without looking ridiculous.
      */
      if(
        Math.random()<
        .36*m.chaos
      ){

        target=
          randomRange(
            -35,
            35
          );
      }
    }

    /*
      Never intentionally aim outside the walls.
    */
    m.desiredLane=
      clamp(
        target,
        -38,
        38
      );

    m.laneChangeTimer=
      randomRange(
        .7,
        1.8
      )/
      m.chaos;
  }

  const laneDifference=
    m.desiredLane-
    m.lane;

  /*
    Steering strength.
  */
  m.laneV+=
    clamp(
      laneDifference*
      .9,
      -15,
      15
    )*
    dt;

  /*
    Chaos produces slightly more aggressive
    lateral movement.
  */
  m.laneV+=
    Math.sin(
      raceTime*
      m.rhythm+
      m.rhythmPhase
    )*
    .08*
    m.chaos*
    dt;
}

/* =========================================================
   MARBLE UPDATE
========================================================= */

function updateMarble(
  m,
  dt
){

  if(m.finished)
    return;

  /*
    Temporary performance variation.

    This is deliberately smooth rather than
    pure frame-to-frame randomness.
  */
  const raceWave=
    Math.sin(
      raceTime*
      m.rhythm+
      m.rhythmPhase
    )*
    m.variance;

  const randomWave=
    Math.sin(
      raceTime*.47+
      m.randomSeed
    )*
    m.variance*.65;

  let performance=
    1+
    raceWave+
    randomWave;

  /*
    Temporary collision boost.
  */
  if(
    m.boostTimer>0
  ){

    m.boostTimer-=dt;

    performance+=
      m.boostPower;
  }

  /*
    Drafting.
  */
  const draft=
    getDraftBoost(m);

  performance+=
    draft*.018;

  const effectiveMax=
    MAX_SPEED*
    m.speedMul*
    performance;

  const speedRatio=
    clamp(
      m.v/effectiveMax,
      0,
      1.2
    );

  /*
    Acceleration.
  */
  const acceleration=
    BASE_ACCEL*
    m.accelMul*
    performance*
    (
      1-
      speedRatio*.60
    );

  m.v+=
    acceleration*
    dt;

  /*
    Draft gives an actual push.
  */
  if(draft>0){

    m.v+=
      draft*
      .85*
      dt;
  }

  m.v-=
    m.v*
    ROLLING_DRAG*
    dt;

  m.v-=
    m.v*
    m.v*
    AIR_DRAG*
    dt;

  /*
    Corner detection.

    Sample farther ahead so tighter corners have
    a visible effect.
  */
  const ahead=
    trackFrame(
      m.s+24
    );

  const here=
    trackFrame(
      m.s
    );

  const dot=
    ahead.t.x*
    here.t.x+
    ahead.t.y*
    here.t.y;

  const cornerAmount=
    Math.max(
      0,
      1-dot
    );

  /*
    Racer-specific corner skill.
  */
  m.v-=
    m.v*
    cornerAmount*
    CORNER_DRAG*
    dt/
    m.cornerMul;

  /*
    Occasional small momentum variation.
  */
  m.v+=
    Math.sin(
      raceTime*.73+
      m.randomSeed
    )*
    .018*
    dt;

  m.v=
    clamp(
      m.v,
      MIN_SPEED,
      effectiveMax
    );

  /*
    Overtaking behavior.
  */
  updateRacingLine(
    m,
    dt
  );

  /*
    Lateral physics.
  */
  m.laneV*=
    Math.pow(
      .34,
      dt
    );

  /*
    Keep steering responsive.
  */
  m.laneV+=
    (
      -m.lane*
      .055*
      m.grip+
      (
        m.desiredLane-
        m.lane
      )*
      .24*
      m.chaos
    )*
    dt;

  m.lane+=
    m.laneV*
    dt;

  /*
    Forward movement.
  */
  const oldS=
    m.s;

  m.s+=
    m.v*
    dt;

  /*
    Physical rolling rotation.
  */
  const distance=
    m.s-oldS;

  m.spin+=
    distance/
    m.radius;

  m.lastS=
    m.s;

  /*
    Keep recent speed for rendering.
  */
  m.recentSpeed=
    lerp(
      m.recentSpeed,
      m.v,
      clamp(
        dt*8,
        0,
        1
      )
    );

  resolveWall(m);

  for(
    const o of obstacles
  ){

    resolveObstacle(
      m,
      o
    );
  }

  resolveWall(m);

  m.v=
    clamp(
      m.v,
      MIN_SPEED,
      MAX_SPEED*
      m.speedMul*
      1.08
    );

  m.hitFlash=
    Math.max(
      0,
      m.hitFlash-dt
    );

  /*
    Finish.
  */
  if(
    m.s>=TRACK_LENGTH
  ){

    m.finished=true;

    m.finishTime=
      raceTime;

    m.place=
      marble.filter(
        x=>x.finished
      ).length;

    m.s=
      TRACK_LENGTH;

    m.v=0;
  }
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(
    !raceRunning||
    paused||
    raceFinished||
    countdownActive
  )
    return;

  raceTime+=dt;

  for(
    const m of marble
  ){

    updateMarble(
      m,
      dt
    );
  }

  resolveMarbleCollisions();

  if(
    marble.every(
      m=>m.finished
    )
  ){

    finishRace();
  }
}

   CAMERAS
========================================================= */

function getFirstPersonCamera(){

  const me=
    marble[selected];

  const frame=
    trackFrame(me.s);

  const pos=
    marbleWorldPosition(me);

  return{

    x:
      pos.x-
      frame.t.x*5,

    y:
      pos.y-
      frame.t.y*5,

    angle:
      Math.atan2(
        frame.t.y,
        frame.t.x
      ),

    height:25
  };
}

function getSpectatorCamera(){

  const me=
    marble[selected];

  const frame=
    trackFrame(me.s);

  const pos=
    marbleWorldPosition(me);

  const behind=125;
  const side=12;
  const height=150;
  const lookAhead=175;

  return{

    x:
      pos.x-
      frame.t.x*behind+
      frame.n.x*side,

    y:
      pos.y-
      frame.t.y*behind+
      frame.n.y*side,

    lookX:
      pos.x+
      frame.t.x*lookAhead,

    lookY:
      pos.y+
      frame.t.y*lookAhead,

    height,

    pitch:.96
  };
}

/* =========================================================
   PROJECTION
========================================================= */

function project3D(
  x,
  y,
  cameraX,
  cameraY,
  lookX,
  lookY,
  cameraHeight
){

  const dx=
    x-cameraX;

  const dy=
    y-cameraY;

  let fx=
    lookX-cameraX;

  let fy=
    lookY-cameraY;

  const len=
    Math.hypot(
      fx,
      fy
    )||1;

  fx/=len;
  fy/=len;

  const rightX=-fy;
  const rightY=fx;

  const depth=
    dx*fx+
    dy*fy;

  const side=
    dx*rightX+
    dy*rightY;

  if(depth<-10)
    return null;

  const focal=
    Math.min(W,H)*.92;

  const scale=
    focal/
    (depth+cameraHeight);

  const horizon=
    H*.12;

  const groundY=
    horizon+
    cameraHeight*
    scale;

  return{

    x:
      W/2+
      side*
      scale,

    y:
      groundY,

    scale,
    depth
  };
}

function projectSpectator3D(
  x,
  y,
  z,
  camera
){

  const dx=
    x-camera.x;

  const dy=
    y-camera.y;

  let fx=
    camera.lookX-
    camera.x;

  let fy=
    camera.lookY-
    camera.y;

  const len=
    Math.hypot(
      fx,
      fy
    )||1;

  fx/=len;
  fy/=len;

  const rightX=-fy;
  const rightY=fx;

  const horizontalDepth=
    dx*fx+
    dy*fy;

  const side=
    dx*rightX+
    dy*rightY;

  const vertical=
    z-camera.height;

  const pitch=
    camera.pitch;

  const depth=
    horizontalDepth*
    Math.cos(pitch)-
    vertical*
    Math.sin(pitch);

  if(depth<5)
    return null;

  const cameraVertical=
    horizontalDepth*
    Math.sin(pitch)+
    vertical*
    Math.cos(pitch);

  const focal=
    Math.min(W,H)*
    1.18;

  const scale=
    focal/depth;

  return{

    x:
      W/2+
      side*
      scale,

    y:
      H*.50-
      cameraVertical*
      scale,

    scale,
    depth
  };
}

/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  g.addColorStop(
    0,
    "#070a12"
  );

  g.addColorStop(
    .42,
    "#101727"
  );

  g.addColorStop(
    1,
    "#05070b"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  ctx.save();

  ctx.globalAlpha=.35;

  for(
    let i=0;
    i<100;
    i++
  ){

    const x=
      (i*137.7)%W;

    const y=
      (i*71.3)%(H*.45);

    ctx.fillStyle="#fff";

    ctx.fillRect(
      x,
      y,
      1,
      1
    );
  }

  ctx.restore();
}

/* =========================================================
   MARBLE DRAW
========================================================= */

function drawRollingMarble(
  x,
  y,
  r,
  color,
  spin,
  selectedMarble=false,
  motionAngle=0,
  speed=20
){

  if(r<.45)
    return;

  ctx.save();

  const speedFactor=
    clamp(
      speed/MAX_SPEED,
      0,
      1
    );

  /*
    Shadow.
  */
  const shadow=
    ctx.createRadialGradient(
      x,
      y+r*.72,
      0,
      x,
      y+r*.72,
      r*1.65
    );

  shadow.addColorStop(
    0,
    "rgba(0,0,0,.78)"
  );

  shadow.addColorStop(
    .45,
    "rgba(0,0,0,.35)"
  );

  shadow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=shadow;

  ctx.beginPath();

  ctx.ellipse(
    x,
    y+r*.70,
    r*1.28,
    r*.60,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Slight speed stretch.
  */
  const stretch=
    1+
    speedFactor*.045;

  /*
    Spherical base.
  */
  const g=
    ctx.createRadialGradient(
      x-r*.40,
      y-r*.46,
      r*.03,
      x,
      y,
      r*1.05
    );

  g.addColorStop(
    0,
    "#fff"
  );

  g.addColorStop(
    .11,
    "#fff"
  );

  g.addColorStop(
    .22,
    color
  );

  g.addColorStop(
    .68,
    color
  );

  g.addColorStop(
    .88,
    "#111"
  );

  g.addColorStop(
    1,
    "#020202"
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.ellipse(
    x,
    y,
    r*stretch,
    r,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Clip texture to sphere.
  */
  ctx.save();

  ctx.beginPath();

  ctx.ellipse(
    x,
    y,
    r*stretch,
    r,
    0,
    0,
    Math.PI*2
  );

  ctx.clip();

  ctx.translate(
    x,
    y
  );

  /*
    Real rolling spin.
  */
  ctx.rotate(spin);

  /*
    Main white equator.
  */
  ctx.strokeStyle=
    "rgba(255,255,255,.95)";

  ctx.lineWidth=
    Math.max(
      1.3,
      r*.16
    );

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    r*.98,
    r*.30,
    0,
    0,
    Math.PI*2
  );

  ctx.stroke();

  /*
    Second band.
  */
  ctx.rotate(
    Math.PI*.37
  );

  ctx.strokeStyle=
    "rgba(255,255,255,.62)";

  ctx.lineWidth=
    Math.max(
      1,
      r*.105
    );

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    r*.91,
    r*.16,
    0,
    0,
    Math.PI*2
  );

  ctx.stroke();

  /*
    Dark stripe.
  */
  ctx.rotate(
    Math.PI*.43
  );

  ctx.strokeStyle=
    "rgba(0,0,0,.62)";

  ctx.lineWidth=
    Math.max(
      1,
      r*.13
    );

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    r*.86,
    r*.20,
    0,
    0,
    Math.PI*2
  );

  ctx.stroke();

  /*
    Curved longitude lines.
  */
  for(
    let i=-2;
    i<=2;
    i++
  ){

    const phase=
      spin+
      i*.85;

    const width=
      Math.abs(
        Math.cos(phase)
      )*.72+
      .12;

    ctx.strokeStyle=
      i%2===0
        ?"rgba(255,255,255,.48)"
        :"rgba(0,0,0,.30)";

    ctx.lineWidth=
      Math.max(
        .7,
        r*.065
      );

    ctx.beginPath();

    ctx.ellipse(
      Math.sin(phase)*
      r*.32,
      0,
      r*width*.38,
      r*.96,
      0,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }

  /*
    Rotating colored patch.
  */
  const patchAngle=
    spin*1.35;

  const px=
    Math.cos(
      patchAngle
    )*
    r*.52;

  const py=
    Math.sin(
      patchAngle
    )*
    r*.52;

  const patch=
    ctx.createRadialGradient(
      px,
      py,
      0,
      px,
      py,
      r*.38
    );

  patch.addColorStop(
    0,
    "rgba(255,255,255,.65)"
  );

  patch.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=patch;

  ctx.beginPath();

  ctx.arc(
    px,
    py,
    r*.38,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  /*
    Moving highlight.
  */
  const hx=
    x+
    Math.cos(
      spin*1.25
    )*
    r*.43;

  const hy=
    y+
    Math.sin(
      spin*1.25
    )*
    r*.36;

  const highlight=
    ctx.createRadialGradient(
      hx,
      hy,
      0,
      hx,
      hy,
      r*.22
    );

  highlight.addColorStop(
    0,
    "rgba(255,255,255,.98)"
  );

  highlight.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=
    highlight;

  ctx.beginPath();

  ctx.arc(
    hx,
    hy,
    r*.24,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    Motion trail.
  */
  const trail=
    clamp(
      r*
      (
        .65+
        speedFactor*3.2
      ),
      2,
      34
    );

  const backAngle=
    motionAngle+
    Math.PI;

  const tx=
    x+
    Math.cos(backAngle)*
    r*.72;

  const ty=
    y+
    Math.sin(backAngle)*
    r*.72;

  const trailGrad=
    ctx.createLinearGradient(
      tx,
      ty,
      tx+
        Math.cos(backAngle)*
        trail,
      ty+
        Math.sin(backAngle)*
        trail
    );

  trailGrad.addColorStop(
    0,
    "rgba(255,255,255,.55)"
  );

  trailGrad.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.strokeStyle=
    trailGrad;

  ctx.lineWidth=
    Math.max(
      1,
      r*.10
    );

  ctx.beginPath();

  ctx.moveTo(
    tx,
    ty
  );

  ctx.lineTo(
    tx+
      Math.cos(backAngle)*
      trail,
    ty+
      Math.sin(backAngle)*
      trail
  );

  ctx.stroke();

  /*
    Selection ring.
  */
  if(selectedMarble){

    ctx.strokeStyle="#fff";

    ctx.lineWidth=
      Math.max(
        2,
        r*.11
      );

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      r*1.25,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }

  ctx.restore();
}

   LABEL

function drawNameLabel(
  m,
  x,
  y,
  radius,
  selectedLabel=false
){

  const size=
    clamp(
      radius*1.35,
      11,
      25
    );

  ctx.save();

  ctx.font=
    `900 ${size}px Arial`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  const textWidth=
    ctx.measureText(
      m.name
    ).width;

  const padX=7;
  const padY=4;

  const boxX=
    x-
    textWidth/2-
    padX;

  const boxY=
    y-
    radius-
    size-
    8-
    padY;

  const boxW=
    textWidth+
    padX*2;

  const boxH=
    size+
    padY*2;

  ctx.fillStyle=
    "rgba(0,0,0,.88)";

  ctx.beginPath();

  ctx.roundRect(
    boxX,
    boxY,
    boxW,
    boxH,
    6
  );

  ctx.fill();

  if(selectedLabel){

    ctx.strokeStyle=
      m.color;

    ctx.lineWidth=2;

    ctx.stroke();
  }

  ctx.fillStyle="#fff";

  ctx.fillText(
    m.name,
    x,
    boxY+
    boxH/2
  );

  ctx.restore();
}

/* =========================================================
   FIRST PERSON TRACK
========================================================= */

function drawFirstPersonTrack(
  camera
){

  const me=
    marble[selected];

  const sections=[];

  for(
    let ds=-20;
    ds<=460;
    ds+=5
  ){

    const s=
      clamp(
        me.s+ds,
        0,
        TRACK_LENGTH-1
      );

    const frame=
      trackFrame(s);

    const left={
      x:
        frame.p.x-
        frame.n.x*
        ROAD_HALF,

      y:
        frame.p.y-
        frame.n.y*
        ROAD_HALF
    };

    const right={
      x:
        frame.p.x+
        frame.n.x*
        ROAD_HALF,

      y:
        frame.p.y+
        frame.n.y*
        ROAD_HALF
    };

    const lookX=
      camera.x+
      Math.cos(
        camera.angle
      )*100;

    const lookY=
      camera.y+
      Math.sin(
        camera.angle
      )*100;

    const lp=
      project3D(
        left.x,
        left.y,
        camera.x,
        camera.y,
        lookX,
        lookY,
        camera.height
      );

    const rp=
      project3D(
        right.x,
        right.y,
        camera.x,
        camera.y,
        lookX,
        lookY,
        camera.height
      );

    const cp=
      project3D(
        frame.p.x,
        frame.p.y,
        camera.x,
        camera.y,
        lookX,
        lookY,
        camera.height
      );

    if(
      lp&&
      rp&&
      cp
    ){

      sections.push({
        lp,
        rp,
        cp,
        s
      });
    }
  }

  sections.sort(
    (a,b)=>
      b.cp.depth-
      a.cp.depth
  );

  for(
    let i=0;
    i<sections.length-1;
    i++
  ){

    const a=
      sections[i];

    const b=
      sections[i+1];

    ctx.beginPath();

    ctx.moveTo(
      a.lp.x,
      a.lp.y
    );

    ctx.lineTo(
      a.rp.x,
      a.rp.y
    );

    ctx.lineTo(
      b.rp.x,
      b.rp.y
    );

    ctx.lineTo(
      b.lp.x,
      b.lp.y
    );

    ctx.closePath();

    ctx.fillStyle=
      Math.floor(
        a.s/18
      )%2===0
        ?" #252b34".trim()
        :"#20262d";

    ctx.fill();
  }

  for(
    const side of[-1,1]
  ){

    ctx.beginPath();

    let started=false;

    for(
      const section of sections
    ){

      const p=
        side<0
          ?section.lp
          :section.rp;

      if(!started){

        ctx.moveTo(
          p.x,
          p.y
        );

        started=true;

      }else{

        ctx.lineTo(
          p.x,
          p.y
        );
      }
    }

    ctx.strokeStyle=
      "#e7edf3";

    ctx.lineWidth=3;

    ctx.stroke();
  }
}

/* =========================================================
   FIRST PERSON MARBLES
========================================================= */

function drawFirstPersonMarbles(
  camera
){

  const me=
    marble[selected];

  const visible=[];

  /*
    Selected marble deliberately excluded.
  */
  for(
    const m of marble
  ){

    if(
      m.id===selected||
      m.finished
    )
      continue;

    const relative=
      m.s-me.s;

    if(
      relative<-40||
      relative>450
    )
      continue;

    const pos=
      marbleWorldPosition(m);

    const lookX=
      camera.x+
      Math.cos(
        camera.angle
      )*100;

    const lookY=
      camera.y+
      Math.sin(
        camera.angle
      )*100;

    const p=
      project3D(
        pos.x,
        pos.y,
        camera.x,
        camera.y,
        lookX,
        lookY,
        camera.height
      );

    if(p){

      visible.push({
        m,
        p
      });
    }
  }

  visible.sort(
    (a,b)=>
      b.p.depth-
      a.p.depth
  );

  for(
    const item of visible
  ){

    const m=
      item.m;

    const p=
      item.p;

    const r=
      clamp(
        m.radius*
        p.scale*
        1.18,
        2.5,
        80
      );

    const frame=
      trackFrame(m.s);

    const angle=
      Math.atan2(
        frame.t.y,
        frame.t.x
      );

    drawRollingMarble(
      p.x,
      p.y,
      r,
      m.color,
      m.spin,
      false,
      angle,
      m.v
    );

    drawNameLabel(
      m,
      p.x,
      p.y,
      r,
      false
    );
  }
}

/* =========================================================
   FIRST PERSON OBSTACLES
========================================================= */

function drawFirstPersonObstacles(
  camera
){

  const me=
    marble[selected];

  for(
    const o of obstacles
  ){

    const relative=
      o.s-me.s;

    if(
      relative<-30||
      relative>460
    )
      continue;

    const frame=
      trackFrame(o.s);

    const pos={
      x:
        frame.p.x+
        frame.n.x*
        o.lane,

      y:
        frame.p.y+
        frame.n.y*
        o.lane
    };

    const lookX=
      camera.x+
      Math.cos(
        camera.angle
      )*100;

    const lookY=
      camera.y+
      Math.sin(
        camera.angle
      )*100;

    const p=
      project3D(
        pos.x,
        pos.y,
        camera.x,
        camera.y,
        lookX,
        lookY,
        camera.height
      );

    if(!p)
      continue;

    const r=
      Math.max(
        2,
        o.radius*
        p.scale
      );

    ctx.fillStyle=
      o.type==="bumper"
        ?" #e67e22".trim()
        :"#777";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=1.5;
    ctx.stroke();
  }
}

/* =========================================================
   SPECTATOR VIEW
========================================================= */

function drawSpectatorView(){

  const camera=
    getSpectatorCamera();

  const sky=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  sky.addColorStop(
    0,
    "#111b31"
  );

  sky.addColorStop(
    .38,
    "#1b2940"
  );

  sky.addColorStop(
    1,
    "#070a0f"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  const me=
    marble[selected];

  const sections=[];

  const start=
    clamp(
      me.s-160,
      0,
      TRACK_LENGTH-1
    );

  const end=
    clamp(
      me.s+600,
      0,
      TRACK_LENGTH-1
    );

  for(
    let s=start;
    s<=end;
    s+=4
  ){

    const frame=
      trackFrame(s);

    const left={
      x:
        frame.p.x-
        frame.n.x*
        ROAD_HALF,

      y:
        frame.p.y-
        frame.n.y*
        ROAD_HALF
    };

    const right={
      x:
        frame.p.x+
        frame.n.x*
        ROAD_HALF,

      y:
        frame.p.y+
        frame.n.y*
        ROAD_HALF
    };

    const center=
      projectSpectator3D(
        frame.p.x,
        frame.p.y,
        0,
        camera
      );

    const lp=
      projectSpectator3D(
        left.x,
        left.y,
        0,
        camera
      );

    const rp=
      projectSpectator3D(
        right.x,
        right.y,
        0,
        camera
      );

    if(
      center&&
      lp&&
      rp
    ){

      sections.push({
        center,
        lp,
        rp,
        s
      });
    }
  }

  sections.sort(
    (a,b)=>
      b.center.depth-
      a.center.depth
  );

  /*
    Road.
  */
  for(
    let i=0;
    i<sections.length-1;
    i++
  ){

    const a=
      sections[i];

    const b=
      sections[i+1];

    ctx.beginPath();

    ctx.moveTo(
      a.lp.x,
      a.lp.y
    );

    ctx.lineTo(
      a.rp.x,
      a.rp.y
    );

    ctx.lineTo(
      b.rp.x,
      b.rp.y
    );

    ctx.lineTo(
      b.lp.x,
      b.lp.y
    );

    ctx.closePath();

    ctx.fillStyle=
      Math.floor(
        a.s/20
      )%2===0
        ?" #303741".trim()
        :"#252b34";

    ctx.fill();
  }

  /*
    Road edges.
  */
  for(
    const side of[-1,1]
  ){

    ctx.beginPath();

    let first=true;

    for(
      const section of sections
    ){

      const p=
        side<0
          ?section.lp
          :section.rp;

      if(first){

        ctx.moveTo(
          p.x,
          p.y
        );

        first=false;

      }else{

        ctx.lineTo(
          p.x,
          p.y
        );
      }
    }

    ctx.strokeStyle=
      "#f4f7fa";

    ctx.lineWidth=4;

    ctx.globalAlpha=.96;

    ctx.stroke();

    ctx.globalAlpha=1;
  }

  /*
    Center markings.
  */
  for(
    let i=0;
    i<sections.length-1;
    i+=5
  ){

    const a=
      sections[i];

    const b=
      sections[
        Math.min(
          i+1,
          sections.length-1
        )
      ];

    ctx.strokeStyle=
      "rgba(255,255,255,.16)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      a.center.x,
      a.center.y
    );

    ctx.lineTo(
      b.center.x,
      b.center.y
    );

    ctx.stroke();
  }

  /*
    Obstacles.
  */
  const visibleObstacles=[];

  for(
    const o of obstacles
  ){

    if(
      o.s<start||
      o.s>end
    )
      continue;

    const frame=
      trackFrame(o.s);

    const pos={
      x:
        frame.p.x+
        frame.n.x*
        o.lane,

      y:
        frame.p.y+
        frame.n.y*
        o.lane
    };

    const p=
      projectSpectator3D(
        pos.x,
        pos.y,
        o.radius,
        camera
      );

    if(p){

      visibleObstacles.push({
        o,
        p
      });
    }
  }

  visibleObstacles.sort(
    (a,b)=>
      b.p.depth-
      a.p.depth
  );

  for(
    const item of
    visibleObstacles
  ){

    const o=
      item.o;

    const p=
      item.p;

    const r=
      clamp(
        o.radius*
        p.scale*
        1.2,
        2,
        42
      );

    ctx.save();

    if(
      o.type==="bumper"
    ){

      const g=
        ctx.createRadialGradient(
          p.x-r*.35,
          p.y-r*.35,
          r*.05,
          p.x,
          p.y,
          r
        );

      g.addColorStop(
        0,
        "#fff"
      );

      g.addColorStop(
        .25,
        "#ffd166"
      );

      g.addColorStop(
        1,
        "#d35400"
      );

      ctx.fillStyle=g;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        r,
        0,
        Math.PI*2
      );

      ctx.fill();

    }else{

      ctx.fillStyle="#777";

      ctx.fillRect(
        p.x-r,
        p.y-r,
        r*2,
        r*2
      );
    }

    ctx.strokeStyle="#fff";
    ctx.lineWidth=1.5;
    ctx.stroke();

    ctx.restore();
  }

  /*
    Marbles.
    Each appears exactly once.
  */
  const visibleMarbles=[];

  for(
    const m of marble
  ){

    if(m.finished)
      continue;

    if(
      m.s<start-20||
      m.s>end+20
    )
      continue;

    const pos=
      marbleWorldPosition(m);

    const p=
      projectSpectator3D(
        pos.x,
        pos.y,
        m.radius,
        camera
      );

    if(p){

      visibleMarbles.push({
        m,
        p
      });
    }
  }

  visibleMarbles.sort(
    (a,b)=>
      b.p.depth-
      a.p.depth
  );

  for(
    const item of visibleMarbles
  ){

    const m=
      item.m;

    const p=
      item.p;

    const r=
      clamp(
        m.radius*
        p.scale*
        1.5,
        3,
        70
      );

    const frame=
      trackFrame(m.s);

    const motionAngle=
      Math.atan2(
        frame.t.y,
        frame.t.x
      );

    drawRollingMarble(
      p.x,
      p.y,
      r,
      m.color,
      m.spin,
      m.id===selected,
      motionAngle,
      m.v
    );

    drawNameLabel(
      m,
      p.x,
      p.y,
      r,
      m.id===selected
    );
  }

  /*
    Spectator header.
  */
  const following=
    marble[selected];

  ctx.save();

  ctx.font=
    "900 15px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  const title=
    `SPECTATOR • FOLLOWING ${following.name}`;

  const tw=
    ctx.measureText(
      title
    ).width;

  ctx.fillStyle=
    "rgba(0,0,0,.72)";

  ctx.beginPath();

  ctx.roundRect(
    W/2-tw/2-15,
    18,
    tw+30,
    34,
    9
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.fillText(
    title,
    W/2,
    35
  );

  ctx.restore();

  /*
    Speed bar.
  */
  const speed=
    following.v;

  const speedPercent=
    clamp(
      speed/MAX_SPEED,
      0,
      1
    );

  ctx.save();

  const barW=220;

  const barX=
    W/2-barW/2;

  const barY=
    H-32;

  ctx.fillStyle=
    "rgba(0,0,0,.65)";

  ctx.beginPath();

  ctx.roundRect(
    barX-8,
    barY-6,
    barW+16,
    20,
    7
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.fillRect(
    barX,
    barY,
    barW*
    speedPercent,
    8
  );

  ctx.font=
    "bold 11px Arial";

  ctx.textAlign="center";

  ctx.fillStyle="#fff";

  ctx.fillText(
    `SPEED ${speed.toFixed(1)}`,
    W/2,
    barY-9
  );

  ctx.restore();
}

/* =========================================================
   SCENE
========================================================= */

function drawScene(){

  drawBackground();

  if(!raceRunning)
    return;

  if(
    cameraMode==="spectator"
  ){

    drawSpectatorView();

    return;
  }

  const camera=
    getFirstPersonCamera();

  drawFirstPersonTrack(
    camera
  );

  drawFirstPersonObstacles(
    camera
  );

  drawFirstPersonMarbles(
    camera
  );

  /*
    Speed lines.
  */
  const me=
    marble[selected];

  const speedRatio=
    clamp(
      me.v/MAX_SPEED,
      0,
      1
    );

  if(
    speedRatio>.45
  ){

    ctx.save();

    ctx.globalAlpha=
      speedRatio*.20;

    ctx.strokeStyle="#fff";
    ctx.lineWidth=1;

    for(
      let i=0;
      i<30;
      i++
    ){

      const x=
        (i*127)%W;

      const y=
        (i*67)%H;

      ctx.beginPath();

      ctx.moveTo(
        x,
        y
      );

      ctx.lineTo(
        W/2+
        (x-W/2)*.42,

        H/2+
        (y-H/2)*.42
      );

      ctx.stroke();
    }

    ctx.restore();
  }
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  if(!raceRunning)
    return;

  const me=
    marble[selected];

  /*
    Current race position.
  */
  const position=
    1+
    marble.filter(
      m=>
        m.s>me.s&&
        !m.finished
    ).length;

  const progress=
    clamp(
      me.s/TRACK_LENGTH,
      0,
      1
    )*100;

  hudLeft.innerHTML=
    `<b>${me.name}</b><br>`+
    `Position: ${position}/${marble.length}<br>`+
    `Speed: ${me.v.toFixed(1)}`;

  hudRight.innerHTML=
    `${tracks[
      Number(
        trackSelect.value
      )
    ]}<br>`+
    `${progress.toFixed(0)}% &nbsp; `+
    `${raceTime.toFixed(1)}s`;
}

/* =========================================================
   COUNTDOWN
========================================================= */

function runCountdown(){

  countdownActive=true;

  countdown.style.display=
    "flex";

  const sequence=[
    "3",
    "2",
    "1",
    "GO!"
  ];

  let i=0;

  function next(){

    if(
      i>=sequence.length
    ){

      countdown.style.display=
        "none";

      countdownActive=false;

      beep(
        880,
        .15
      );

      return;
    }

    countdown.textContent=
      sequence[i];

    beep(
      sequence[i]==="GO!"
        ?880
        :440+i*70,
      .1
    );

    i++;

    setTimeout(
      next,
      650
    );
  }

  next();
}

/* =========================================================
   BANK
========================================================= */

function updateBank(){

  bankDisplay.textContent=
    "$"+
    bank.toFixed(0);
}

/* =========================================================
   START RACE
========================================================= */

function startRace(){

  let requestedBet=
    Math.max(
      1,
      Number(
        betInput.value
      )||25
    );

  if(
    requestedBet>bank
  ){

    requestedBet=bank;
  }

  /*
    If bank is empty, don't start.
  */
  if(
    requestedBet<=0
  ){

    alert(
      "You need money to place a bet."
    );

    return;
  }

  currentBet=
    requestedBet;

  bank-=
    currentBet;

  updateBank();

  /*
    The selected marble is read fresh from
    the menu every time.
  */
  selected=
    Number(
      playerSelect.value
    );

  const seed=
    Number(
      trackSelect.value
    )+1+
    Math.floor(
      Math.random()*100000
    );

  track=
    generateTrack(seed);

  generateObstacles(seed);

  createMarbles();

  raceTime=0;

  raceRunning=true;
  paused=false;
  raceFinished=false;

  cameraMode="first";

  menu.style.display=
    "none";

  finish.style.display=
    "none";

  hud.style.display=
    "flex";

  lastTime=
    performance.now();

  runCountdown();
}

/* =========================================================
   RETURN TO MENU
========================================================= */

function returnToMenu(){

  /*
    The race has already settled its wager.
    Just return to the menu so the player can
    select a new marble.
  */
  raceRunning=false;

  raceFinished=false;

  paused=false;

  finish.style.display=
    "none";

  hud.style.display=
    "none";

  menu.style.display=
    "flex";

  /*
    Keep the currently selected marble highlighted
    in the dropdown.
  */
  playerSelect.value=
    String(selected);

  updateBank();
}

/* =========================================================
   SAME MARBLE
========================================================= */

function restartSameMarble(){

  /*
    Refund previous wager.
  */
  if(
    raceRunning||
    raceFinished
  ){

    bank+=
      currentBet;

    updateBank();
  }

  /*
    Preserve selected marble.
  */
  playerSelect.value=
    String(selected);

  startRace();
}

/* =========================================================
   FINISH
========================================================= */

function finishRace(){

  raceFinished=true;

  raceRunning=false;

  hud.style.display=
    "none";

  finish.style.display=
    "flex";

  const sorted=
    [...marble].sort(
      (a,b)=>{

        if(
          a.place&&
          b.place
        ){

          return(
            a.place-
            b.place
          );
        }

        return(
          b.s-a.s
        );
      }
    );

  const winner=
    sorted[0];

  let payout=0;

  if(
    winner.id===selected
  ){

    payout=
      currentBet*3;

    bank+=
      payout;

    finishTitle.textContent=
      `🏆 ${winner.name} wins!`;

  }else{

    finishTitle.textContent=
      `${winner.name} wins the race`;
  }

  updateBank();

  results.innerHTML="";

  sorted.forEach(
    (m,i)=>{

      const div=
        document.createElement(
          "div"
        );

      div.className="result";

      const place=
        i===0
          ?"🥇"
          :i===1
            ?"🥈"
            :i===2
              ?"🥉"
              :`${i+1}.`;

      div.innerHTML=
        `<span>${place} `+
        `<b style="color:${m.color}">`+
        `${m.name}`+
        `</b></span>`+
        `<span>${
          m.finishTime
            ?m.finishTime.toFixed(2)+"s"
            :""
        }</span>`;

      results.appendChild(
        div
      );
    }
  );

  if(
    payout>0
  ){

    const payoutDiv=
      document.createElement(
        "div"
      );

    payoutDiv.style.marginTop=
      "15px";

    payoutDiv.style.textAlign=
      "center";

    payoutDiv.style.color=
      "#67e8a5";

    payoutDiv.style.fontWeight=
      "bold";

    payoutDiv.textContent=
      `You won $${payout}!`;

    results.appendChild(
      payoutDiv
    );
  }

  /*
    Allow immediate selection of another marble
    by returning to the menu.
  */
  setTimeout(
    ()=>{
      /*
        Don't automatically return;
        user gets to inspect the results first.
      */
    },
    0
  );
}

/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startRace
  );

restartBtn.addEventListener(
  "click",
  restartSameMarble
);

newRaceBtn.addEventListener(
  "click",
  returnToMenu
);

/* =========================================================
   KEYBOARD
========================================================= */

addEventListener(
  "keydown",
  e=>{

    if(
      document.activeElement===
      betInput&&
      e.key!=="Escape"
    )
      return;

    /*
      Camera.
    */
    if(
      e.key.toLowerCase()==="v"
    ){

      if(!raceRunning)
        return;

      cameraMode=
        cameraMode==="first"
          ?"spectator"
          :"first";

      beep(
        620,
        .06
      );
    }

    /*
      Restart.
    */
    if(
      e.key.toLowerCase()==="r"
    ){

      if(
        raceRunning||
        raceFinished
      ){

        restartSameMarble();
      }
    }

    /*
      Mute.
    */
    if(
      e.key.toLowerCase()==="m"
    ){

      muted=!muted;

      beep(
        500,
        .05
      );
    }

    /*
      Pause.
    */
    if(
      e.code==="Space"
    ){

      e.preventDefault();

      if(
        raceRunning&&
        !countdownActive
      ){

        paused=!paused;
      }
    }

    /*
      Spectator selection.
    */
    if(
      e.key>="1"&&
      e.key<="8"
    ){

      const n=
        Number(e.key)-1;

      if(
        marble[n]
      ){

        selected=n;

        /*
          Keep menu selection synchronized too.
        */
        playerSelect.value=
          String(n);
      }
    }
  }
);

/* =========================================================
   MAIN LOOP
========================================================= */

function frame(now){

  let dt=
    (now-lastTime)/
    1000;

  lastTime=now;

  dt=
    clamp(
      dt,
      0,
      .035
    );

  update(dt);

  drawScene();

  updateHUD();

  requestAnimationFrame(
    frame
  );
}

updateBank();

requestAnimationFrame(
  frame
);

</script>
</body>
</html>
