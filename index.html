<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;

}

html, body {

canvas {

}

.panel {

}

h1 {
    margin: 0 0 5px;

}

.subtitle {
    color: #9aa4b2;
    margin-bottom: 22px;
}

.row {
    display: flex;
    gap: 12px;
    margin: 12px 0;
}

.row > div {
    flex: 1;
}

label {
    display: block;
    color: #aab4c2;
    font-size: 14px;
    margin-bottom: 5px;
}

select,
input,
button {
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 11px 13px;
    font: inherit;
}

select,
input {
    color: #fff;
    background: #171d28;
    outline: 1px solid rgba(255,255,255,.08);
}

button {
    cursor: pointer;
    font-weight: bold;
    background: #f1f3f5;
    color: #080a0d;
    transition: transform .12s, filter .12s;
}

button:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
}

#startBtn {
    margin-top: 16px;
    padding: 14px;
    font-size: 17px;
}

.money {
    padding: 11px 0;
    color: #67e8a5;
    font-weight: bold;
}

.controls {
    color: #8993a3;
    font-size: 12px;
    line-height: 1.7;
    margin-top: 14px;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    display: none;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
}

.hudBox {
    padding: 9px 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.12);
    text-shadow: 0 2px 4px #000;
    backdrop-filter: blur(5px);
}

#countdown {

    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: clamp(70px, 15vw, 180px);
    font-weight: 900;
    text-shadow: 0 8px 30px #000;
    z-index: 20;
    pointer-events: none;
}

#finish {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
}

.finishPanel {
    width: min(600px, calc(100vw - 30px));
    padding: 28px;
    border-radius: 18px;
    background: rgba(7,10,16,.96);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 25px 100px rgba(0,0,0,.75);
}

.finishPanel h2 {
    margin: 0 0 15px;
    font-size: 32px;
}

#results {
    margin: 15px 0;
}

.result {
    display: flex;
    justify-content: space-between;
    padding: 8px 10px;
    margin: 4px 0;
    border-radius: 7px;
    background: rgba(255,255,255,.05);
}
</style>

<body>

<canvas id="c"></canvas>

<div id="menu">

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1, 2);

function resize() {
    W = innerWidth;
    H = innerHeight;
    DPR = Math.min(devicePixelRatio || 1, 2);

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

addEventListener("resize", resize);
resize();


/* =========================================================
   GAME DATA
========================================================= */

const names = [
    "fetson",
    "doober",
    "fadgeril",
    "scrappy doo",
    "scubadaa",
    "pisswolf",
    "malty",
    "morning roll"
];

const colors = [
    "#e74c3c",
    "#3498db",
    "#f1c40f",
    "#9b59b6",
    "#1abc9c",
    "#f39c12",
    "#e67e22",
    "#ecf0f1"
];

const tracks = [
    "Neon Run",
    "Dust Devil",
    "Marble Mountain",
    "The Snake",
    "Turbo Tunnel",
    "Crystal Coast",
    "Red Canyon",
    "The Gauntlet",
    "Moon Rock",
    "Lava Loop",
    "Blue Thunder",
    "Pinball Ridge",
    "Green Machine",
    "The Spiral",
    "Sunset Sprint",
    "Chaos Valley",
    "Rocket Road",
    "Frostbite",
    "Thunder Alley",
    "Golden Mile",
    "Black Diamond",
    "Jungle Run",
    "Final Frenzy",
    "Mayhem Grand Prix"
];

const trackSelect = document.getElementById("trackSelect");
const playerSelect = document.getElementById("playerSelect");
const betInput = document.getElementById("betInput");
const bankDisplay = document.getElementById("bankDisplay");

const menu = document.getElementById("menu");
const hud = document.getElementById("hud");
const hudLeft = document.getElementById("hudLeft");
const hudRight = document.getElementById("hudRight");
const countdown = document.getElementById("countdown");

const finish = document.getElementById("finish");
const finishTitle = document.getElementById("finishTitle");
const results = document.getElementById("results");

tracks.forEach((name, i) => {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = name;
    trackSelect.appendChild(option);
});

names.forEach((name, i) => {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = name;
    playerSelect.appendChild(option);
});


/* =========================================================
   PHYSICS
========================================================= */

const TRACK_LENGTH = 960;

const ROAD_HALF = 52;
const MARBLE_RADIUS = 5;

const MAX_SPEED = 35.5;
const MIN_SPEED = 8;

const BASE_ACCEL = 13;

const ROLLING_DRAG = 0.004;
const AIR_DRAG = 0.00018;
const CORNER_DRAG = 0.0015;

const WALL_RESTITUTION = 0.975;
const WALL_FRICTION = 0.9995;

const MARBLE_RESTITUTION = 0.97;
const OBSTACLE_RESTITUTION = 0.97;


/* =========================================================
   STATE
========================================================= */

let track = [];
let obstacles = [];
let marble = [];

let selected = 0;
let cameraMode = "first";

let raceRunning = false;
let paused = false;
let raceFinished = false;
let countdownActive = false;

let raceTime = 0;
let lastTime = performance.now();

let bank = 100;
let currentBet = 25;

let muted = false;
let audioCtx = null;


/* =========================================================
   UTILITY
========================================================= */

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}


/* =========================================================
   AUDIO
========================================================= */

function beep(freq = 440, duration = .08, volume = .035) {
    if (muted) return;

    try {
        if (!audioCtx) {
            audioCtx = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.frequency.value = freq;
        osc.type = "sine";

        gain.gain.setValueAtTime(
            volume,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioCtx.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
}


/* =========================================================
   TRACK GENERATION
========================================================= */

function generateTrack(seed) {
    const points = [];
    const step = 4;

    let rng = (seed * 99991 + 17) >>> 0;

    function rand() {
        rng ^= rng << 13;
        rng ^= rng >>> 17;
        rng ^= rng << 5;
        return ((rng >>> 0) % 10000) / 10000;
    }

    let x = 0;
    let y = 0;
    let angle = 0;

    const waves = [
        {
            amp: .014 + rand() * .006,
            freq: .8 + rand() * .4,
            phase: rand() * 10
        },
        {
            amp: .009 + rand() * .005,
            freq: 1.7 + rand() * .7,
            phase: rand() * 10
        },
        {
            amp: .005 + rand() * .004,
            freq: 3.4 + rand() * 1.2,
            phase: rand() * 10
        }
    ];

    const count = Math.floor(TRACK_LENGTH / step);

    for (let i = 0; i < count; i++) {
        const s = i * step;
        const u = s / TRACK_LENGTH;

        let turn =
            Math.sin(
                u * Math.PI * 2 *
                waves[0].freq +
                waves[0].phase
            ) * waves[0].amp;

        turn +=
            Math.sin(
                u * Math.PI * 2 *
                waves[1].freq +
                waves[1].phase
            ) * waves[1].amp;

        turn +=
            Math.sin(
                u * Math.PI * 2 *
                waves[2].freq +
                waves[2].phase
            ) * waves[2].amp;

        turn +=
            Math.sin(
                u * Math.PI * 4 +
                seed
            ) * .004;

        angle += turn;

        x += Math.cos(angle) * step;
        y += Math.sin(angle) * step;

        points.push({
            x,
            y,
            angle
        });
    }

    for (let pass = 0; pass < 4; pass++) {
        for (let i = 0; i < points.length; i++) {
            const a =
                points[
                    (i - 1 + points.length) %
                    points.length
                ];

            const c =
                points[
                    (i + 1) %
                    points.length
                ];

            points[i].angle =
                Math.atan2(
                    c.y - a.y,
                    c.x - a.x
                );
        }
    }

    return points;
}

function sample(s) {
    s = clamp(s, 0, TRACK_LENGTH - .001);

    const step = 4;
    const f = s / step;
    const i = Math.floor(f);
    const t = f - i;

    const a = track[i];
    const b =
        track[
            Math.min(i + 1, track.length - 1)
        ];

    return {
        x: lerp(a.x, b.x, t),
        y: lerp(a.y, b.y, t)
    };
}

function tan(s) {
    s = clamp(s, 0, TRACK_LENGTH - .001);

    const step = 4;
    const f = s / step;
    const i = Math.floor(f);

    const a = track[Math.max(0, i)];
    const b =
        track[
            Math.min(
                track.length - 1,
                i + 1
            )
        ];

    let dx = b.x - a.x;
    let dy = b.y - a.y;

    const len = Math.hypot(dx, dy) || 1;

    return {
        x: dx / len,
        y: dy / len
    };
}

function trackFrame(s) {
    const p = sample(s);
    const t = tan(s);

    return {
        p,
        t,
        n: {
            x: -t.y,
            y: t.x
        }
    };
}


/* =========================================================
   MARBLE POSITION
========================================================= */

function marbleWorldPosition(m) {
    const frame = trackFrame(m.s);

    return {
        x:
            frame.p.x +
            frame.n.x * m.lane,

        y:
            frame.p.y +
            frame.n.y * m.lane
    };
}


/* =========================================================
   OBSTACLES
========================================================= */

function generateObstacles(seed) {
    obstacles = [];

    let rng = (seed * 7777 + 12345) >>> 0;

    function rand() {
        rng ^= rng << 13;
        rng ^= rng >>> 17;
        rng ^= rng << 5;
        return ((rng >>> 0) % 10000) / 10000;
    }

    let s = 90;

    while (s < TRACK_LENGTH - 50) {
        s += 90 + rand() * 90;

        if (s > TRACK_LENGTH - 45) {
            break;
        }

        obstacles.push({
            s,
            lane: (rand() * 2 - 1) * 30,
            radius: 6 + rand() * 3,
            type: rand() < .72
                ? "bumper"
                : "block"
        });
    }

    for (let i = 0; i < 4; i++) {
        obstacles.push({
            s:
                110 +
                i * 210 +
                rand() * 35,

            lane:
                (rand() * 2 - 1) * 10,

            radius: 7,
            type: "bumper"
        });
    }
}


/* =========================================================
   MARBLES
========================================================= */

function createMarbles() {
    marble = [];

    const stats = [
        { accel: 1.00, grip: 1.00, mass: 1.00 },
        { accel: 1.05, grip: .96, mass: 1.02 },
        { accel: .98, grip: 1.08, mass: .96 },
        { accel: 1.03, grip: .92, mass: 1.06 },
        { accel: 1.01, grip: 1.02, mass: 1.00 },
        { accel: 1.08, grip: .90, mass: .94 },
        { accel: .97, grip: 1.10, mass: 1.08 },
        { accel: 1.02, grip: .98, mass: 1.01 }
    ];

    for (let i = 0; i < names.length; i++) {
        marble.push({
            id: i,
            name: names[i],
            color: colors[i],

            s: -i * 5,

            v:
                16.5 +
                Math.random() * 2,

            lane:
                (i - 3.5) * 7.2,

            laneV: 0,

            radius: MARBLE_RADIUS,

            accelMul: stats[i].accel,
            grip: stats[i].grip,
            mass: stats[i].mass,

            finished: false,
            finishTime: 0,
            place: 0,

            hitFlash: 0,
            wobble: Math.random() * Math.PI * 2
        });
    }
}


/* =========================================================
   WALL COLLISION

   The wall is a side barrier only.

   Forward speed is preserved.
========================================================= */

function resolveWall(m) {
    const limit =
        ROAD_HALF -
        m.radius;

    if (m.lane > limit) {
        m.lane = limit;

        if (m.laneV > 0) {
            m.laneV =
                -m.laneV *
                WALL_RESTITUTION;
        }

        m.laneV *= WALL_FRICTION;

        m.v = Math.max(
            m.v * .9998,
            MIN_SPEED
        );
    }

    if (m.lane < -limit) {
        m.lane = -limit;

        if (m.laneV < 0) {
            m.laneV =
                -m.laneV *
                WALL_RESTITUTION;
        }

        m.laneV *= WALL_FRICTION;

        m.v = Math.max(
            m.v * .9998,
            MIN_SPEED
        );
    }
}


/* =========================================================
   OBSTACLE COLLISION
========================================================= */

function resolveObstacle(m, o) {
    const ds =
        Math.abs(o.s - m.s);

    if (ds > 12) return;

    const laneDistance =
        o.lane - m.lane;

    const minDist =
        o.radius +
        m.radius;

    if (
        Math.abs(laneDistance) <
        minDist
    ) {
        const sign =
            laneDistance >= 0
                ? -1
                : 1;

        const overlap =
            minDist -
            Math.abs(laneDistance);

        m.lane +=
            sign *
            (overlap + .15);

        m.laneV +=
            sign * 13;

        m.laneV *=
            OBSTACLE_RESTITUTION;

        m.v = Math.max(
            m.v * .999,
            MIN_SPEED
        );

        m.hitFlash = .12;
    }
}


/* =========================================================
   MARBLE COLLISIONS
========================================================= */

function resolveMarbleCollisions() {
    for (let i = 0; i < marble.length; i++) {
        const a = marble[i];

        if (a.finished) continue;

        for (
            let j = i + 1;
            j < marble.length;
            j++
        ) {
            const b = marble[j];

            if (b.finished) continue;

            let ds =
                b.s - a.s;

            if (
                ds >
                TRACK_LENGTH / 2
            ) {
                ds -= TRACK_LENGTH;
            }

            if (
                ds <
                -TRACK_LENGTH / 2
            ) {
                ds += TRACK_LENGTH;
            }

            const dl =
                b.lane -
                a.lane;

            const dist =
                Math.hypot(ds, dl);

            const minDist =
                a.radius +
                b.radius;

            if (
                dist >= minDist ||
                dist < .001
            ) {
                continue;
            }

            const nx = ds / dist;
            const ny = dl / dist;

            const relV =
                (b.v - a.v) * nx +
                (b.laneV - a.laneV) * ny;

            if (relV < 0) {
                const invA =
                    1 / a.mass;

                const invB =
                    1 / b.mass;

                const impulse =
                    -(1 +
                        MARBLE_RESTITUTION) *
                    relV /
                    (invA + invB);

                a.v -=
                    impulse *
                    invA *
                    nx;

                a.laneV -=
                    impulse *
                    invA *
                    ny;

                b.v +=
                    impulse *
                    invB *
                    nx;

                b.laneV +=
                    impulse *
                    invB *
                    ny;
            }

            const push =
                (minDist - dist) *
                .52;

            a.s -= nx * push;
            a.lane -= ny * push;

            b.s += nx * push;
            b.lane += ny * push;

            a.v = clamp(
                a.v,
                MIN_SPEED,
                MAX_SPEED
            );

            b.v = clamp(
                b.v,
                MIN_SPEED,
                MAX_SPEED
            );
        }
    }
}


/* =========================================================
   PHYSICS UPDATE
========================================================= */

function updateMarble(m, dt) {
    if (m.finished) return;

    const speedRatio =
        m.v / MAX_SPEED;

    const acceleration =
        BASE_ACCEL *
        m.accelMul *
        (1 -
            speedRatio * .72);

    m.v +=
        acceleration * dt;

    m.v -=
        m.v *
        ROLLING_DRAG *
        dt;

    m.v -=
        m.v *
        m.v *
        AIR_DRAG *
        dt;

    const frameAhead =
        trackFrame(
            m.s + 8
        );

    const frameHere =
        trackFrame(m.s);

    const dot =
        frameAhead.t.x *
        frameHere.t.x +
        frameAhead.t.y *
        frameHere.t.y;

    const cornerAmount =
        Math.max(
            0,
            1 - dot
        );

    m.v -=
        m.v *
        cornerAmount *
        CORNER_DRAG *
        dt;

    m.v = clamp(
        m.v,
        MIN_SPEED,
        MAX_SPEED
    );

    m.laneV *=
        Math.pow(.35, dt);

    m.laneV +=
        (-m.lane *
            .075 *
            m.grip) *
        dt;

    m.laneV +=
        Math.sin(
            raceTime * 2.2 +
            m.wobble
        ) *
        .06 *
        dt;

    m.lane +=
        m.laneV * dt;

    m.s +=
        m.v * dt;

    resolveWall(m);

    for (const o of obstacles) {
        resolveObstacle(m, o);
    }

    resolveWall(m);

    m.v = clamp(
        m.v,
        MIN_SPEED,
        MAX_SPEED
    );

    m.hitFlash =
        Math.max(
            0,
            m.hitFlash - dt
        );

    if (
        m.s >=
        TRACK_LENGTH
    ) {
        m.finished = true;
        m.finishTime = raceTime;

        m.place =
            marble.filter(
                x => x.finished
            ).length;

        m.s = TRACK_LENGTH;
        m.v = 0;
    }
}

function update(dt) {
    if (
        !raceRunning ||
        paused ||
        raceFinished ||
        countdownActive
    ) {
        return;
    }

    raceTime += dt;

    for (const m of marble) {
        updateMarble(m, dt);
    }

    resolveMarbleCollisions();

    if (
        marble.every(
            m => m.finished
        )
    ) {
        finishRace();
    }
}


/* =========================================================
   3D PROJECTION
========================================================= */

function project3D(
    x,
    y,
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
) {
    const dx =
        x - cameraX;

    const dy =
        y - cameraY;

    const forwardX =
        Math.cos(cameraAngle);

    const forwardY =
        Math.sin(cameraAngle);

    const rightX =
        -Math.sin(cameraAngle);

    const rightY =
        Math.cos(cameraAngle);

    const depth =
        dx * forwardX +
        dy * forwardY;

    const side =
        dx * rightX +
        dy * rightY;

    if (depth < 1.2) {
        return null;
    }

    const focal =
        Math.min(W, H) *
        .90;

    const scale =
        focal /
        Math.max(
            8,
            depth + cameraHeight
        );

    const horizon =
        cameraHeight > 70
            ? H * .28
            : H * .38;

    const groundY =
        horizon +
        cameraHeight *
        scale;

    return {
        x:
            W / 2 +
            side * scale,

        y: groundY,

        scale,

        depth
    };
}


/* =========================================================
   NAME LABEL
========================================================= */

function drawNameLabel(
    m,
    x,
    y,
    radius,
    selectedLabel = false
) {
    const size =
        clamp(
            radius * 1.35,
            12,
            25
        );

    ctx.save();

    ctx.font =
        `900 ${size}px Arial`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const textWidth =
        ctx.measureText(
            m.name
        ).width;

    const padX = 7;
    const padY = 4;

    const boxX =
        x -
        textWidth / 2 -
        padX;

    const boxY =
        y -
        radius -
        size -
        8 -
        padY;

    const boxW =
        textWidth +
        padX * 2;

    const boxH =
        size +
        padY * 2;

    ctx.fillStyle =
        selectedLabel
            ? "rgba(0,0,0,.9)"
            : "rgba(0,0,0,.78)";

    ctx.beginPath();

    ctx.roundRect(
        boxX,
        boxY,
        boxW,
        boxH,
        6
    );

    ctx.fill();

    if (selectedLabel) {
        ctx.strokeStyle =
            m.color;

        ctx.lineWidth = 2;

        ctx.stroke();
    }

    ctx.lineWidth =
        Math.max(
            3,
            size * .28
        );

    ctx.strokeStyle =
        "rgba(0,0,0,.95)";

    ctx.strokeText(
        m.name,
        x,
        boxY +
        boxH / 2
    );

    ctx.fillStyle =
        "#fff";

    ctx.fillText(
        m.name,
        x,
        boxY +
        boxH / 2
    );

    ctx.restore();
}


/* =========================================================
   MARBLE RENDERING
========================================================= */

function draw3DMarble(
    x,
    y,
    r,
    color,
    selectedMarble = false
) {
    if (r < .5) return;

    ctx.save();

    const shadow =
        ctx.createRadialGradient(
            x,
            y + r * .65,
            0,
            x,
            y + r * .65,
            r * 1.35
        );

    shadow.addColorStop(
        0,
        "#000"
    );

    shadow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.globalAlpha = .35;
    ctx.fillStyle = shadow;

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + r * .65,
        r * 1.2,
        r * .65,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.globalAlpha = 1;

    const g =
        ctx.createRadialGradient(
            x - r * .35,
            y - r * .4,
            r * .1,
            x,
            y,
            r
        );

    g.addColorStop(
        0,
        "#fff"
    );

    g.addColorStop(
        .16,
        color
    );

    g.addColorStop(
        .82,
        color
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,.85)"
    );

    ctx.fillStyle = g;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI * 2
    );

    ctx.fill();

    if (selectedMarble) {
        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth =
            Math.max(
                2,
                r * .11
            );

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r * 1.15,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   TRACK RENDERING
========================================================= */

function drawWorldTrack(
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
) {
    const me =
        marble[selected];

    const maxDistance =
        cameraMode === "spectator"
            ? 520
            : 380;

    const step =
        cameraMode === "spectator"
            ? 4
            : 5;

    const sections = [];

    for (
        let ds = -15;
        ds <= maxDistance;
        ds += step
    ) {
        const s =
            clamp(
                me.s + ds,
                0,
                TRACK_LENGTH - 1
            );

        const frame =
            trackFrame(s);

        const left = {
            x:
                frame.p.x -
                frame.n.x *
                ROAD_HALF,

            y:
                frame.p.y -
                frame.n.y *
                ROAD_HALF
        };

        const right = {
            x:
                frame.p.x +
                frame.n.x *
                ROAD_HALF,

            y:
                frame.p.y +
                frame.n.y *
                ROAD_HALF
        };

        const lp =
            project3D(
                left.x,
                left.y,
                cameraX,
                cameraY,
                cameraAngle,
                cameraHeight
            );

        const rp =
            project3D(
                right.x,
                right.y,
                cameraX,
                cameraY,
                cameraAngle,
                cameraHeight
            );

        const cp =
            project3D(
                frame.p.x,
                frame.p.y,
                cameraX,
                cameraY,
                cameraAngle,
                cameraHeight
            );

        if (
            lp &&
            rp &&
            cp
        ) {
            sections.push({
                lp,
                rp,
                cp,
                s
            });
        }
    }

    sections.sort(
        (a, b) =>
            b.cp.depth -
            a.cp.depth
    );

    for (
        let i = 0;
        i < sections.length - 1;
        i++
    ) {
        const a =
            sections[i];

        const b =
            sections[i + 1];

        ctx.beginPath();

        ctx.moveTo(
            a.lp.x,
            a.lp.y
        );

        ctx.lineTo(
            a.rp.x,
            a.rp.y
        );

        ctx.lineTo(
            b.rp.x,
            b.rp.y
        );

        ctx.lineTo(
            b.lp.x,
            b.lp.y
        );

        ctx.closePath();

        const stripe =
            Math.floor(
                a.s / 18
            ) % 2 === 0;

        ctx.fillStyle =
            stripe
                ? "#242a32"
                : "#20262e";

        ctx.fill();
    }

    for (
        let side = -1;
        side <= 1;
        side += 2
    ) {
        ctx.beginPath();

        let started = false;

        for (
            const section of sections
        ) {
            const p =
                side < 0
                    ? section.lp
                    : section.rp;

            if (!started) {
                ctx.moveTo(
                    p.x,
                    p.y
                );

                started = true;
            } else {
                ctx.lineTo(
                    p.x,
                    p.y
                );
            }
        }

        ctx.strokeStyle =
            "#e7edf3";

        ctx.lineWidth = 3;
        ctx.globalAlpha = .85;

        ctx.stroke();

        ctx.globalAlpha = 1;
    }

    for (
        let i = 0;
        i < sections.length - 1;
        i += 3
    ) {
        const a =
            sections[i];

        const b =
            sections[
                Math.min(
                    i + 1,
                    sections.length - 1
                )
            ];

        ctx.strokeStyle =
            "rgba(255,255,255,.16)";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            a.cp.x,
            a.cp.y
        );

        ctx.lineTo(
            b.cp.x,
            b.cp.y
        );

        ctx.stroke();
    }
}


/* =========================================================
   OBSTACLE RENDERING
========================================================= */

function drawWorldObstacles(
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
) {
    const me =
        marble[selected];

    const visible = [];

    for (
        const o of obstacles
    ) {
        const relative =
            o.s - me.s;

        if (
            relative < -30 ||
            relative > 520
        ) {
            continue;
        }

        const frame =
            trackFrame(o.s);

        const pos = {
            x:
                frame.p.x +
                frame.n.x *
                o.lane,

            y:
                frame.p.y +
                frame.n.y *
                o.lane
        };

        const p =
            project3D(
                pos.x,
                pos.y,
                cameraX,
                cameraY,
                cameraAngle,
                cameraHeight
            );

        if (p) {
            visible.push({
                o,
                p
            });
        }
    }

    visible.sort(
        (a, b) =>
            b.p.depth -
            a.p.depth
    );

    for (
        const item of visible
    ) {
        const o = item.o;
        const p = item.p;

        const r =
            Math.max(
                2,
                o.radius *
                p.scale
            );

        ctx.save();

        if (
            o.type === "bumper"
        ) {
            const g =
                ctx.createRadialGradient(
                    p.x - r * .3,
                    p.y - r * .35,
                    r * .1,
                    p.x,
                    p.y,
                    r
                );

            g.addColorStop(
                0,
                "#fff"
            );

            g.addColorStop(
                .2,
                "#ffcc66"
            );

            g.addColorStop(
                1,
                "#d35400"
            );

            ctx.fillStyle = g;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                r,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.strokeStyle =
                "#fff";

            ctx.lineWidth =
                Math.max(
                    1,
                    r * .1
                );

            ctx.stroke();
        } else {
            ctx.fillStyle =
                "#777";

            ctx.fillRect(
                p.x - r,
                p.y - r,
                r * 2,
                r * 2
            );

            ctx.strokeStyle =
                "#bbb";

            ctx.strokeRect(
                p.x - r,
                p.y - r,
                r * 2,
                r * 2
            );
        }

        ctx.restore();
    }
}


/* =========================================================
   MARBLE RENDERING

   IMPORTANT:
   In first-person mode the selected marble is NOT rendered
   in the world. It is represented only by the marble at the
   bottom of the screen.

   This fixes the duplicate selected-marble bug.
========================================================= */

function renderMarbles(
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
) {
    const me =
        marble[selected];

    const visible = [];

    for (
        const m of marble
    ) {
        if (
            m.finished &&
            m !== me
        ) {
            continue;
        }

        const relative =
            m.s - me.s;

        if (
            relative < -35 ||
            relative > 340
        ) {
            continue;
        }

        /*
            DO NOT render the selected marble's world copy
            in first-person mode.
        */
        if (
            cameraMode === "first" &&
            m.id === selected
        ) {
            continue;
        }

        const pos =
            marbleWorldPosition(m);

        const p =
            project3D(
                pos.x,
                pos.y,
                cameraX,
                cameraY,
                cameraAngle,
                cameraHeight
            );

        if (!p) continue;

        visible.push({
            marble: m,
            projection: p
        });
    }

    visible.sort(
        (a, b) =>
            b.projection.depth -
            a.projection.depth
    );

    for (
        const item of visible
    ) {
        const m =
            item.marble;

        const p =
            item.projection;

        const r =
            clamp(
                m.radius *
                p.scale *
                1.18,
                2.5,
                80
            );

        draw3DMarble(
            p.x,
            p.y,
            r,
            m.color,
            m.id === selected
        );

        drawNameLabel(
            m,
            p.x,
            p.y,
            r,
            m.id === selected
        );
    }

    /*
        First-person player marble.
    */
    if (
        cameraMode === "first"
    ) {
        const bottomR =
            Math.min(W, H) *
            .065;

        const bottomX =
            W / 2;

        const bottomY =
            H * .89;

        draw3DMarble(
            bottomX,
            bottomY,
            bottomR,
            me.color,
            true
        );

        drawNameLabel(
            me,
            bottomX,
            bottomY,
            bottomR,
            true
        );
    }
}


/* =========================================================
   FIRST PERSON CAMERA
========================================================= */

function getFirstPersonCamera() {
    const me =
        marble[selected];

    const frame =
        trackFrame(me.s);

    const pos =
        marbleWorldPosition(me);

    return {
        x:
            pos.x -
            frame.t.x * 5,

        y:
            pos.y -
            frame.t.y * 5,

        angle:
            Math.atan2(
                frame.t.y,
                frame.t.x
            ),

        height: 25
    };
}


/* =========================================================
   HIGH OVERHEAD SPECTATOR CAMERA
========================================================= */

function getSpectatorCamera() {
    const me =
        marble[selected];

    const frame =
        trackFrame(me.s);

    const pos =
        marbleWorldPosition(me);

    /*
        Much farther behind the racer.
        Combined with the high camera height this creates
        a top-down chase/race view.
    */
    const followDistance = 95;

    return {
        x:
            pos.x -
            frame.t.x *
            followDistance,

        y:
            pos.y -
            frame.t.y *
            followDistance,

        angle:
            Math.atan2(
                frame.t.y,
                frame.t.x
            ),

        height: 105
    };
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {
    const g =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    g.addColorStop(
        0,
        "#080b14"
    );

    g.addColorStop(
        .42,
        "#101727"
    );

    g.addColorStop(
        1,
        "#05070b"
    );

    ctx.fillStyle = g;
    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.save();

    ctx.globalAlpha = .35;

    for (
        let i = 0;
        i < 70;
        i++
    ) {
        const x =
            (i * 137.7) % W;

        const y =
            (i * 71.3) %
            (H * .42);

        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            x,
            y,
            1,
            1
        );
    }

    ctx.restore();

    const glow =
        ctx.createRadialGradient(
            W / 2,
            H * .42,
            10,
            W / 2,
            H * .42,
            Math.max(W, H) * .7
        );

    glow.addColorStop(
        0,
        "rgba(90,120,180,.14)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   SCENE
========================================================= */

function drawScene() {
    drawBackground();

    if (!raceRunning) {
        return;
    }

    const camera =
        cameraMode === "first"
            ? getFirstPersonCamera()
            : getSpectatorCamera();

    drawWorldTrack(
        camera.x,
        camera.y,
        camera.angle,
        camera.height
    );

    drawWorldObstacles(
        camera.x,
        camera.y,
        camera.angle,
        camera.height
    );

    /*
        Marbles and labels are rendered last so names
        remain readable.
    */
    renderMarbles(
        camera.x,
        camera.y,
        camera.angle,
        camera.height
    );

    /*
        Spectator mode indicator.
    */
    if (
        cameraMode === "spectator"
    ) {
        const me =
            marble[selected];

        ctx.save();

        const text =
            `FOLLOWING: ${me.name}`;

        ctx.font =
            "bold 14px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        const width =
            ctx.measureText(
                text
            ).width + 20;

        ctx.fillStyle =
            "rgba(0,0,0,.65)";

        ctx.beginPath();

        ctx.roundRect(
            W / 2 -
                width / 2,
            18,
            width,
            30,
            8
        );

        ctx.fill();

        ctx.fillStyle =
            "#fff";

        ctx.fillText(
            text,
            W / 2,
            33
        );

        ctx.restore();
    }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {
    if (!raceRunning) {
        return;
    }

    const me =
        marble[selected];

    const position =
        1 +
        marble.filter(
            m =>
                m.s > me.s &&
                !m.finished
        ).length;

    const progress =
        clamp(
            me.s /
            TRACK_LENGTH,
            0,
            1
        ) * 100;

    hudLeft.innerHTML =
        `<b>${me.name}</b><br>` +
        `Position: ${position}/${marble.length}<br>` +
        `Speed: ${me.v.toFixed(1)}`;

    hudRight.innerHTML =
        `${tracks[Number(trackSelect.value)]}<br>` +
        `${progress.toFixed(0)}% &nbsp; ` +
        `${raceTime.toFixed(1)}s`;
}


/* =========================================================
   COUNTDOWN
========================================================= */

function runCountdown() {
    countdownActive = true;
    countdown.style.display =
        "flex";

    const sequence = [
        "3",
        "2",
        "1",
        "GO!"
    ];

    let i = 0;

    function next() {
        if (
            i >=
            sequence.length
        ) {
            countdown.style.display =
                "none";

            countdownActive = false;

            beep(
                880,
                .15
            );

            return;
        }

        countdown.textContent =
            sequence[i];

        if (
            sequence[i] ===
            "GO!"
        ) {
            beep(
                880,
                .16
            );
        } else {
            beep(
                440 + i * 70,
                .1
            );
        }

        i++;

        setTimeout(
            next,
            650
        );
    }

    next();
}


/* =========================================================
   BANK
========================================================= */

function updateBank() {
    bankDisplay.textContent =
        "$" +
        bank.toFixed(0);
}


/* =========================================================
   START RACE
========================================================= */

function startRace() {
    let requestedBet =
        Math.max(
            1,
            Number(
                betInput.value
            ) || 25
        );

    if (
        requestedBet >
        bank
    ) {
        requestedBet =
            bank;
    }

    currentBet =
        requestedBet;

    bank -=
        currentBet;

    updateBank();

    selected =
        Number(
            playerSelect.value
        );

    const seed =
        Number(
            trackSelect.value
        ) + 1;

    track =
        generateTrack(seed);

    generateObstacles(seed);
    createMarbles();

    raceTime = 0;
    raceRunning = true;
    paused = false;
    raceFinished = false;

    cameraMode =
        "first";

    menu.style.display =
        "none";

    finish.style.display =
        "none";

    hud.style.display =
        "flex";

    lastTime =
        performance.now();

    runCountdown();
}


/* =========================================================
   RESTART
========================================================= */

function restartRace() {
    if (raceFinished) {
        bank +=
            currentBet;

        updateBank();
    }

    startRace();
}


/* =========================================================
   FINISH
========================================================= */

function finishRace() {
    raceFinished = true;
    raceRunning = false;

    hud.style.display =
        "none";

    finish.style.display =
        "flex";

    const sorted =
        [...marble].sort(
            (a, b) => {
                if (
                    a.place &&
                    b.place
                ) {
                    return (
                        a.place -
                        b.place
                    );
                }

                return (
                    b.s -
                    a.s
                );
            }
        );

    const winner =
        sorted[0];

    let payout = 0;

    if (
        winner.id ===
        selected
    ) {
        payout =
            currentBet * 3;

        bank +=
            payout;

        finishTitle.textContent =
            `🏆 ${winner.name} wins!`;
    } else {
        finishTitle.textContent =
            `${winner.name} wins the race`;
    }

    updateBank();

    results.innerHTML = "";

    sorted.forEach(
        (m, i) => {
            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "result";

            const place =
                i === 0
                    ? "🥇"
                    : i === 1
                    ? "🥈"
                    : i === 2
                    ? "🥉"
                    : `${i + 1}.`;

            div.innerHTML =
                `<span>${place} ` +
                `<b style="color:${m.color}">` +
                `${m.name}` +
                `</b></span>` +
                `<span>` +
                `${
                    m.finishTime
                        ? m.finishTime.toFixed(2) +
                          "s"
                        : ""
                }` +
                `</span>`;

            results.appendChild(
                div
            );
        }
    );

    if (payout > 0) {
        const payoutDiv =
            document.createElement(
                "div"
            );

        payoutDiv.style.marginTop =
            "15px";

        payoutDiv.style.textAlign =
            "center";

        payoutDiv.style.color =
            "#67e8a5";

        payoutDiv.style.fontWeight =
            "bold";

        payoutDiv.textContent =
            `You won $${payout}!`;

        results.appendChild(
            payoutDiv
        );
    }
}


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startRace
    );

document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        restartRace
    );


/* =========================================================
   KEYBOARD
========================================================= */

addEventListener(
    "keydown",
    e => {
        if (
            document.activeElement ===
            betInput &&
            e.key !== "Escape"
        ) {
            return;
        }

        if (
            e.key.toLowerCase() ===
            "v"
        ) {
            if (!raceRunning) {
                return;
            }

            cameraMode =
                cameraMode === "first"
                    ? "spectator"
                    : "first";

            beep(
                620,
                .06
            );
        }

        if (
            e.key.toLowerCase() ===
            "r"
        ) {
            if (
                raceRunning ||
                raceFinished
            ) {
                restartRace();
            }
        }

        if (
            e.key.toLowerCase() ===
            "m"
        ) {
            muted =
                !muted;

            beep(
                500,
                .05
            );
        }

        if (
            e.code ===
            "Space"
        ) {
            e.preventDefault();

            if (
                raceRunning &&
                !countdownActive
            ) {
                paused =
                    !paused;
            }
        }

        /*
            Number keys 1-8 select
            the racer being followed.
        */
        if (
            e.key >= "1" &&
            e.key <= "8"
        ) {
            const n =
                Number(e.key) - 1;

            if (marble[n]) {
                selected = n;
            }
        }
    }
);


/* =========================================================
   MAIN LOOP
========================================================= */

function frame(now) {
    let dt =
        (now - lastTime) /
        1000;

    lastTime = now;

    dt =
        clamp(
            dt,
            0,
            .035
        );

    update(dt);
    drawScene();
    updateHUD();

    requestAnimationFrame(
        frame
    );
}


/* =========================================================
   INIT
========================================================= */

updateBank();

requestAnimationFrame(
    frame
);
</script>
