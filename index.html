<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("c");

const ctx =
    canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;
}

addEventListener("resize",resize);
resize();

const clamp=(v,a,b)=>
    Math.max(a,Math.min(b,v));

const lerp=(a,b,t)=>
    a+(b-a)*t;


/* =========================================================
   RANDOM
========================================================= */

function seededRandom(seed){

    let x =
        Math.sin(seed*999.123)*
        43758.5453123;

    return()=>{

        x=Math.sin(x)*
            43758.5453123;

        return x-Math.floor(x);
    };
}


/* =========================================================
   RACERS
========================================================= */

const racerData=[

    {
        id:"fetson",
        name:"fetson",
        color:"#e74c3c"
    },

    {
        id:"doober",
        name:"doober",
        color:"#3498db"
    },

    {
        id:"fadgeril",
        name:"fadgeril",
        color:"#f1c40f"
    },

    {
        id:"scrappy",
        name:"scrappy doo",
        color:"#9b59b6"
    },

    {
        id:"scubadaa",
        name:"scubadaa",
        color:"#1abc9c"
    },

    {
        id:"pisswolf",
        name:"pisswolf",
        color:"#f39c12"
    },

    {
        id:"malty",
        name:"malty",
        color:"#e67e22"
    },

    {
        id:"morning",
        name:"morning roll",
        color:"#ecf0f1"
    }
];

const trackNames=[

    "Neon Run",
    "Dust Devil",
    "Marble Mountain",
    "The Snake",
    "Turbo Tunnel",
    "Crystal Coast",
    "Red Canyon",
    "The Gauntlet",
    "Moon Rock",
    "Lava Loop",
    "Blue Thunder",
    "Pinball Ridge",
    "Green Machine",
    "The Spiral",
    "Sunset Sprint",
    "Chaos Valley",
    "Rocket Road",
    "Frostbite",
    "Thunder Alley",
    "Golden Mile",
    "Black Diamond",
    "Jungle Run",
    "Final Frenzy",
    "Mayhem Grand Prix"
];


/* =========================================================
   PHYSICS SETTINGS
========================================================= */

/*
    s = position along the track.

    v = forward speed in track units/sec.

    The values below are intentionally much faster than
    the original version.
*/

const ROAD_HALF=50;

const MARBLE_RADIUS=4.2;

const MAX_SPEED=18;

const MIN_SPEED=.35;

const ROLLING_DRAG=.035;

const AIR_DRAG=.0015;

const CORNER_DRAG=.018;

const WALL_RESTITUTION=.86;

const WALL_FRICTION=.992;

const OBSTACLE_RESTITUTION=.88;


/* =========================================================
   GAME STATE
========================================================= */

let marble=[];
let track=[];
let obstacles=[];

let selected="fetson";

let trackIndex=0;

let state="menu";

let paused=false;

let muted=false;

let firstPerson=false;

let bank=100;

let currentBet=25;

let raceTime=0;

let countdown=0;

let finishOrder=[];

let finishScheduled=false;

let cameraShake=0;

let lastTime=performance.now();


/* =========================================================
   MENU
========================================================= */

const racersEl=
    document.getElementById("racers");

racerData.forEach(r=>{

    const el=
        document.createElement("div");

    el.className=
        "racer"+
        (r.id===selected
            ?" selected"
            :"");

    el.innerHTML=
        `<span class="dot"
            style="background:${r.color}">
        </span>${r.name}`;

    el.onclick=()=>{

        selected=r.id;

        document
            .querySelectorAll(".racer")
            .forEach(x=>
                x.classList.remove(
                    "selected"
                )
            );

        el.classList.add("selected");
    };

    racersEl.appendChild(el);
});


const trackSelect=
    document.getElementById(
        "trackSelect"
    );

trackNames.forEach((name,i)=>{

    const opt=
        document.createElement("option");

    opt.value=i;

    opt.textContent=
        `${i+1}. ${name}`;

    trackSelect.appendChild(opt);
});


function updateBank(){

    document.getElementById(
        "bankText"
    ).textContent=
        "$"+bank.toFixed(0);
}


function setupMenu(){

    document.getElementById("menu")
        .classList.remove("hidden");

    document.getElementById("finishPanel")
        .classList.add("hidden");

    document.getElementById("hud")
        .style.display="none";

    document.getElementById("message")
        .textContent="";

    updateBank();
}


/* =========================================================
   TRACK GENERATION
========================================================= */

function buildTrack(seed){

    const rnd=
        seededRandom(
            seed*123.17
        );

    track=[];
    obstacles=[];

    const total=2200;

    let px=0;
    let py=0;

    let angle=0;

    for(let i=0;i<total;i++){

        /*
            Smooth curves instead of random sharp turns.
        */

        const longTurn=
            Math.sin(
                i*.010+
                seed*.7
            )*.018;

        const mediumTurn=
            Math.sin(
                i*.027+
                seed*1.9
            )*.025;

        const shortTurn=
            Math.sin(
                i*.067+
                seed*4.1
            )*.012;

        const randomTurn=
            (rnd()-.5)*.006;

        angle+=
            longTurn+
            mediumTurn+
            shortTurn+
            randomTurn;

        const step=4.5;

        px+=
            Math.cos(angle)*step;

        py+=
            Math.sin(angle)*step;

        track.push({
            x:px,
            y:py
        });
    }

    /*
        Smooth centerline.
    */

    for(let pass=0;pass<3;pass++){

        const copy=
            track.map(p=>({
                x:p.x,
                y:p.y
            }));

        for(
            let i=1;
            i<track.length-1;
            i++
        ){

            track[i].x=
                (
                    copy[i-1].x+
                    copy[i].x*2+
                    copy[i+1].x
                )/4;

            track[i].y=
                (
                    copy[i-1].y+
                    copy[i].y*2+
                    copy[i+1].y
                )/4;
        }
    }

    /*
        Obstacles.
    */

    for(
        let s=180;
        s<track.length-100;
        s+=Math.floor(
            85+rnd()*115
        )
    ){

        obstacles.push({

            s,

            lane:
                (rnd()>.5?1:-1)*
                (18+rnd()*25),

            type:
                rnd()<.58
                    ?"bumper"
                    :"block",

            size:
                7+rnd()*8,

            height:
                8+rnd()*9,

            rot:
                rnd()*Math.PI*2,

            hit:false
        });
    }

    /*
        Center bumpers.
    */

    for(let i=0;i<5;i++){

        const s=
            350+
            Math.floor(
                rnd()*
                (track.length-550)
            );

        obstacles.push({

            s,

            lane:
                (rnd()-.5)*20,

            type:"bumper",

            size:
                8+rnd()*5,

            height:
                10+rnd()*5,

            rot:
                rnd()*Math.PI*2,

            hit:false
        });
    }
}


/* =========================================================
   TRACK SAMPLING
========================================================= */

function sample(s){

    if(!track.length)
        return{
            x:0,
            y:0
        };

    s=clamp(
        s,
        0,
        track.length-1
    );

    const i=Math.floor(s);

    const f=s-i;

    const a=track[i];

    const b=
        track[
            Math.min(
                i+1,
                track.length-1
            )
        ];

    return{

        x:lerp(
            a.x,
            b.x,
            f
        ),

        y:lerp(
            a.y,
            b.y,
            f
        )
    };
}


function tan(s){

    const a=
        sample(
            clamp(
                s-2,
                0,
                track.length-1
            )
        );

    const b=
        sample(
            clamp(
                s+2,
                0,
                track.length-1
            )
        );

    const dx=b.x-a.x;
    const dy=b.y-a.y;

    const len=
        Math.hypot(dx,dy)||1;

    return{

        x:dx/len,
        y:dy/len
    };
}


function trackFrame(s){

    const p=sample(s);

    const t=tan(s);

    const tp=
        tan(
            clamp(
                s-4,
                0,
                track.length-1
            )
        );

    const tn=
        tan(
            clamp(
                s+4,
                0,
                track.length-1
            )
        );

    const cross=
        tp.x*tn.y-
        tp.y*tn.x;

    return{

        p,

        t,

        n:{
            x:-t.y,
            y:t.x
        },

        curvature:
            cross/8
    };
}


/* =========================================================
   CREATE MARBLES
========================================================= */

function makeMarbles(){

    /*
        Different physical characteristics.

        None of these have artificial speed boosts.
        Faster racers simply have different acceleration,
        grip and mass.
    */

    const traits=[

        {
            accel:6.4,
            grip:2.35,
            bounce:.91,
            mass:1.00,
            rolling:.034
        },

        {
            accel:6.8,
            grip:2.10,
            bounce:.87,
            mass:1.02,
            rolling:.031
        },

        {
            accel:6.0,
            grip:2.65,
            bounce:.94,
            mass:.96,
            rolling:.037
        },

        {
            accel:6.5,
            grip:1.95,
            bounce:.96,
            mass:1.06,
            rolling:.032
        },

        {
            accel:6.3,
            grip:2.40,
            bounce:.89,
            mass:1.00,
            rolling:.034
        },

        {
            accel:7.0,
            grip:1.85,
            bounce:.85,
            mass:.94,
            rolling:.029
        },

        {
            accel:5.9,
            grip:2.85,
            bounce:.93,
            mass:1.08,
            rolling:.040
        },

        {
            accel:6.45,
            grip:2.20,
            bounce:.90,
            mass:1.01,
            rolling:.033
        }
    ];

    marble=
        racerData.map((r,i)=>{

            const t=traits[i];

            return{

                ...r,

                /*
                    Start on the actual track.
                */

                s:
                    28-
                    i*3,

                lane:
                    (i-3.5)*8.5,

                /*
                    Much faster starting speed.
                */

                v:
                    3+
                    i*.08,

                laneV:0,

                accel:t.accel,

                grip:t.grip,

                bounce:t.bounce,

                mass:t.mass,

                rolling:t.rolling,

                radius:
                    MARBLE_RADIUS,

                spin:
                    Math.random()*
                    Math.PI*2,

                wobble:
                    Math.random()*
                    Math.PI*2,

                hitCooldown:0,

                finished:false,

                finishTime:0
            };
        });
}


/* =========================================================
   WALL COLLISIONS
========================================================= */

function wallCollision(m){

    const limit=
        ROAD_HALF-
        m.radius;

    /*
        Left/right wall collision only changes the
        lateral component. Forward momentum is preserved.
    */

    if(m.lane>limit){

        const penetration=
            m.lane-limit;

        m.lane=
            limit-
            penetration*.25;

        if(m.laneV>0){

            m.laneV=
                -m.laneV*
                WALL_RESTITUTION;

            m.laneV*=
                WALL_FRICTION;

            /*
                Only 1.5% speed loss.
            */

            m.v*=.985;

            m.spin+=
                m.laneV*.035;

            cameraShake=
                Math.max(
                    cameraShake,
                    .16
                );
        }
    }

    if(m.lane<-limit){

        const penetration=
            -limit-m.lane;

        m.lane=
            -limit+
            penetration*.25;

        if(m.laneV<0){

            m.laneV=
                -m.laneV*
                WALL_RESTITUTION;

            m.laneV*=
                WALL_FRICTION;

            m.v*=.985;

            m.spin+=
                m.laneV*.035;

            cameraShake=
                Math.max(
                    cameraShake,
                    .16
                );
        }
    }
}


/* =========================================================
   OBSTACLE COLLISIONS
========================================================= */

function obstacleCollisions(m){

    for(const o of obstacles){

        const ds=o.s-m.s;

        if(Math.abs(ds)>13)
            continue;

        const dl=o.lane-m.lane;

        const distance=
            Math.hypot(ds,dl);

        const radius=
            m.radius+
            o.size;

        if(distance>=radius)
            continue;

        if(m.hitCooldown>0)
            continue;

        let nS=ds;
        let nL=dl;

        const len=
            distance||.0001;

        nS/=len;
        nL/=len;

        const penetration=
            radius-distance;

        /*
            Separate the marble from the obstacle.
        */

        m.s-=
            nS*
            penetration*
            .80;

        m.lane-=
            nL*
            penetration*
            .80;

        /*
            Marble velocity vector in track coordinates.
        */

        const forwardVelocity=m.v;

        const lateralVelocity=m.laneV;

        /*
            Velocity toward obstacle.
        */

        const normalVelocity=
            forwardVelocity*nS+
            lateralVelocity*nL;

        if(normalVelocity>0){

            /*
                Elastic-ish collision.

                Importantly, this does NOT apply a giant
                speed multiplier/penalty.
            */

            const restitution=
                o.type==="bumper"
                    ? .96
                    : OBSTACLE_RESTITUTION;

            const impulse=
                -(1+restitution)*
                normalVelocity;

            m.v+=
                impulse*nS;

            m.laneV+=
                impulse*nL;
        }

        if(o.type==="bumper"){

            /*
                Bumpers mostly redirect the marble.
            */

            const side=
                m.lane>=o.lane
                    ?1
                    :-1;

            m.laneV+=
                side*
                (1.0+
                Math.random()*1.6);

            /*
                Only tiny energy loss.
            */

            m.v*=.985;

        }else{

            /*
                Solid blocks have more energy loss,
                but still don't stop the marble.
            */

            m.v*=.94;

            m.laneV*=.96;
        }

        /*
            Keep forward motion alive.
        */

        if(
            m.v<MIN_SPEED &&
            normalVelocity>0
        ){

            m.v=
                MIN_SPEED+
                Math.abs(
                    lateralVelocity
                )*.08;
        }

        m.hitCooldown=.10;

        m.spin+=
            (Math.random()-.5)*2;

        cameraShake=
            Math.max(
                cameraShake,
                .25
            );
    }
}


/* =========================================================
   MARBLE-TO-MARBLE PHYSICS
========================================================= */

function marbleCollisions(){

    for(let i=0;i<marble.length;i++){

        const a=marble[i];

        if(a.finished)
            continue;

        for(
            let j=i+1;
            j<marble.length;
            j++
        ){

            const b=marble[j];

            if(b.finished)
                continue;

            const ds=b.s-a.s;
            const dl=b.lane-a.lane;

            const distance=
                Math.hypot(ds,dl);

            const minDistance=
                a.radius+
                b.radius;

            if(distance>=minDistance)
                continue;

            let nS=ds;
            let nL=dl;

            const len=
                distance||.0001;

            nS/=len;
            nL/=len;

            const overlap=
                minDistance-distance;

            const totalMass=
                a.mass+b.mass;

            /*
                Positional correction.
            */

            a.s-=
                nS*
                overlap*
                (b.mass/totalMass)*
                .55;

            a.lane-=
                nL*
                overlap*
                (b.mass/totalMass)*
                .55;

            b.s+=
                nS*
                overlap*
                (a.mass/totalMass)*
                .55;

            b.lane+=
                nL*
                overlap*
                (a.mass/totalMass)*
                .55;

            /*
                Relative velocity.
            */

            const relativeVelocity=
                (b.v-a.v)*nS+
                (b.laneV-a.laneV)*nL;

            /*
                If they are separating, no impulse needed.
            */

            if(relativeVelocity>=0)
                continue;

            const restitution=.90;

            const impulse=
                -(1+restitution)*
                relativeVelocity/
                (
                    1/a.mass+
                    1/b.mass
                );

            const impulseS=
                impulse*nS;

            const impulseL=
                impulse*nL;

            a.v-=
                impulseS/a.mass;

            a.laneV-=
                impulseL/a.mass;

            b.v+=
                impulseS/b.mass;

            b.laneV+=
                impulseL/b.mass;

            /*
                Very small rolling/contact loss.
            */

            a.v*=.998;
            b.v*=.998;

            a.spin-=
                impulseL*.035;

            b.spin+=
                impulseL*.035;

            cameraShake=
                Math.max(
                    cameraShake,
                    .10
                );
        }
    }
}


/* =========================================================
   PHYSICS UPDATE
========================================================= */

function updateRace(dt){

    /*
        Countdown.
    */

    if(state==="countdown"){

        countdown-=dt;

        if(countdown<=0){

            state="race";

            document.getElementById(
                "message"
            ).textContent="GO!";

            tone(880,.12);

            setTimeout(()=>{

                if(state==="race"){

                    document.getElementById(
                        "message"
                    ).textContent="";
                }

            },500);

        }else{

            document.getElementById(
                "message"
            ).textContent=
                Math.ceil(countdown);
        }

        return;
    }

    if(
        state!=="race"||
        paused
    )
        return;

    raceTime+=dt;

    const finishS=
        track.length-28;

    /*
        Update each marble.
    */

    for(const m of marble){

        if(m.finished)
            continue;

        m.hitCooldown=
            Math.max(
                0,
                m.hitCooldown-dt
            );

        const frame=
            trackFrame(m.s);

        /*
            -------------------------------------------------
            FORWARD PHYSICS
            -------------------------------------------------
        */

        /*
            Basic engine-like acceleration.
        */

        let acceleration=
            m.accel;

        /*
            Rolling resistance.

            This is deliberately low.
        */

        acceleration-=
            m.rolling;

        /*
            Air drag rises with speed.
        */

        acceleration-=
            AIR_DRAG*
            m.v*
            Math.abs(m.v);

        /*
            Cornering naturally bleeds some energy.

            This is MUCH lower than before.
        */

        const cornerLoad=
            Math.abs(
                frame.curvature
            )*
            m.v*
            m.v;

        acceleration-=
            cornerLoad*
            CORNER_DRAG;

        /*
            Small surface variation.
        */

        acceleration+=
            Math.sin(
                m.s*.37+
                m.wobble
            )*.025;

        m.v+=
            acceleration*dt;

        /*
            Never allow normal race physics to stall
            a marble indefinitely.
        */

        if(m.v<MIN_SPEED){

            m.v+=
                (
                    .75-m.v
                )*
                dt*
                1.4;
        }

        /*
            -------------------------------------------------
            LATERAL PHYSICS
            -------------------------------------------------
        */

        /*
            Centrifugal force from track curvature.
        */

        const centrifugal=
            -frame.curvature*
            m.v*
            m.v*
            .18;

        /*
            Grip pulls lateral velocity back toward zero.
        */

        const lateralFriction=
            -m.laneV*
            m.grip;

        /*
            Tiny surface irregularity.
        */

        const surfaceNoise=
            Math.sin(
                m.s*.37+
                m.wobble
            )*.035;

        m.laneV+=
            (
                centrifugal+
                lateralFriction+
                surfaceNoise
            )*dt;

        /*
            Don't instantly kill lateral velocity.
        */

        m.laneV*=
            Math.pow(
                .992,
                dt*60
            );

        m.lane+=
            m.laneV*dt;

        /*
            Walls.
        */

        wallCollision(m);

        /*
            Obstacles.
        */

        obstacleCollisions(m);

        /*
            Marble collisions are processed after every
            marble has moved.
        */

        /*
            Final safety limits.
        */

        m.v=
            clamp(
                m.v,
                -2,
                MAX_SPEED
            );

        m.laneV=
            clamp(
                m.laneV,
                -12,
                12
            );

        /*
            ACTUAL FORWARD MOTION.
        */

        m.s+=
            m.v*dt;

        /*
            Rolling spin.
        */

        m.spin+=
            (
                m.v+
                Math.abs(m.laneV)*.15
            )*dt;

        /*
            Finish line.
        */

        if(m.s>=finishS){

            m.finished=true;

            m.finishTime=
                raceTime;

            finishOrder.push(m);

            tone(
                520+
                finishOrder.length*60,
                .08
            );
        }
    }

    /*
        Physical marble collisions.
    */

    marbleCollisions();

    /*
        End when everyone has crossed.
    */

    if(
        finishOrder.length>=
        marble.length &&
        !finishScheduled
    ){

        finishScheduled=true;

        setTimeout(()=>{

            if(state==="race")
                finishRace();

        },500);
    }

    /*
        Camera shake fades naturally.
    */

    cameraShake*=
        Math.pow(
            .88,
            dt*60
        );
}


/* =========================================================
   START RACE
========================================================= */

function start(){

    let betValue=
        Math.floor(
            Number(
                document.getElementById(
                    "bet"
                ).value
            )||0
        );

    currentBet=
        clamp(
            betValue,
            0,
            bank
        );

    bank-=currentBet;

    trackIndex=
        parseInt(
            trackSelect.value,
            10
        )||0;

    buildTrack(
        trackIndex+1
    );

    makeMarbles();

    state="countdown";

    paused=false;

    raceTime=0;

    countdown=3.2;

    finishOrder=[];

    finishScheduled=false;

    cameraShake=0;

    resetCameras();

    document.getElementById(
        "menu"
    ).classList.add("hidden");

    document.getElementById(
        "finishPanel"
    ).classList.add("hidden");

    document.getElementById(
        "hud"
    ).style.display="block";

    document.getElementById(
        "message"
    ).textContent="3";

    tone(440,.12);
}


function restart(){

    if(state==="menu")
        return;

    /*
        Return the current wager before restarting.
    */

    bank+=currentBet;

    document.getElementById(
        "bet"
    ).value=currentBet;

    start();
}


/* =========================================================
   FINISH
========================================================= */

function finishRace(){

    state="finish";

    finishScheduled=false;

    const ordered=[
        ...finishOrder
    ];

    /*
        Any marble not technically finished is sorted
        by distance.
    */

    marble
        .filter(
            m=>!ordered.includes(m)
        )
        .sort(
            (a,b)=>b.s-a.s
        )
        .forEach(
            m=>ordered.push(m)
        );

    const winner=
        ordered[0];

    document.getElementById(
        "winnerText"
    ).textContent=
        winner
            ? winner.name+" wins!"
            : "Race complete!";

    const results=
        document.getElementById(
            "results"
        );

    results.innerHTML="";

    ordered.forEach((m,i)=>{

        const div=
            document.createElement("div");

        div.className="result";

        div.innerHTML=
            `<span>
                ${i+1}. ${m.name}
            </span>
            <span>
                ${
                    m.finished
                        ? m.finishTime.toFixed(2)+"s"
                        : "DNF"
                }
            </span>`;

        results.appendChild(div);
    });

    let payout=0;

    /*
        3x payout for picking the winner.
    */

    if(
        winner &&
        winner.id===selected
    ){

        payout=
            currentBet*3;

        bank+=payout;
    }

    document.getElementById(
        "payoutText"
    ).textContent=
        payout>0
            ? `You won $${payout}!`
            : `Bet lost: $${currentBet}`;

    updateBank();

    document.getElementById(
        "finishPanel"
    ).classList.remove("hidden");

    document.getElementById(
        "hud"
    ).style.display="none";

    document.getElementById(
        "message"
    ).textContent="";

    tone(900,.2);
}


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function tone(freq,duration){

    if(muted)
        return;

    try{

        if(!audioCtx){

            audioCtx=
                new(
                    window.AudioContext||
                    window.webkitAudioContext
                )();
        }

        const osc=
            audioCtx.createOscillator();

        const gain=
            audioCtx.createGain();

        osc.frequency.value=freq;

        osc.type="sine";

        gain.gain.setValueAtTime(
            .06,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+
            duration
        );

        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        osc.start();

        osc.stop(
            audioCtx.currentTime+
            duration
        );

    }catch(e){}
}


/* =========================================================
   CAMERA
========================================================= */

let spectatorX=0;
let spectatorY=0;
let spectatorAngle=0;

let fpX=0;
let fpY=0;
let fpAngle=0;


function resetCameras(){

    if(!marble.length)
        return;

    const me=
        marble.find(
            m=>m.id===selected
        )||
        marble[0];

    const p=
        marbleWorldPosition(me);

    const t=
        tan(me.s);

    /*
        First-person.
    */

    fpX=p.x;
    fpY=p.y;

    fpAngle=
        Math.atan2(
            t.y,
            t.x
        );

    /*
        Spectator.
    */

    const back=70;

    spectatorX=
        p.x-
        t.x*
        back;

    spectatorY=
        p.y-
        t.y*
        back;

    spectatorAngle=
        Math.atan2(
            t.y,
            t.x
        );

    cameraShake=0;
}


function updateCameras(dt){

    if(!marble.length)
        return;

    const me=
        marble.find(
            m=>m.id===selected
        )||
        marble[0];

    const pos=
        marbleWorldPosition(me);

    const t=
        tan(me.s);

    /*
        First person follow.
    */

    const follow=
        1-
        Math.pow(
            .0001,
            dt
        );

    fpX=
        lerp(
            fpX,
            pos.x,
            follow
        );

    fpY=
        lerp(
            fpY,
            pos.y,
            follow
        );

    const desiredAngle=
        Math.atan2(
            t.y,
            t.x
        );

    fpAngle=
        angleLerp(
            fpAngle,
            desiredAngle,
            1-
            Math.pow(
                .001,
                dt
            )
        );

    /*
        Spectator camera follows behind.
    */

    const backDistance=70;

    const desiredX=
        pos.x-
        t.x*
        backDistance;

    const desiredY=
        pos.y-
        t.y*
        backDistance;

    const cameraFollow=
        1-
        Math.pow(
            .0008,
            dt
        );

    spectatorX=
        lerp(
            spectatorX,
            desiredX,
            cameraFollow
        );

    spectatorY=
        lerp(
            spectatorY,
            desiredY,
            cameraFollow
        );

    spectatorAngle=
        angleLerp(
            spectatorAngle,
            Math.atan2(
                t.y,
                t.x
            ),
            cameraFollow
        );
}


function angleLerp(a,b,t){

    let d=b-a;

    while(d>Math.PI)
        d-=Math.PI*2;

    while(d<-Math.PI)
        d+=Math.PI*2;

    return a+d*t;
}


function marbleWorldPosition(m){

    const f=
        trackFrame(m.s);

    return{

        x:
            f.p.x+
            f.n.x*
            m.lane,

        y:
            f.p.y+
            f.n.y*
            m.lane
    };
}


/* =========================================================
   3D PROJECTION
========================================================= */

function project3D(
    x,
    y,
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
){

    const dx=
        x-cameraX;

    const dy=
        y-cameraY;

    /*
        Correct forward/right coordinate system.
    */

    const forwardX=
        Math.cos(
            cameraAngle
        );

    const forwardY=
        Math.sin(
            cameraAngle
        );

    const rightX=
        -Math.sin(
            cameraAngle
        );

    const rightY=
        Math.cos(
            cameraAngle
        );

    const depth=
        dx*forwardX+
        dy*forwardY;

    const side=
        dx*rightX+
        dy*rightY;

    /*
        Behind camera.
    */

    if(depth<2)
        return null;

    const focal=
        Math.min(W,H)*.82;

    const scale=
        focal/
        Math.max(
            8,
            depth+
            cameraHeight
        );

    const horizon=
        H*.38;

    const groundY=
        horizon+
        cameraHeight*
        scale;

    return{

        x:
            W/2+
            side*
            scale,

        y:groundY,

        scale,

        depth
    };
}


/* =========================================================
   3D MARBLE
========================================================= */

function draw3DMarble(
    x,
    y,
    r,
    color,
    selectedMarble
){

    /*
        Shadow.
    */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+r*.55,
        r*1.25,
        r*.42,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "rgba(0,0,0,.42)";

    ctx.fill();

    /*
        Sphere.
    */

    const grad=
        ctx.createRadialGradient(
            x-r*.35,
            y-r*.45,
            Math.max(
                .1,
                r*.1
            ),
            x,
            y,
            r
        );

    grad.addColorStop(
        0,
        "#ffffff"
    );

    grad.addColorStop(
        .15,
        color
    );

    grad.addColorStop(
        .72,
        color
    );

    grad.addColorStop(
        1,
        "rgba(0,0,0,.75)"
    );

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle=grad;

    ctx.fill();

    if(selectedMarble){

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r+3,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#fff";

        ctx.lineWidth=2;

        ctx.stroke();
    }
}


/* =========================================================
   TEXT LABEL
========================================================= */

function drawMarbleLabel(
    m,
    x,
    y,
    r,
    selectedLabel=false
){

    /*
        Scale labels according to marble size,
        but keep distant names readable.
    */

    const fontSize=
        clamp(
            r*1.15,
            11,
            24
        );

    const labelY=
        y-r-8;

    ctx.save();

    ctx.font=
        `bold ${fontSize}px Arial`;

    ctx.textAlign="center";

    ctx.textBaseline="bottom";

    /*
        Thick dark outline.
    */

    ctx.lineWidth=
        Math.max(
            3,
            fontSize*.27
        );

    ctx.strokeStyle=
        "rgba(0,0,0,.92)";

    ctx.strokeText(
        m.name,
        x,
        labelY
    );

    /*
        Player name gets the marble's color.
        Other names are white.
    */

    ctx.fillStyle=
        selectedLabel
            ? m.color
            : "#ffffff";

    ctx.fillText(
        m.name,
        x,
        labelY
    );

    ctx.restore();
}


/* =========================================================
   SPECTATOR CAMERA
========================================================= */

function drawSpectator(){

    /*
        Sky.
    */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H*.65
        );

    sky.addColorStop(
        0,
        "#07111f"
    );

    sky.addColorStop(
        .55,
        "#15253a"
    );

    sky.addColorStop(
        1,
        "#263a47"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
        Ground.
    */

    ctx.fillStyle="#101b18";

    ctx.fillRect(
        0,
        H*.38,
        W,
        H*.62
    );

    if(
        !marble.length||
        !track.length
    )
        return;

    const me=
        marble.find(
            m=>m.id===selected
        )||
        marble[0];

    const cameraHeight=38;

    const start=
        Math.floor(
            me.s-20
        );

    const end=
        Math.min(
            track.length-2,
            Math.floor(
                me.s+280
            )
        );

    /*
        ROAD
    */

    const segments=[];

    for(
        let s=end;
        s>=start;
        s-=2
    ){

        const f=
            trackFrame(s);

        const lp=
            project3D(
                f.p.x-
                f.n.x*
                ROAD_HALF,

                f.p.y-
                f.n.y*
                ROAD_HALF,

                spectatorX,
                spectatorY,
                spectatorAngle,
                cameraHeight
            );

        const rp=
            project3D(
                f.p.x+
                f.n.x*
                ROAD_HALF,

                f.p.y+
                f.n.y*
                ROAD_HALF,

                spectatorX,
                spectatorY,
                spectatorAngle,
                cameraHeight
            );

        if(!lp||!rp)
            continue;

        const f2=
            trackFrame(s+2);

        const lp2=
            project3D(
                f2.p.x-
                f2.n.x*
                ROAD_HALF,

                f2.p.y-
                f2.n.y*
                ROAD_HALF,

                spectatorX,
                spectatorY,
                spectatorAngle,
                cameraHeight
            );

        const rp2=
            project3D(
                f2.p.x+
                f2.n.x*
                ROAD_HALF,

                f2.p.y+
                f2.n.y*
                ROAD_HALF,

                spectatorX,
                spectatorY,
                spectatorAngle,
                cameraHeight
            );

        if(!lp2||!rp2)
            continue;

        segments.push({
            lp,
            rp,
            lp2,
            rp2,
            s
        });
    }

    for(const seg of segments){

        ctx.beginPath();

        ctx.moveTo(
            seg.lp.x,
            seg.lp.y
        );

        ctx.lineTo(
            seg.rp.x,
            seg.rp.y
        );

        ctx.lineTo(
            seg.rp2.x,
            seg.rp2.y
        );

        ctx.lineTo(
            seg.lp2.x,
            seg.lp2.y
        );

        ctx.closePath();

        ctx.fillStyle=
            Math.floor(
                seg.s/8
            )%2
                ? "#252b34"
                : "#292f38";

        ctx.fill();
    }

    /*
        TRACK WALLS
    */

    for(const seg of segments){

        ctx.beginPath();

        ctx.moveTo(
            seg.lp.x,
            seg.lp.y
        );

        ctx.lineTo(
            seg.lp2.x,
            seg.lp2.y
        );

        ctx.strokeStyle=
            Math.floor(
                seg.s/5
            )%2
                ? "#e74c3c"
                : "#f4f4f4";

        ctx.lineWidth=
            Math.max(
                2,
                seg.lp.scale*7
            );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            seg.rp.x,
            seg.rp.y
        );

        ctx.lineTo(
            seg.rp2.x,
            seg.rp2.y
        );

        ctx.strokeStyle=
            Math.floor(
                seg.s/5
            )%2
                ? "#3498db"
                : "#f4f4f4";

        ctx.stroke();
    }

    /*
        CENTER MARKERS
    */

    for(
        let s=
            Math.floor(me.s-10);

        s<
            Math.min(
                track.length-2,
                me.s+280
            );

        s+=12
    ){

        const f=
            trackFrame(s);

        const a=
            project3D(
                f.p.x,
                f.p.y,
                spectatorX,
                spectatorY,
                spectatorAngle,
                cameraHeight
            );

        const f2=
            trackFrame(s+5);

        const b=
            project3D(
                f2.p.x,
                f2.p.y,
                spectatorX,
                spectatorY,
                spectatorAngle,
                cameraHeight
            );

        if(!a||!b)
            continue;

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.strokeStyle=
            "rgba(255,255,255,.48)";

        ctx.lineWidth=
            Math.max(
                1,
                a.scale*3
            );

        ctx.stroke();
    }

    /*
        OBSTACLES
    */

    for(const o of obstacles){

        if(
            o.s<me.s-20||
            o.s>me.s+280
        )
            continue;

        const f=
            trackFrame(o.s);

        const ox=
            f.p.x+
            f.n.x*
            o.lane;

        const oy=
            f.p.y+
            f.n.y*
            o.lane;

        const p=
            project3D(
                ox,
                oy,
                spectatorX,
                spectatorY,
                spectatorAngle,
                cameraHeight
            );

        if(!p)
            continue;

        const r=
            Math.max(
                3,
                o.size*p.scale
            );

        const topY=
            p.y-
            o.height*
            p.scale;

        ctx.beginPath();

        ctx.ellipse(
            p.x,
            p.y+r*.35,
            r*1.2,
            r*.4,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            "rgba(0,0,0,.35)";

        ctx.fill();

        ctx.beginPath();

        ctx.moveTo(
            p.x-r,
            p.y
        );

        ctx.lineTo(
            p.x+r,
            p.y
        );

        ctx.lineTo(
            p.x+r*.72,
            topY
        );

        ctx.lineTo(
            p.x-r*.72,
            topY
        );

        ctx.closePath();

        ctx.fillStyle=
            o.type==="bumper"
                ? "#f1c40f"
                : "#d35400";

        ctx.fill();

        ctx.strokeStyle=
            "rgba(0,0,0,.55)";

        ctx.stroke();
    }

    /*
        MARBLES

        Sort far-to-near.
    */

    const renderMarbles=
        marble
            .filter(m=>
                !m.finished&&
                m.s>me.s-20&&
                m.s<me.s+280
            )
            .map(m=>{

                const pos=
                    marbleWorldPosition(m);

                const p=
                    project3D(
                        pos.x,
                        pos.y,
                        spectatorX,
                        spectatorY,
                        spectatorAngle,
                        cameraHeight
                    );

                return{
                    m,
                    p
                };
            })
            .filter(x=>x.p)
            .sort(
                (a,b)=>
                    b.p.depth-
                    a.p.depth
            );

    for(const item of renderMarbles){

        const m=item.m;
        const p=item.p;

        const r=
            Math.max(
                2,
                m.radius*
                p.scale*
                1.25
            );

        draw3DMarble(
            p.x,
            p.y,
            r,
            m.color,
            m.id===selected
        );
    }

    ctx.fillStyle=
        "rgba(255,255,255,.75)";

    ctx.font=
        "bold 13px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "SPECTATOR CAMERA",
        W/2,
        30
    );
}


/* =========================================================
   FIRST PERSON CAMERA
========================================================= */

function drawFirstPerson(){

    /*
        Sky.
    */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H*.55
        );

    sky.addColorStop(
        0,
        "#06101d"
    );

    sky.addColorStop(
        .55,
        "#1a3048"
    );

    sky.addColorStop(
        1,
        "#4d6170"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
        Ground.
    */

    ctx.fillStyle="#111a18";

    ctx.fillRect(
        0,
        H*.40,
        W,
        H*.60
    );

    if(
        !marble.length||
        !track.length
    )
        return;

    const me=
        marble.find(
            m=>m.id===selected
        )||
        marble[0];

    const cameraHeight=26;

    const start=
        Math.floor(me.s);

    const end=
        Math.min(
            track.length-2,
            start+280
        );

    /*
        ROAD
    */

    for(
        let s=end;
        s>=start;
        s-=2
    ){

        const f=
            trackFrame(s);

        const lp=
            project3D(
                f.p.x-
                f.n.x*
                ROAD_HALF,

                f.p.y-
                f.n.y*
                ROAD_HALF,

                fpX,
                fpY,
                fpAngle,
                cameraHeight
            );

        const rp=
            project3D(
                f.p.x+
                f.n.x*
                ROAD_HALF,

                f.p.y+
                f.n.y*
                ROAD_HALF,

                fpX,
                fpY,
                fpAngle,
                cameraHeight
            );

        const f2=
            trackFrame(s+2);

        const lp2=
            project3D(
                f2.p.x-
                f2.n.x*
                ROAD_HALF,

                f2.p.y-
                f2.n.y*
                ROAD_HALF,

                fpX,
                fpY,
                fpAngle,
                cameraHeight
            );

        const rp2=
            project3D(
                f2.p.x+
                f2.n.x*
                ROAD_HALF,

                f2.p.y+
                f2.n.y*
                ROAD_HALF,

                fpX,
                fpY,
                fpAngle,
                cameraHeight
            );

        if(
            !lp||
            !rp||
            !lp2||
            !rp2
        )
            continue;

        ctx.beginPath();

        ctx.moveTo(
            lp.x,
            lp.y
        );

        ctx.lineTo(
            rp.x,
            rp.y
        );

        ctx.lineTo(
            rp2.x,
            rp2.y
        );

        ctx.lineTo(
            lp2.x,
            lp2.y
        );

        ctx.closePath();

        ctx.fillStyle=
            Math.floor(
                s/8
            )%2
                ? "#252b34"
                : "#2b313a";

        ctx.fill();

        /*
            Left wall.
        */

        ctx.beginPath();

        ctx.moveTo(
            lp.x,
            lp.y
        );

        ctx.lineTo(
            lp2.x,
            lp2.y
        );

        ctx.strokeStyle=
            Math.floor(
                s/5
            )%2
                ? "#e74c3c"
                : "#f4f4f4";

        ctx.lineWidth=
            Math.max(
                2,
                lp.scale*6
            );

        ctx.stroke();

        /*
            Right wall.
        */

        ctx.beginPath();

        ctx.moveTo(
            rp.x,
            rp.y
        );

        ctx.lineTo(
            rp2.x,
            rp2.y
        );

        ctx.strokeStyle=
            Math.floor(
                s/5
            )%2
                ? "#3498db"
                : "#f4f4f4";

        ctx.stroke();
    }

    /*
        CENTER DASHES
    */

    for(
        let s=start+5;
        s<Math.min(
            track.length-2,
            start+280
        );
        s+=13
    ){

        const f=
            trackFrame(s);

        const a=
            project3D(
                f.p.x,
                f.p.y,
                fpX,
                fpY,
                fpAngle,
                cameraHeight
            );

        const f2=
            trackFrame(s+5);

        const b=
            project3D(
                f2.p.x,
                f2.p.y,
                fpX,
                fpY,
                fpAngle,
                cameraHeight
            );

        if(!a||!b)
            continue;

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.strokeStyle=
            "rgba(255,255,255,.42)";

        ctx.lineWidth=
            Math.max(
                1,
                a.scale*3
            );

        ctx.stroke();
    }

    /*
        OBSTACLES
    */

    const visibleObstacles=
        obstacles
            .filter(o=>
                o.s>=me.s&&
                o.s<=me.s+280
            )
            .sort(
                (a,b)=>b.s-a.s
            );

    for(const o of visibleObstacles){

        const f=
            trackFrame(o.s);

        const ox=
            f.p.x+
            f.n.x*
            o.lane;

        const oy=
            f.p.y+
            f.n.y*
            o.lane;

        const p=
            project3D(
                ox,
                oy,
                fpX,
                fpY,
                fpAngle,
                cameraHeight
            );

        if(!p)
            continue;

        const r=
            Math.max(
                2,
                o.size*
                p.scale
            );

        /*
            Shadow.
        */

        ctx.beginPath();

        ctx.ellipse(
            p.x,
            p.y+r*.3,
            r*1.15,
            r*.35,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            "rgba(0,0,0,.4)";

        ctx.fill();

        /*
            Body.
        */

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y-r*.35,
            r,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            o.type==="bumper"
                ? "#f1c40f"
                : "#d35400";

        ctx.fill();

        ctx.strokeStyle=
            "rgba(0,0,0,.6)";

        ctx.stroke();
    }

    /*
        =====================================================
        VISIBLE MARBLES + NAMES
        =====================================================
    */

    const visibleMarbles=
        marble
            .filter(m=>
                !m.finished&&
                m.s>=me.s-8&&
                m.s<=me.s+280
            )
            .map(m=>{

                const pos=
                    marbleWorldPosition(m);

                const p=
                    project3D(
                        pos.x,
                        pos.y,
                        fpX,
                        fpY,
                        fpAngle,
                        cameraHeight
                    );

                return{
                    m,
                    p
                };
            })
            .filter(x=>x.p)
            .sort(
                (a,b)=>
                    b.p.depth-
                    a.p.depth
            );

    /*
        Draw farthest marbles first.
    */

    for(const item of visibleMarbles){

        const m=item.m;
        const p=item.p;

        const r=
            Math.max(
                2,
                m.radius*
                p.scale*
                1.25
            );

        draw3DMarble(
            p.x,
            p.y,
            r,
            m.color,
            m.id===selected
        );

        /*
            NAME ABOVE MARBLE
        */

        drawMarbleLabel(
            m,
            p.x,
            p.y,
            r,
            m.id===selected
        );
    }

    /*
        =====================================================
        PLAYER MARBLE
        =====================================================
    */

    const bottomR=
        Math.min(W,H)*.075;

    draw3DMarble(
        W/2,
        H*.88,
        bottomR,
        me.color,
        false
    );

    /*
        Player's name always visible.
    */

    ctx.save();

    ctx.font=
        "bold 20px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="bottom";

    ctx.lineWidth=6;

    ctx.strokeStyle=
        "rgba(0,0,0,.92)";

    ctx.strokeText(
        me.name,
        W/2,
        H*.88-
        bottomR-
        12
    );

    ctx.fillStyle=me.color;

    ctx.fillText(
        me.name,
        W/2,
        H*.88-
        bottomR-
        12
    );

    ctx.restore();

    /*
        Camera label.
    */

    ctx.fillStyle=
        "rgba(255,255,255,.75)";

    ctx.font=
        "bold 13px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "FIRST PERSON",
        W/2,
        30
    );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    if(!marble.length)
        return;

    const me=
        marble.find(
            m=>m.id===selected
        )||
        marble[0];

    const sorted=
        [...marble]
            .sort(
                (a,b)=>b.s-a.s
            );

    const place=
        sorted.indexOf(me)+1;

    document.getElementById(
        "raceInfo"
    ).innerHTML=
        `<strong>${me.name}</strong>
         &nbsp; Position: ${place}/8
         &nbsp; Speed: ${Math.max(
             0,
             me.v
         ).toFixed(1)}`;

    document.getElementById(
        "cameraInfo"
    ).textContent=
        firstPerson
            ? "First person"
            : "3D spectator";
}


/* =========================================================
   DRAW
========================================================= */

function clearCanvas(){

    ctx.fillStyle="#07101b";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


function draw(){

    if(state==="menu"){

        clearCanvas();

        return;
    }

    if(
        state==="race"||
        state==="countdown"
    ){

        if(firstPerson)
            drawFirstPerson();
        else
            drawSpectator();

        updateHUD();

        /*
            Camera impact flash.
        */

        if(cameraShake>.01){

            ctx.fillStyle=
                `rgba(
                    255,
                    255,
                    255,
                    ${cameraShake*.035}
                )`;

            ctx.fillRect(
                0,
                0,
                W,
                H
            );
        }

        return;
    }

    if(state==="finish"){

        drawSpectator();
    }
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

    /*
        Clamp delta time so switching tabs doesn't
        launch marbles across the track.
    */

    const dt=
        Math.min(
            .033,
            Math.max(
                0,
                (now-lastTime)/1000
            )
        );

    lastTime=now;

    updateRace(dt);

    if(
        state==="race"||
        state==="countdown"
    ){

        updateCameras(dt);
    }

    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        /*
            V = camera
        */

        if(e.code==="KeyV"){

            if(state!=="menu"){

                firstPerson=
                    !firstPerson;

                resetCameras();
            }
        }

        /*
            R = restart
        */

        if(e.code==="KeyR"){

            if(state!=="menu")
                restart();
        }

        /*
            M = mute
        */

        if(e.code==="KeyM"){

            muted=!muted;

            if(!muted)
                tone(660,.08);
        }

        /*
            SPACE = pause
        */

        if(e.code==="Space"){

            if(state==="race"){

                paused=!paused;

                document.getElementById(
                    "message"
                ).textContent=
                    paused
                        ? "PAUSED"
                        : "";
            }

            e.preventDefault();
        }
    }
);


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick=start;


document.getElementById(
    "nextBtn"
).onclick=()=>{

    trackIndex=
        (
            trackIndex+1
        )%
        trackNames.length;

    trackSelect.value=
        trackIndex;

    document.getElementById(
        "finishPanel"
    ).classList.add("hidden");

    setupMenu();
};


document.getElementById(
    "menuBtn"
).onclick=()=>{

    state="menu";

    paused=false;

    setupMenu();
};


/* =========================================================
   INITIAL STATE
========================================================= */

setupMenu();

</script>

</body>
</html>
