<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marble Mayhem Deluxe</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,760px);max-height:92vh;overflow:auto;background:rgba(7,12,22,.94);border:2px solid #52627b;border-radius:18px;padding:26px;box-shadow:0 20px 80px rgba(0,0,0,.6);z-index:10}
h1{margin:0 0 8px;text-align:center;font-size:42px;letter-spacing:2px}
h2{margin:4px 0 18px;text-align:center}
.subtitle{text-align:center;color:#aeb9ca;margin-bottom:22px}
.hidden{display:none!important}
.racers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.racer{border:2px solid #354154;background:#121b2a;border-radius:12px;padding:10px;cursor:pointer;text-align:center;transition:.15s}
.racer:hover{transform:translateY(-2px);border-color:#7f8ea8}
.racer.selected{border-color:#fff;background:#1c293c;box-shadow:0 0 18px rgba(255,255,255,.18)}
.dot{width:34px;height:34px;border-radius:50%;margin:0 auto 7px;border:2px solid rgba(255,255,255,.65);box-shadow:inset -7px -7px 12px rgba(0,0,0,.4),inset 4px 4px 8px rgba(255,255,255,.45)}
.racer-name{font-weight:bold;font-size:13px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
select,input{width:100%;padding:11px;border-radius:9px;border:1px solid #46546a;background:#111a29;color:#fff;font-size:16px}
label{font-size:12px;color:#9eabc0;display:block;margin-bottom:5px}
button{border:0;border-radius:10px;padding:13px 18px;background:#f0f3f7;color:#101722;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.08)}
.primary{width:100%;font-size:20px;margin-top:10px}
.small{text-align:center;color:#8794a8;font-size:12px;margin-top:14px;line-height:1.5}
#hud{position:absolute;z-index:5;left:14px;right:14px;top:12px;display:none;pointer-events:none}
.hudbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{background:rgba(5,10,18,.72);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 11px;font-size:13px;backdrop-filter:blur(5px)}
#raceInfo{text-align:left}
#cameraInfo{text-align:right}
#message{position:absolute;left:50%;top:20%;transform:translateX(-50%);z-index:6;text-align:center;font-weight:bold;font-size:38px;text-shadow:0 3px 15px #000;pointer-events:none}
#finishPanel{text-align:center}
.results{margin:18px 0;border-radius:10px;overflow:hidden;border:1px solid #354154}
.result{display:flex;justify-content:space-between;padding:10px 14px;background:#111a29;border-bottom:1px solid #293446}
.result:last-child{border-bottom:0}
.result.you{background:#24324a}
#betInfo{margin-top:10px;color:#aeb9ca;font-size:13px}
@media(max-width:650px){
 .racers{grid-template-columns:repeat(2,1fr)}
 .controls{grid-template-columns:1fr}
 h1{font-size:31px}
 .panel{padding:18px}
}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>

<div id="menu" class="panel">
<h1>MARBLE MAYHEM DELUXE</h1>
<div class="subtitle">Pick your marble. Survive the track. Win the race.</div>

<h2>Select Your Marble</h2>
<div id="racers" class="racers"></div>

<div class="controls">
<div>
<label for="trackSelect">Track</label>
<select id="trackSelect"></select>
</div>
<div>
<label for="bet">Bet</label>
<input id="bet" type="number" min="0" step="1" value="25">
</div>
</div>

<div id="bankText" style="text-align:center;margin-bottom:10px">Bank: $100</div>
<div id="betInfo">You receive your bet back plus winnings if your marble finishes first.</div>
<button id="startBtn" class="primary">START RACE</button>
<div class="small">During a race: <b>V</b> camera • <b>R</b> restart • <b>M</b> mute • <b>SPACE</b> pause</div>
</div>

<div id="hud">
<div class="hudbar">
<div id="raceInfo" class="badge"></div>
<div id="cameraInfo" class="badge">CAMERA: FIRST PERSON</div>
</div>
</div>

<div id="message"></div>

<div id="finishPanel" class="panel hidden">
<h1>FINISH!</h1>
<h2 id="winnerText"></h2>
<div id="results" class="results"></div>
<div id="payoutText"></div>
<button id="nextBtn" class="primary">NEXT RACE</button>
<button id="menuBtn" style="width:100%;margin-top:8px">MAIN MENU</button>
</div>
</div>

<script>
const cv=document.getElementById("c");
const x=cv.getContext("2d");

let W=window.innerWidth;
let H=window.innerHeight;
cv.width=W;
cv.height=H;

const racerData=[
 {id:"fetson",name:"fetson",color:"#e74c3c"},
 {id:"doober",name:"doober",color:"#3498db"},
 {id:"fadgeril",name:"fadgeril",color:"#f1c40f"},
 {id:"scrappy",name:"scrappy doo",color:"#9b59b6"},
 {id:"scubadaa",name:"scubadaa",color:"#1abc9c"},
 {id:"pisswolf",name:"pisswolf",color:"#f39c12"},
 {id:"malty",name:"malty",color:"#e67e22"},
 {id:"morning",name:"morning roll",color:"#ecf0f1"}
];

let marble=[];
let track=[];
let obstacles=[];
let selected="fetson";
let trackIndex=0;
let state="menu";
let paused=false;
let muted=false;
let firstPerson=true;
let bank=100;
let currentBet=25;
let raceTime=0;
let countdown=0;
let finishOrder=[];
let cameraShake=0;
let lastTime=0;

const trackNames=[
 "Neon Run","Dust Devil","Marble Mountain","The Snake","Turbo Tunnel",
 "Crystal Coast","Red Canyon","The Gauntlet","Moon Rock","Lava Loop",
 "Blue Thunder","Pinball Ridge","Green Machine","The Spiral","Sunset Sprint",
 "Chaos Valley","Rocket Road","Frostbite","Thunder Alley","Golden Mile",
 "Black Diamond","Jungle Run","Final Frenzy","Mayhem Grand Prix"
];

function resize(){
 W=window.innerWidth;
 H=window.innerHeight;
 cv.width=W;
 cv.height=H;
}
window.addEventListener("resize",resize);

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function seededRandom(seed){
 let s=seed%2147483647;
 if(s<=0)s+=2147483646;
 return function(){
   s=s*16807%2147483647;
   return (s-1)/2147483646;
 };
}

function buildTrack(seed){
 const rnd=seededRandom(seed);
 track=[];
 obstacles=[];

 const total=1800+Math.floor(rnd()*700);
 let px=0;
 let py=0;
 let angle=0;

 for(let i=0;i<total;i++){
   const turn=Math.sin(i*.021+seed)*.026+(rnd()-.5)*.018;
   angle+=turn;
   px+=Math.cos(angle)*4.2;
   py+=Math.sin(angle)*4.2;

   if(i<180){
     angle*=.985;
   }

   track.push({x:px,y:py});
 }

 // Smooth the generated track
 for(let pass=0;pass<2;pass++){
   const copy=track.map(p=>({x:p.x,y:p.y}));
   for(let i=1;i<track.length-1;i++){
     track[i].x=(copy[i-1].x+copy[i].x*2+copy[i+1].x)/4;
     track[i].y=(copy[i-1].y+copy[i].y*2+copy[i+1].y)/4;
   }
 }

 for(let i=150;i<track.length-80;i+=Math.floor(75+rnd()*80)){
   if(rnd()<.72){
     obstacles.push({
       s:i,
       side:rnd()>.5?1:-1,
       type:rnd()<.5?"bumper":"block",
       size:8+rnd()*8
     });
   }
 }

 return track;
}

function sample(s){
 if(!track.length)return {x:0,y:0};
 s=clamp(s,0,track.length-1);
 const i=Math.floor(s);
 const f=s-i;
 const a=track[i];
 const b=track[Math.min(i+1,track.length-1)];
 return {
   x:lerp(a.x,b.x,f),
   y:lerp(a.y,b.y,f)
 };
}

function tan(s){
 const a=sample(clamp(s-1,0,track.length-1));
 const b=sample(clamp(s+1,0,track.length-1));
 const dx=b.x-a.x;
 const dy=b.y-a.y;
 const len=Math.hypot(dx,dy)||1;
 return {x:dx/len,y:dy/len};
}

function makeMarbles(){
 marble=racerData.map((r,i)=>({
   ...r,
   s:-i*9,
   v:0,
   lane:(i-3.5)*7,
   finished:false,
   finishTime:0,
   wobble:Math.random()*Math.PI*2
 }));
}

function setupMenu(){
 const box=document.getElementById("racers");
 box.innerHTML="";

 racerData.forEach(r=>{
   const el=document.createElement("div");
   el.className="racer"+(r.id===selected?" selected":"");
   el.dataset.id=r.id;
   el.innerHTML='<div class="dot" style="background:'+r.color+'"></div><div class="racer-name">'+r.name+"</div>";
   el.addEventListener("click",()=>{
     selected=r.id;
     document.querySelectorAll(".racer").forEach(a=>a.classList.remove("selected"));
     el.classList.add("selected");
   });
   box.appendChild(el);
 });

 const ts=document.getElementById("trackSelect");
 ts.innerHTML="";
 trackNames.forEach((name,i)=>{
   const o=document.createElement("option");
   o.value=i;
   o.textContent=(i+1)+". "+name;
   ts.appendChild(o);
 });

 ts.value=trackIndex;
 document.getElementById("bankText").textContent="Bank: $"+bank;
}

function tone(freq=440,duration=.08){
 if(muted)return;
 try{
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return;
   const ac=new AC();
   const osc=ac.createOscillator();
   const gain=ac.createGain();
   osc.frequency.value=freq;
   gain.gain.value=.035;
   osc.connect(gain);
   gain.connect(ac.destination);
   osc.start();
   gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);
   osc.stop(ac.currentTime+duration);
 }catch(e){}
}

function start(){
 const betValue=Math.floor(Number(document.getElementById("bet").value)||0);
 currentBet=clamp(betValue,0,bank);
 bank-=currentBet;

 trackIndex=parseInt(document.getElementById("trackSelect").value,10)||0;
 buildTrack(trackIndex+1);
 makeMarbles();

 state="countdown";
 paused=false;
 raceTime=0;
 countdown=3.2;
 finishOrder=[];
 cameraShake=0;

 document.getElementById("menu").classList.add("hidden");
 document.getElementById("finishPanel").classList.add("hidden");
 document.getElementById("hud").style.display="block";
 document.getElementById("message").textContent="3";
 tone(440,.12);
}

function restart(){
 if(state==="menu")return;
 const oldBet=currentBet;
 bank+=oldBet;
 document.getElementById("bet").value=oldBet;
 start();
}

function finishRace(){
 state="finish";
 paused=false;

 finishOrder.sort((a,b)=>a.finishTime-b.finishTime);

 const winner=finishOrder[0]||marble.slice().sort((a,b)=>b.s-a.s)[0];
 const player=marble.find(m=>m.id===selected);

 let payout=0;
 if(winner&&winner.id===selected){
   payout=currentBet*3;
   bank+=payout;
 }

 document.getElementById("winnerText").textContent=
   "Winner: "+(winner?winner.name:"Nobody");

 const results=document.getElementById("results");
 results.innerHTML="";

 finishOrder.forEach((m,i)=>{
   const row=document.createElement("div");
   row.className="result"+(m.id===selected?" you":"");
   row.innerHTML="<span>"+(i+1)+". "+m.name+"</span><span>"+m.finishTime.toFixed(2)+"s</span>";
   results.appendChild(row);
 });

 marble.filter(m=>!finishOrder.includes(m))
   .sort((a,b)=>b.s-a.s)
   .forEach((m,i)=>{
     const row=document.createElement("div");
     row.className="result"+(m.id===selected?" you":"");
     row.innerHTML="<span>"+(finishOrder.length+i+1)+". "+m.name+"</span><span>DNF</span>";
     results.appendChild(row);
   });

 document.getElementById("payoutText").textContent=
   payout>0
   ? "Your marble won! Payout: $"+payout+" | Bank: $"+bank
   : "Bet lost. Bank: $"+bank;

 document.getElementById("finishPanel").classList.remove("hidden");
 document.getElementById("hud").style.display="none";
 document.getElementById("message").textContent="";
 tone(880,.3);
}

function nextTrack(){
 trackIndex=(trackIndex+1)%trackNames.length;
 document.getElementById("trackSelect").value=trackIndex;
 document.getElementById("finishPanel").classList.add("hidden");
 document.getElementById("menu").classList.remove("hidden");
 setupMenu();
}

function updateRace(dt){
 if(state==="countdown"){
   countdown-=dt;

   if(countdown<=0){
     state="race";
     document.getElementById("message").textContent="GO!";
     tone(880,.12);
     setTimeout(()=>{
       if(state==="race")document.getElementById("message").textContent="";
     },500);
   }else{
     document.getElementById("message").textContent=Math.ceil(countdown);
   }
   return;
 }

 if(state!=="race"||paused)return;

 raceTime+=dt;

 const leaderDistance=track.length-30;

 marble.forEach((m,index)=>{
   if(m.finished)return;

   const targetSpeed=4.2+
     Math.sin(raceTime*.8+m.wobble)*.25+
     (index%3)*.08;

   const acceleration=(targetSpeed-m.v)*1.7;
   m.v+=acceleration*dt;

   // Small racer-to-racer variation
   m.v+=Math.sin(raceTime*1.3+m.wobble)*.025;

   // Obstacles
   const t=tan(m.s);
   const p=sample(m.s);

   obstacles.forEach(o=>{
     const d=Math.abs(o.s-m.s);
     if(d<7){
       const op=sample(o.s);
       const dx=op.x-p.x;
       const dy=op.y-p.y;
       const side=-dx*t.y+dy*t.x;

       if(Math.abs(side-m.lane)<o.size+5){
         m.v*=.72;
         cameraShake=Math.max(cameraShake,.12);
       }
     }
   });

   m.v=clamp(m.v,1.5,6.2);
   m.s+=m.v*dt;

   // Slightly keep racers from wandering too far
   m.lane*=.985;

   if(m.s>=leaderDistance){
     m.finished=true;
     m.finishTime=raceTime;
     finishOrder.push(m);
     tone(520+finishOrder.length*60,.08);
   }
 });

 if(finishOrder.length>=marble.length-1){
   setTimeout(()=>{
     if(state==="race")finishRace();
   },700);
 }
}

function drawBackground(){
 const horizon=H*.36;

 const sky=x.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,"#050a13");
 sky.addColorStop(.65,"#10263d");
 sky.addColorStop(1,"#29425a");

 x.fillStyle=sky;
 x.fillRect(0,0,W,horizon);

 x.fillStyle="#102516";
 x.fillRect(0,horizon,W,H-horizon);

 // Distant hills
 x.fillStyle="#162c25";
 x.beginPath();
 x.moveTo(0,horizon);
 for(let i=0;i<=20;i++){
   const px=i*W/20;
   const py=horizon-20-Math.sin(i*1.7+trackIndex)*25;
   x.lineTo(px,py);
 }
 x.lineTo(W,horizon);
 x.closePath();
 x.fill();
}

function drawFirstPerson(){
 drawBackground();

 const me=marble.find(m=>m.id===selected)||marble[0];
 if(!me||!track.length)return;

 const cameraPoint=sample(me.s);
 const tangent=tan(me.s);

 const horizonY=H*.36;
 const focal=H*.82;
 const cameraHeight=6;
 const roadWidth=78;

 function project(wx,wy,sideOffset=0){
   const dx=wx-cameraPoint.x;
   const dy=wy-cameraPoint.y;

   const forwardX=tangent.x;
   const forwardY=tangent.y;

   const rightX=-forwardY;
   const rightY=forwardX;

   const forward=dx*forwardX+dy*forwardY;
   const side=dx*rightX+dy*rightY+sideOffset;

   if(forward<1)return null;

   const scale=focal/forward;

   return {
     x:W/2+side*scale,
     y:horizonY+cameraHeight*scale,
     scale:scale,
     depth:forward
   };
 }

 const segments=[];
 const begin=Math.max(0,Math.floor(me.s)-2);
 const end=Math.min(track.length-2,Math.floor(me.s)+145);

 for(let i=begin;i<end;i++){
   const a=track[i];
   const b=track[i+1];
   const ta=tan(i);
   const tb=tan(i+1);

   const aL={x:a.x-ta.y*roadWidth/2,y:a.y+ta.x*roadWidth/2};
   const aR={x:a.x+ta.y*roadWidth/2,y:a.y-ta.x*roadWidth/2};
   const bL={x:b.x-tb.y*roadWidth/2,y:b.y+tb.x*roadWidth/2};
   const bR={x:b.x+tb.y*roadWidth/2,y:b.y-tb.x*roadWidth/2};

   const p1=project(aL.x,aL.y);
   const p2=project(aR.x,aR.y);
   const p3=project(bR.x,bR.y);
   const p4=project(bL.x,bL.y);

   if(p1&&p2&&p3&&p4){
     segments.push({p1,p2,p3,p4,i});
   }
 }

 // Far road first
 for(let i=segments.length-1;i>=0;i--){
   const r=segments[i];

   x.beginPath();
   x.moveTo(r.p1.x,r.p1.y);
   x.lineTo(r.p2.x,r.p2.y);
   x.lineTo(r.p3.x,r.p3.y);
   x.lineTo(r.p4.x,r.p4.y);
   x.closePath();

   x.fillStyle=Math.floor(r.i/4)%2===0?"#30353a":"#373c41";
   x.fill();

   // Road edge
   x.strokeStyle="#737a80";
   x.lineWidth=Math.max(1,r.p1.scale*.65);

   x.beginPath();
   x.moveTo(r.p1.x,r.p1.y);
   x.lineTo(r.p4.x,r.p4.y);
   x.moveTo(r.p2.x,r.p2.y);
   x.lineTo(r.p3.x,r.p3.y);
   x.stroke();

   // Center dashed line
   if(r.i%6===0){
     const cx1=(r.p1.x+r.p2.x)/2;
     const cy1=(r.p1.y+r.p2.y)/2;
     const cx2=(r.p4.x+r.p3.x)/2;
     const cy2=(r.p4.y+r.p3.y)/2;

     x.strokeStyle="rgba(255,255,255,.8)";
     x.lineWidth=Math.max(1,r.p1.scale*1.2);

     x.beginPath();
     x.moveTo(cx1,cy1);
     x.lineTo(cx2,cy2);
     x.stroke();
   }
 }

 // Draw hazards
 obstacles.forEach(o=>{
   if(o.s<me.s-5||o.s>me.s+130)return;

   const op=sample(o.s);
   const ot=tan(o.s);
   const offset=o.side*20;

   const wx=op.x-ot.y*offset;
   const wy=op.y+ot.x*offset;

   const p=project(wx,wy);
   if(!p)return;

   const size=clamp(7*p.scale,2,32);

   x.save();
   x.translate(p.x,p.y);

   if(o.type==="bumper"){
     x.fillStyle="#d33";
     x.beginPath();
     x.arc(0,-size*.45,size,0,Math.PI*2);
     x.fill();

     x.strokeStyle="#ffb0b0";
     x.lineWidth=Math.max(1,size*.15);
     x.stroke();
   }else{
     x.fillStyle="#e2a72f";
     x.fillRect(-size,-size,size*2,size*2);
     x.strokeStyle="#fff1a5";
     x.lineWidth=Math.max(1,size*.12);
     x.strokeRect(-size,-size,size*2,size*2);
   }

   x.restore();
 });

 // Other marbles
 marble.forEach(m=>{
   if(m.id===me.id)return;
   if(m.s<me.s-4)return;
   if(m.s>me.s+120)return;

   const mp=sample(m.s);
   const mt=tan(m.s);

   const wx=mp.x-mt.y*m.lane;
   const wy=mp.y+mt.x*m.lane;

   const p=project(wx,wy);
   if(!p)return;

   const radius=clamp(6*p.scale,2,30);

   x.beginPath();
   x.ellipse(
     p.x,
     p.y+radius*.55,
     radius*1.2,
     radius*.42,
     0,
     0,
     Math.PI*2
   );
   x.fillStyle="rgba(0,0,0,.38)";
   x.fill();

   const g=x.createRadialGradient(
     p.x-radius*.35,
     p.y-radius*.4,
     radius*.1,
     p.x,
     p.y,
     radius
   );

   g.addColorStop(0,"#fff");
   g.addColorStop(.18,m.color);
   g.addColorStop(1,"#111");

   x.beginPath();
   x.arc(p.x,p.y,radius,0,Math.PI*2);
   x.fillStyle=g;
   x.fill();

   if(radius>11){
     x.fillStyle="#fff";
     x.font=Math.max(9,radius*.85)+"px Arial";
     x.textAlign="center";
     x.fillText(m.name,p.x,p.y-radius-5);
   }
 });

 // Speed streaks
 if(me.v>4){
   const amount=clamp((me.v-4)/2.2,0,1);

   x.strokeStyle="rgba(255,255,255,"+(amount*.10)+")";
   x.lineWidth=1.5;

   for(let i=0;i<10;i++){
     const sx=Math.random()*W;
     const sy=horizonY+Math.random()*(H-horizonY);
     x.beginPath();
     x.moveTo(sx,sy);
     x.lineTo(
       W/2+(sx-W/2)*.7,
       sy-20-amount*30
     );
     x.stroke();
   }
 }

 // Lower vignette / cockpit effect
 const vignette=x.createLinearGradient(0,H*.68,0,H);
 vignette.addColorStop(0,"rgba(0,0,0,0)");
 vignette.addColorStop(1,"rgba(0,0,0,.72)");
 x.fillStyle=vignette;
 x.fillRect(0,H*.65,W,H*.35);

 // Reticle
 x.strokeStyle="rgba(255,255,255,.35)";
 x.lineWidth=1;

 x.beginPath();
 x.moveTo(W/2-7,H*.59);
 x.lineTo(W/2+7,H*.59);
 x.moveTo(W/2,H*.59-7);
 x.lineTo(W/2,H*.59+7);
 x.stroke();

 // Small camera shake
 if(cameraShake>0){
   cameraShake*=.9;
 }
}

function drawSpectator(){
 if(!track.length)return;

 const me=marble.find(m=>m.id===selected)||marble[0];
 const p=sample(me.s);

 const scale=Math.min(W,H)/500;

 x.save();
 x.translate(W/2-p.x*scale,H/2-p.y*scale);
 x.scale(scale,scale);

 // Grass
 const minX=Math.min(...track.map(a=>a.x))-100;
 const maxX=Math.max(...track.map(a=>a.x))+100;
 const minY=Math.min(...track.map(a=>a.y))-100;
 const maxY=Math.max(...track.map(a=>a.y))+100;

 x.fillStyle="#102516";
 x.fillRect(minX,minY,maxX-minX,maxY-minY);

 // Track
 x.beginPath();
 track.forEach((p,i)=>{
   if(i===0)x.moveTo(p.x,p.y);
   else x.lineTo(p.x,p.y);
 });
 x.strokeStyle="#15181c";
 x.lineWidth=88;
 x.lineCap="round";
 x.lineJoin="round";
 x.stroke();

 x.strokeStyle="#4c5258";
 x.lineWidth=76;
 x.stroke();

 // Obstacles
 obstacles.forEach(o=>{
   const p=sample(o.s);
   const t=tan(o.s);
   const ox=p.x-t.y*o.side*22;
   const oy=p.y+t.x*o.side*22;

   x.fillStyle=o.type==="bumper"?"#d33":"#d99d2b";
   x.beginPath();
   x.arc(ox,oy,o.size,0,Math.PI*2);
   x.fill();
 });

 // Marbles
 marble.forEach(m=>{
   const p=sample(m.s);
   const t=tan(m.s);
   const mx=p.x-t.y*m.lane;
   const my=p.y+t.x*m.lane;

   x.beginPath();
   x.arc(mx,my,9,0,Math.PI*2);
   x.fillStyle=m.color;
   x.fill();

   if(m.id===selected){
     x.strokeStyle="#fff";
     x.lineWidth=2;
     x.stroke();
   }
 });

 x.restore();
}

function draw(){
 x.clearRect(0,0,W,H);

 if(state==="race"||state==="countdown"){
   if(firstPerson)drawFirstPerson();
   else drawSpectator();
 }else{
   // Menu background
   x.fillStyle="#07111f";
   x.fillRect(0,0,W,H);

   const g=x.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*.7);
   g.addColorStop(0,"#162b45");
   g.addColorStop(1,"#050b14");
   x.fillStyle=g;
   x.fillRect(0,0,W,H);
 }

 if(paused&&state==="race"){
   x.fillStyle="rgba(0,0,0,.55)";
   x.fillRect(0,0,W,H);
   x.fillStyle="#fff";
   x.font="bold 42px Arial";
   x.textAlign="center";
   x.fillText("PAUSED",W/2,H/2);
 }

 if(state==="race"||state==="countdown"){
   const me=marble.find(m=>m.id===selected);

   document.getElementById("raceInfo").textContent=
     (trackIndex+1)+". "+trackNames[trackIndex]+
     "  |  "+(me?me.name:"");

   document.getElementById("cameraInfo").textContent=
     firstPerson?"CAMERA: FIRST PERSON":"CAMERA: SPECTATOR";
 }
}

function loop(t){
 if(!lastTime)lastTime=t;

 let dt=(t-lastTime)/1000;
 lastTime=t;

 dt=clamp(dt,0,.05);

 updateRace(dt);
 draw();

 requestAnimationFrame(loop);
}

document.getElementById("startBtn").addEventListener("click",start);

document.getElementById("nextBtn").addEventListener("click",nextTrack);

document.getElementById("menuBtn").addEventListener("click",()=>{
 state="menu";
 paused=false;
 document.getElementById("finishPanel").classList.add("hidden");
 document.getElementById("hud").style.display="none";
 document.getElementById("menu").classList.remove("hidden");
 setupMenu();
});

window.addEventListener("keydown",e=>{
 if(e.key.toLowerCase()==="v"){
   firstPerson=!firstPerson;
   return;
 }

 if(e.key.toLowerCase()==="r"){
   if(state==="race"||state==="countdown")restart();
   return;
 }

 if(e.key.toLowerCase()==="m"){
   muted=!muted;
   return;
 }

 if(e.code==="Space"){
   if(state==="race"){
     e.preventDefault();
     paused=!paused;
   }
 }
});

buildTrack(1);
makeMarbles();
setupMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
