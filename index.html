<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Mayhem Deluxe</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070b12;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#080d15;
}

.panel{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92vw,720px);
    max-height:90vh;
    overflow:auto;
    padding:28px;
    border-radius:18px;
    background:rgba(8,12,20,.94);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 20px 70px rgba(0,0,0,.6);
    z-index:10;
}

.panel h1{
    margin:0 0 8px;
    font-size:38px;
    text-align:center;
    letter-spacing:2px;
}

.subtitle{
    text-align:center;
    color:#9eabbc;
    margin-bottom:24px;
}

.hidden{
    display:none!important;
}

.row{
    display:flex;
    gap:14px;
    align-items:center;
    margin:12px 0;
}

label{
    color:#b9c4d3;
}

select,
input{
    flex:1;
    padding:11px 13px;
    border-radius:9px;
    border:1px solid #394354;
    background:#121a27;
    color:white;
    font-size:15px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    filter:brightness(1.15);
    transform:translateY(-1px);
}

#startBtn{
    width:100%;
    margin-top:18px;
    font-size:18px;
    background:#16a34a;
}

.racerGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin:15px 0 20px;
}

.racer{
    padding:10px;
    border-radius:9px;
    background:#111827;
    border:1px solid #273244;
    cursor:pointer;
}

.racer.selected{
    border-color:#fff;
    box-shadow:0 0 0 2px rgba(255,255,255,.12);
}

.dot{
    width:15px;
    height:15px;
    display:inline-block;
    border-radius:50%;
    margin-right:8px;
    vertical-align:-2px;
}

#hud{
    position:absolute;
    left:15px;
    top:15px;
    z-index:4;
    pointer-events:none;
    background:rgba(4,7,12,.58);
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    padding:10px 14px;
    line-height:1.5;
    backdrop-filter:blur(5px);
}

#message{
    position:absolute;
    left:50%;
    top:20%;
    transform:translateX(-50%);
    z-index:5;
    font-size:76px;
    font-weight:900;
    text-shadow:0 5px 25px #000;
    pointer-events:none;
}

#controls{
    position:absolute;
    right:15px;
    bottom:15px;
    z-index:4;
    padding:9px 13px;
    background:rgba(4,7,12,.55);
    border-radius:9px;
    color:#9eabbc;
    font-size:13px;
}

#finishPanel{
    width:min(92vw,600px);
}

#winnerText{
    font-size:30px;
    font-weight:bold;
    text-align:center;
    margin:12px 0 20px;
}

.result{
    display:flex;
    justify-content:space-between;
    padding:8px 10px;
    margin:4px 0;
    background:#101827;
    border-radius:7px;
}

#payoutText{
    margin-top:15px;
    text-align:center;
    font-size:18px;
    color:#6ee7b7;
}

.finishButtons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.finishButtons button{
    flex:1;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="menu" class="panel">
    <h1>MARBLE MAYHEM DELUXE</h1>
    <div class="subtitle">Physics-based marble racing</div>

    <h3>Choose your marble</h3>
    <div id="racers" class="racerGrid"></div>

    <div class="row">
        <label>Track</label>
        <select id="trackSelect"></select>
    </div>

    <div class="row">
        <label>Bet</label>
        <input id="bet" type="number" min="0" value="25">
    </div>

    <div class="row">
        <label>Bank</label>
        <strong id="bankText">$100</strong>
    </div>

    <button id="startBtn">START RACE</button>
</div>

<div id="hud" style="display:none">
    <div id="raceInfo"></div>
    <div id="cameraInfo"></div>
</div>

<div id="message"></div>

<div id="controls">
    V = camera &nbsp; R = restart &nbsp; M = mute &nbsp; SPACE = pause
</div>

<div id="finishPanel" class="panel hidden">
    <h1>RACE FINISHED</h1>
    <div id="winnerText"></div>
    <div id="results"></div>
    <div id="payoutText"></div>

    <div class="finishButtons">
        <button id="nextBtn">NEXT TRACK</button>
        <button id="menuBtn">MENU</button>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function seededRandom(seed){
    let x=Math.sin(seed*999.123)*43758.5453123;
    return ()=> {
        x=Math.sin(x)*43758.5453123;
        return x-Math.floor(x);
    };
}

/* =========================================================
   RACERS / TRACKS
========================================================= */

const racerData=[
    {id:"fetson",name:"fetson",color:"#e74c3c"},
    {id:"doober",name:"doober",color:"#3498db"},
    {id:"fadgeril",name:"fadgeril",color:"#f1c40f"},
    {id:"scrappy",name:"scrappy doo",color:"#9b59b6"},
    {id:"scubadaa",name:"scubadaa",color:"#1abc9c"},
    {id:"pisswolf",name:"pisswolf",color:"#f39c12"},
    {id:"malty",name:"malty",color:"#e67e22"},
    {id:"morning",name:"morning roll",color:"#ecf0f1"}
];

const trackNames=[
    "Neon Run",
    "Dust Devil",
    "Marble Mountain",
    "The Snake",
    "Turbo Tunnel",
    "Crystal Coast",
    "Red Canyon",
    "The Gauntlet",
    "Moon Rock",
    "Lava Loop",
    "Blue Thunder",
    "Pinball Ridge",
    "Green Machine",
    "The Spiral",
    "Sunset Sprint",
    "Chaos Valley",
    "Rocket Road",
    "Frostbite",
    "Thunder Alley",
    "Golden Mile",
    "Black Diamond",
    "Jungle Run",
    "Final Frenzy",
    "Mayhem Grand Prix"
];

/* =========================================================
   GAME STATE
========================================================= */

let marble=[];
let track=[];
let obstacles=[];

let selected="fetson";
let trackIndex=0;

let state="menu";
let paused=false;
let muted=false;
let firstPerson=true;

let bank=100;
let currentBet=25;

let raceTime=0;
let countdown=0;
let finishOrder=[];

let cameraShake=0;
let lastTime=0;

/*
    Track dimensions.

    IMPORTANT:
    The marbles are NOT constrained to the centreline.

    lane = actual lateral distance from the centre of the road.
    laneV = actual lateral velocity.

    The wall therefore behaves like a real collision surface.
*/
const ROAD_HALF=50;
const MARBLE_RADIUS=4.2;
const WALL_RESTITUTION=.58;

/* =========================================================
   MENU
========================================================= */

const racersEl=document.getElementById("racers");

racerData.forEach(r=>{
    const el=document.createElement("div");
    el.className="racer"+(r.id===selected?" selected":"");

    el.innerHTML=
        `<span class="dot" style="background:${r.color}"></span>${r.name}`;

    el.onclick=()=>{
        selected=r.id;
        document.querySelectorAll(".racer")
            .forEach(x=>x.classList.remove("selected"));
        el.classList.add("selected");
    };

    racersEl.appendChild(el);
});

const trackSelect=document.getElementById("trackSelect");

trackNames.forEach((name,i)=>{
    const opt=document.createElement("option");
    opt.value=i;
    opt.textContent=(i+1)+". "+name;
    trackSelect.appendChild(opt);
});

function setupMenu(){
    document.getElementById("menu").classList.remove("hidden");
    document.getElementById("finishPanel").classList.add("hidden");
    document.getElementById("hud").style.display="none";
    document.getElementById("message").textContent="";
    updateBank();
}

function updateBank(){
    document.getElementById("bankText").textContent="$"+bank.toFixed(0);
}

/* =========================================================
   TRACK GENERATION
========================================================= */

function buildTrack(seed){

    const rnd=seededRandom(seed*123.17);

    track=[];
    obstacles=[];

    const total=1850+Math.floor(rnd()*550);

    let px=0;
    let py=0;
    let angle=0;

    /*
        This creates a physical course rather than a straight
        procedural spline. There are broad corners, tighter
        corners and changing curvature.
    */

    for(let i=0;i<total;i++){

        let turn=
            Math.sin(i*.017+seed)*.034+
            Math.sin(i*.041+seed*2.7)*.018+
            (rnd()-.5)*.016;

        if(i<180){
            turn*=.25;
        }

        angle+=turn;

        const step=4.2;

        px+=Math.cos(angle)*step;
        py+=Math.sin(angle)*step;

        track.push({
            x:px,
            y:py
        });
    }

    /* Smooth the centreline slightly. */
    for(let pass=0;pass<3;pass++){

        const copy=track.map(p=>({x:p.x,y:p.y}));

        for(let i=1;i<track.length-1;i++){

            track[i].x=
                (copy[i-1].x+
                 copy[i].x*2+
                 copy[i+1].x)/4;

            track[i].y=
                (copy[i-1].y+
                 copy[i].y*2+
                 copy[i+1].y)/4;
        }
    }

    /*
        Physical obstacles.

        lane is the actual position across the track.
        They are no longer just speed modifiers.
    */

    for(
        let s=170;
        s<track.length-90;
        s+=Math.floor(65+rnd()*100)
    ){

        if(rnd()<.76){

            const size=7+rnd()*8;

            obstacles.push({
                s,
                lane:(rnd()>.5?1:-1)*(24+rnd()*17),
                type:rnd()<.58?"bumper":"block",
                size,
                height:8+rnd()*9,
                rot:rnd()*Math.PI*2,
                hit:false
            });
        }
    }

    /*
        Add occasional central obstacles to force actual
        collision decisions.
    */
    for(let i=0;i<5;i++){

        const s=300+Math.floor(rnd()*(track.length-450));

        obstacles.push({
            s,
            lane:(rnd()-.5)*25,
            type:"bumper",
            size:8+rnd()*5,
            height:10+rnd()*5,
            rot:rnd()*Math.PI*2,
            hit:false
        });
    }
}

/* =========================================================
   TRACK SAMPLING
========================================================= */

function sample(s){

    if(!track.length)
        return {x:0,y:0};

    s=clamp(s,0,track.length-1);

    const i=Math.floor(s);
    const f=s-i;

    const a=track[i];
    const b=track[Math.min(i+1,track.length-1)];

    return {
        x:lerp(a.x,b.x,f),
        y:lerp(a.y,b.y,f)
    };
}

function tan(s){

    const a=sample(clamp(s-2,0,track.length-1));
    const b=sample(clamp(s+2,0,track.length-1));

    const dx=b.x-a.x;
    const dy=b.y-a.y;

    const len=Math.hypot(dx,dy)||1;

    return {
        x:dx/len,
        y:dy/len
    };
}

/*
    Returns a local physical frame.

    t = direction of track
    n = direction across track
    curvature = how sharply the track is turning
*/
function trackFrame(s){

    const p=sample(s);
    const t=tan(s);

    const tp=tan(clamp(s-4,0,track.length-1));
    const tn=tan(clamp(s+4,0,track.length-1));

    const cross=
        tp.x*tn.y-
        tp.y*tn.x;

    /*
        The tangent samples are 8 track units apart,
        hence this scaling.
    */
    const curvature=cross/8;

    return {
        p,
        t,
        n:{
            x:-t.y,
            y:t.x
        },
        curvature
    };
}

/* =========================================================
   MARBLES
========================================================= */

function makeMarbles(){

    /*
        These are physical properties rather than target speeds.

        acceleration:
            how strongly the marble accelerates

        grip:
            resistance to sideways sliding

        bounce:
            collision restitution

        mass:
            affects marble-to-marble collisions
    */

    const traits=[
        {accel:3.45,grip:1.75,bounce:.76,mass:1.00},
        {accel:3.65,grip:1.55,bounce:.70,mass:1.02},
        {accel:3.30,grip:1.95,bounce:.82,mass:.96},
        {accel:3.55,grip:1.45,bounce:.88,mass:1.06},
        {accel:3.40,grip:1.80,bounce:.74,mass:1.00},
        {accel:3.72,grip:1.35,bounce:.68,mass:.94},
        {accel:3.25,grip:2.10,bounce:.84,mass:1.08},
        {accel:3.52,grip:1.65,bounce:.78,mass:1.01}
    ];

    marble=racerData.map((r,i)=>{

        const t=traits[i];

        return {
            ...r,

            /*
                Start side-by-side rather than on an invisible
                predetermined rail.
            */
            s:-i*5,
            lane:(i-3.5)*9,

            v:0,
            laneV:0,

            accel:t.accel,
            grip:t.grip,
            bounce:t.bounce,
            mass:t.mass,

            radius:MARBLE_RADIUS,

            spin:Math.random()*Math.PI*2,
            wobble:Math.random()*Math.PI*2,

            hitCooldown:0,

            finished:false,
            finishTime:0
        };
    });
}

/* =========================================================
   COLLISION HELPERS
========================================================= */

function wallCollision(m){

    const limit=ROAD_HALF-m.radius;

    /*
        LEFT WALL
    */
    if(m.lane>limit){

        const penetration=m.lane-limit;

        m.lane=limit-penetration*.05;

        /*
            Reverse sideways velocity.

            This is the actual wall bounce.
        */
        if(m.laneV>0){

            m.laneV=
                -m.laneV*
                WALL_RESTITUTION*
                m.bounce;

            /*
                Hitting the wall also changes forward speed.
            */
            m.v*=.80;

            /*
                A little of the collision energy gets redirected
                along the wall.
            */
            m.v+=Math.abs(m.laneV)*.035;

            m.spin+=m.laneV*.04;

            cameraShake=Math.max(cameraShake,.22);
        }
    }

    /*
        RIGHT WALL
    */
    if(m.lane<-limit){

        const penetration=-limit-m.lane;

        m.lane=-limit+penetration*.05;

        if(m.laneV<0){

            m.laneV=
                -m.laneV*
                WALL_RESTITUTION*
                m.bounce;

            m.v*=.80;
            m.v+=Math.abs(m.laneV)*.035;

            m.spin+=m.laneV*.04;

            cameraShake=Math.max(cameraShake,.22);
        }
    }
}

/*
    Physical obstacle collision.
*/
function obstacleCollisions(m){

    for(const o of obstacles){

        /*
            Ignore obstacles far away in track distance.
        */
        const ds=o.s-m.s;

        if(Math.abs(ds)>14)
            continue;

        const dl=o.lane-m.lane;

        const distance=Math.hypot(ds,dl);

        const radius=
            m.radius+
            o.size;

        if(distance>=radius)
            continue;

        if(m.hitCooldown>0)
            continue;

        /*
            Collision normal.

            nS = along the track
            nL = across the track
        */
        let nS=ds;
        let nL=dl;

        const len=Math.hypot(nS,nL)||1;

        nS/=len;
        nL/=len;

        const penetration=radius-distance;

        /*
            Push the marble out of the obstacle.
        */
        m.s-=nS*penetration*.72;
        m.lane-=nL*penetration*.72;

        /*
            Velocity toward obstacle.
        */
        const relativeVelocity=
            m.v*nS+
            m.laneV*nL;

        if(relativeVelocity<0){

            const restitution=
                o.type==="bumper"
                    ? .95
                    : .55;

            const impulse=
                -(1+restitution)*
                relativeVelocity;

            m.v+=impulse*nS*.78;
            m.laneV+=impulse*nL*.95;
        }

        /*
            Bumpers give a stronger random-looking kick.
        */
        if(o.type==="bumper"){

            const sideKick=
                (m.lane>=o.lane?1:-1)*
                (1.2+Math.random()*1.8);

            m.laneV+=sideKick;

            m.v*=.88;
        }else{

            m.v*=.72;
            m.laneV*=.82;
        }

        m.hitCooldown=.12;

        m.spin+=
            (Math.random()-.5)*
            2;

        o.hit=true;

        cameraShake=Math.max(cameraShake,.3);
    }
}

/*
    Marble-on-marble collision.

    This is important because it allows a racer to push another
    racer off its previous line.
*/
function marbleCollisions(){

    for(let i=0;i<marble.length;i++){

        const a=marble[i];

        if(a.finished)
            continue;

        for(let j=i+1;j<marble.length;j++){

            const b=marble[j];

            if(b.finished)
                continue;

            const ds=b.s-a.s;
            const dl=b.lane-a.lane;

            const dist=Math.hypot(ds,dl);

            const minDist=
                a.radius+
                b.radius;

            if(dist>=minDist)
                continue;

            let nS=ds;
            let nL=dl;

            const len=dist||.0001;

            nS/=len;
            nL/=len;

            /*
                Separate overlapping marbles.
            */
            const overlap=minDist-dist;

            const totalMass=a.mass+b.mass;

            a.s-=nS*overlap*(b.mass/totalMass);
            a.lane-=nL*overlap*(b.mass/totalMass);

            b.s+=nS*overlap*(a.mass/totalMass);
            b.lane+=nL*overlap*(a.mass/totalMass);

            /*
                Relative velocity along collision normal.
            */
            const relV=
                (b.v-a.v)*nS+
                (b.laneV-a.laneV)*nL;

            /*
                Already separating.
            */
            if(relV>0)
                continue;

            const restitution=.82;

            const impulse=
                -(1+restitution)*
                relV/
                (1/a.mass+1/b.mass);

            const impulseS=impulse*nS;
            const impulseL=impulse*nL;

            a.v-=impulseS/a.mass;
            a.laneV-=impulseL/a.mass;

            b.v+=impulseS/b.mass;
            b.laneV+=impulseL/b.mass;

            a.v*=.985;
            b.v*=.985;

            a.spin-=impulseL*.03;
            b.spin+=impulseL*.03;

            cameraShake=Math.max(cameraShake,.13);
        }
    }
}

/* =========================================================
   PHYSICS
========================================================= */

function updateRace(dt){

    if(state==="countdown"){

        countdown-=dt;

        if(countdown<=0){

            state="race";

            document.getElementById("message").textContent="GO!";

            tone(880,.12);

            setTimeout(()=>{
                if(state==="race")
                    document.getElementById("message").textContent="";
            },500);

        }else{

            document.getElementById("message").textContent=
                Math.ceil(countdown);
        }

        return;
    }

    if(state!=="race"||paused)
        return;

    raceTime+=dt;

    /*
        Slightly forgiving finish point so all racers have room
        to physically interact near the end.
    */
    const finishS=track.length-28;

    /*
        ---------------------------------------------------------
        INDIVIDUAL MARBLE PHYSICS
        ---------------------------------------------------------
    */

    for(const m of marble){

        if(m.finished)
            continue;

        m.hitCooldown=Math.max(0,m.hitCooldown-dt);

        const frame=trackFrame(m.s);

        /*
            =====================================================
            LONGITUDINAL PHYSICS
            =====================================================
        */

        /*
            Engine/rolling force.

            There is deliberately NO targetSpeed here.
        */
        let acceleration=m.accel;

        /*
            Curvature costs some forward energy.
        */
        const cornerLoad=
            Math.abs(frame.curvature)*
            m.v*
            m.v;

        acceleration-=cornerLoad*.055;

        /*
            Rolling resistance.
        */
        const drag=
            .12+
            m.v*m.v*.012;

        acceleration-=drag;

        /*
            Small variation between marbles.
            This is not a scripted speed curve.
        */
        acceleration+=
            Math.sin(m.spin*1.7+m.wobble)*
            .035;

        m.v+=acceleration*dt;

        /*
            =====================================================
            LATERAL / CORNERING PHYSICS
            =====================================================
        */

        /*
            Centrifugal force.

            Positive curvature = track turns left.
            Therefore the marble is pushed right.
        */
        const centrifugal=
            -frame.curvature*
            m.v*
            m.v*
            .18;

        /*
            Friction/grip.

            If the marble is sliding sideways, grip tries to
            reduce lane velocity, but never instantly.
        */
        const lateralFriction=
            -m.laneV*
            m.grip;

        /*
            Natural tiny movement caused by surface irregularity.
        */
        const surfaceNoise=
            Math.sin(m.s*.37+m.wobble)*
            .035;

        m.laneV+=
            (
                centrifugal+
                lateralFriction+
                surfaceNoise
            )*dt;

        /*
            Air resistance on sideways movement.
        */
        m.laneV*=Math.pow(.985,dt*60);

        m.lane+=m.laneV*dt;

        /*
            =====================================================
            WALL COLLISION
            =====================================================
        */

        wallCollision(m);

        /*
            =====================================================
            OBSTACLE COLLISION
            =====================================================
        */

        obstacleCollisions(m);

        /*
            =====================================================
            SPEED LIMITS
            =====================================================
        */

        /*
            Do not impose a target speed.

            These are merely physical safety limits to prevent
            numerical explosions after collisions.
        */
        m.v=clamp(m.v,-3.5,9.2);

        /*
            Extremely large sideways speeds are also prevented,
            but ordinary bouncing can easily produce 5+.
        */
        m.laneV=clamp(m.laneV,-11,11);

        /*
            Move forward according to actual velocity.
        */
        m.s+=m.v*dt;

        /*
            Rolling rotation.
        */
        m.spin+=
            (
                m.v*.95+
                Math.abs(m.laneV)*.18
            )*dt;

        /*
            Small amount of rolling resistance when almost stopped.
        */
        if(Math.abs(m.v)<.08){

            m.v*=.94;

            if(Math.abs(m.laneV)<.08)
                m.laneV*=.92;
        }

        /*
            FINISH
        */
        if(m.s>=finishS){

            m.finished=true;
            m.finishTime=raceTime;

            finishOrder.push(m);

            tone(
                520+
                finishOrder.length*60,
                .08
            );
        }
    }

    /*
        =========================================================
        MARBLE-TO-MARBLE COLLISIONS
        =========================================================

        These happen AFTER walls/obstacles so a marble can be
        pushed into a wall by another marble.
    */
    marbleCollisions();

    /*
        Finish when all but one have completed.
    */
    if(finishOrder.length>=marble.length-1){

        setTimeout(()=>{

            if(state==="race")
                finishRace();

        },700);
    }

    cameraShake*=Math.pow(.88,dt*60);
}

/* =========================================================
   START / RESTART
========================================================= */

function start(){

    const betValue=
        Math.floor(
            Number(
                document.getElementById("bet").value
            )||0
        );

    currentBet=clamp(
        betValue,
        0,
        bank
    );

    bank-=currentBet;

    trackIndex=
        parseInt(
            document.getElementById("trackSelect").value,
            10
        )||0;

    buildTrack(trackIndex+1);
    makeMarbles();

    state="countdown";
    paused=false;

    raceTime=0;
    countdown=3.2;

    finishOrder=[];
    cameraShake=0;

    resetCameras();

    document.getElementById("menu")
        .classList.add("hidden");

    document.getElementById("finishPanel")
        .classList.add("hidden");

    document.getElementById("hud")
        .style.display="block";

    document.getElementById("message")
        .textContent="3";

    tone(440,.12);
}

function restart(){

    if(state==="menu")
        return;

    const oldBet=currentBet;

    bank+=oldBet;

    document.getElementById("bet").value=oldBet;

    start();
}

/* =========================================================
   FINISH
========================================================= */

function finishRace(){

    state="finish";

    const ordered=
        [...finishOrder];

    marble
        .filter(m=>!ordered.includes(m))
        .sort((a,b)=>b.s-a.s)
        .forEach(m=>ordered.push(m));

    const winner=ordered[0];

    document.getElementById("winnerText").textContent=
        winner
            ? winner.name+" wins!"
            : "Race complete!";

    const results=document.getElementById("results");

    results.innerHTML="";

    ordered.forEach((m,i)=>{

        const div=document.createElement("div");

        div.className="result";

        div.innerHTML=
            `<span>${i+1}. ${m.name}</span>`+
            `<span>${m.finished ? m.finishTime.toFixed(2)+"s" : "DNF"}</span>`;

        results.appendChild(div);
    });

    let payout=0;

    if(winner && winner.id===selected){

        payout=currentBet*3;
        bank+=payout;
    }

    document.getElementById("payoutText").textContent=
        payout>0
            ? `You won $${payout}!`
            : `Bet lost: $${currentBet}`;

    updateBank();

    document.getElementById("finishPanel")
        .classList.remove("hidden");

    document.getElementById("hud")
        .style.display="none";

    document.getElementById("message")
        .textContent="";

    tone(900,.2);
}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function tone(freq,duration){

    if(muted)
        return;

    try{

        if(!audioCtx)
            audioCtx=
                new (
                    window.AudioContext||
                    window.webkitAudioContext
                )();

        const osc=
            audioCtx.createOscillator();

        const gain=
            audioCtx.createGain();

        osc.frequency.value=freq;
        osc.type="sine";

        gain.gain.setValueAtTime(
            .06,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+duration
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(
            audioCtx.currentTime+
            duration
        );

    }catch(e){}
}

/* =========================================================
   CAMERA
========================================================= */

let spectatorX=0;
let spectatorY=0;
let spectatorAngle=0;
let spectatorZoom=1;

let fpX=0;
let fpY=0;
let fpAngle=0;

function resetCameras(){

    if(!marble.length)
        return;

    const me=
        marble.find(m=>m.id===selected)||
        marble[0];

    const p=marbleWorldPosition(me);
    const t=tan(me.s);

    spectatorX=p.x;
    spectatorY=p.y;

    spectatorAngle=
        Math.atan2(t.y,t.x);

    spectatorZoom=1;

    fpX=p.x;
    fpY=p.y;

    fpAngle=
        Math.atan2(t.y,t.x);

    cameraShake=0;
}

/*
    Convert track-relative marble coordinates to actual world
    coordinates.
*/
function marbleWorldPosition(m){

    const f=trackFrame(m.s);

    return {
        x:f.p.x+f.n.x*m.lane,
        y:f.p.y+f.n.y*m.lane
    };
}

function updateCameras(dt){

    if(!marble.length)
        return;

    const me=
        marble.find(m=>m.id===selected)||
        marble[0];

    const pos=marbleWorldPosition(me);
    const t=tan(me.s);

    /*
        FIRST PERSON
    */
    fpX=lerp(fpX,pos.x,1-Math.pow(.0001,dt));
    fpY=lerp(fpY,pos.y,1-Math.pow(.0001,dt));

    const desiredAngle=
        Math.atan2(t.y,t.x);

    fpAngle=angleLerp(
        fpAngle,
        desiredAngle,
        1-Math.pow(.001,dt)
    );

    /*
        SPECTATOR

        Camera sits behind and above the selected marble.
    */
    const back=55;

    const desiredX=
        pos.x-
        t.x*back;

    const desiredY=
        pos.y-
        t.y*back;

    spectatorX=lerp(
        spectatorX,
        desiredX,
        1-Math.pow(.0005,dt)
    );

    spectatorY=lerp(
        spectatorY,
        desiredY,
        1-Math.pow(.0005,dt)
    );

    const desiredSpectatorAngle=
        Math.atan2(
            pos.y-spectatorY,
            pos.x-spectatorX
        );

    spectatorAngle=angleLerp(
        spectatorAngle,
        desiredSpectatorAngle,
        1-Math.pow(.0005,dt)
    );
}

function angleLerp(a,b,t){

    let d=b-a;

    while(d>Math.PI)
        d-=Math.PI*2;

    while(d<-Math.PI)
        d+=Math.PI*2;

    return a+d*t;
}

/* =========================================================
   DRAWING UTILITIES
========================================================= */

function clear(){

    ctx.fillStyle="#07101b";
    ctx.fillRect(0,0,W,H);
}

function drawCircle(x,y,r,color){

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
}

function worldToScreen(x,y,cx,cy,angle,zoom){

    const dx=x-cx;
    const dy=y-cy;

    const ca=Math.cos(-angle);
    const sa=Math.sin(-angle);

    const rx=
        dx*ca-
        dy*sa;

    const ry=
        dx*sa+
        dy*ca;

    return {
        x:W/2+rx*zoom,
        y:H/2+ry*zoom
    };
}

/* =========================================================
   TOP-DOWN / DEBUG MAP
========================================================= */

function drawMap(){

    clear();

    if(!track.length)
        return;

    const me=
        marble.find(m=>m.id===selected)||
        marble[0];

    const p=marbleWorldPosition(me);

    const scale=
        Math.min(
            W/1000,
            H/750
        );

    /*
        Draw the whole track as a dark road.
    */
    ctx.save();

    ctx.translate(
        W/2-p.x*scale,
        H/2-p.y*scale
    );

    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.beginPath();

    track.forEach((pt,i)=>{

        if(i===0)
            ctx.moveTo(pt.x*scale,pt.y*scale);
        else
            ctx.lineTo(pt.x*scale,pt.y*scale);
    });

    ctx.strokeStyle="#263241";
    ctx.lineWidth=ROAD_HALF*2*scale;
    ctx.stroke();

    ctx.beginPath();

    track.forEach((pt,i)=>{

        if(i===0)
            ctx.moveTo(pt.x*scale,pt.y*scale);
        else
            ctx.lineTo(pt.x*scale,pt.y*scale);
    });

    ctx.strokeStyle="#151d29";
    ctx.lineWidth=ROAD_HALF*2*scale-10*scale;
    ctx.stroke();

    /*
        Walls
    */
    for(const side of [-1,1]){

        ctx.beginPath();

        track.forEach((pt,i)=>{

            const f=trackFrame(i);

            const x=
                pt.x+
                f.n.x*ROAD_HALF*side;

            const y=
                pt.y+
                f.n.y*ROAD_HALF*side;

            if(i===0)
                ctx.moveTo(x*scale,y*scale);
            else
                ctx.lineTo(x*scale,y*scale);
        });

        ctx.strokeStyle=
            side>0
                ? "#e74c3c"
                : "#3498db";

        ctx.lineWidth=3*scale;
        ctx.stroke();
    }

    /*
        Obstacles
    */
    for(const o of obstacles){

        const f=trackFrame(o.s);

        const x=
            f.p.x+
            f.n.x*o.lane;

        const y=
            f.p.y+
            f.n.y*o.lane;

        ctx.fillStyle=
            o.type==="bumper"
                ? "#f1c40f"
                : "#d35400";

        ctx.beginPath();
        ctx.arc(
            x*scale,
            y*scale,
            o.size*scale,
            0,
            Math.PI*2
        );
        ctx.fill();
    }

    /*
        Marbles
    */
    for(const m of marble){

        const pos=marbleWorldPosition(m);

        ctx.beginPath();

        ctx.arc(
            pos.x*scale,
            pos.y*scale,
            m.radius*scale,
            0,
            Math.PI*2
        );

        ctx.fillStyle=m.color;
        ctx.fill();

        if(m.id===selected){

            ctx.strokeStyle="#fff";
            ctx.lineWidth=2;
            ctx.stroke();
        }
    }

    ctx.restore();
}

/* =========================================================
   3D PERSPECTIVE PROJECTION
========================================================= */

/*
    The spectator view uses a genuine perspective projection
    rather than simply scaling a top-down map.
*/

function project3D(
    x,
    y,
    cameraX,
    cameraY,
    cameraAngle,
    cameraHeight
){

    const dx=x-cameraX;
    const dy=y-cameraY;

    const ca=Math.cos(-cameraAngle);
    const sa=Math.sin(-cameraAngle);

    const side=
        dx*ca-
        dy*sa;

    const depth=
        dx*sa+
        dy*ca;

    /*
        Don't render points behind the camera.
    */
    if(depth<3)
        return null;

    const focal=
        Math.min(W,H)*.82;

    const scale=
        focal/
        (depth+cameraHeight);

    const horizon=
        H*.40;

    /*
        Ground plane.
    */
    const groundY=
        horizon+
        cameraHeight*scale;

    return {
        x:W/2+side*scale,
        y:groundY,
        scale
    };
}

/* =========================================================
   SPECTATOR 3D VIEW
========================================================= */

function drawSpectator(){

    /*
        Sky gradient
    */
    const sky=ctx.createLinearGradient(
        0,0,
        0,H*.65
    );

    sky.addColorStop(0,"#07111f");
    sky.addColorStop(.55,"#15253a");
    sky.addColorStop(1,"#263a47");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    /*
        Ground
    */
    ctx.fillStyle="#101b18";
    ctx.fillRect(
        0,
        H*.39,
        W,
        H*.61
    );

    if(!marble.length)
        return;

    const me=
        marble.find(m=>m.id===selected)||
        marble[0];

    const cameraHeight=38;

    /*
        Road segments.

        Draw far-to-near so the road appears as a real
        perspective surface.
    */
    const start=Math.floor(me.s-40);
    const end=Math.min(
        track.length-2,
        Math.floor(me.s+190)
    );

    const roadSegments=[];

    for(let s=end;s>=start;s-=2){

        const f=trackFrame(s);

        const leftX=
            f.p.x-
            f.n.x*ROAD_HALF;

        const leftY=
            f.p.y-
            f.n.y*ROAD_HALF;

        const rightX=
            f.p.x+
            f.n.x*ROAD_HALF;

        const rightY=
            f.p.y+
            f.n.y*ROAD_HALF;

        const lp=project3D(
            leftX,
            leftY,
            spectatorX,
            spectatorY,
            spectatorAngle,
            cameraHeight
        );

        const rp=project3D(
            rightX,
            rightY,
            spectatorX,
            spectatorY,
            spectatorAngle,
            cameraHeight
        );

        if(!lp||!rp)
            continue;

        const f2=trackFrame(s+2);

        const lp2=project3D(
            f2.p.x-f2.n.x*ROAD_HALF,
            f2.p.y-f2.n.y*ROAD_HALF,
            spectatorX,
            spectatorY,
            spectatorAngle,
            cameraHeight
        );

        const rp2=project3D(
            f2.p.x+f2.n.x*ROAD_HALF,
            f2.p.y+f2.n.y*ROAD_HALF,
            spectatorX,
            spectatorY,
            spectatorAngle,
            cameraHeight
        );

        if(!lp2||!rp2)
            continue;

        roadSegments.push({
            lp,
            rp,
            lp2,
            rp2,
            s
        });
    }

    /*
        Road itself
    */
    for(const seg of roadSegments){

        ctx.beginPath();

        ctx.moveTo(seg.lp.x,seg.lp.y);
        ctx.lineTo(seg.rp.x,seg.rp.y);
        ctx.lineTo(seg.rp2.x,seg.rp2.y);
        ctx.lineTo(seg.lp2.x,seg.lp2.y);
        ctx.closePath();

        ctx.fillStyle=
            Math.floor(seg.s/8)%2
                ? "#252b34"
                : "#292f38";

        ctx.fill();
    }

    /*
        Walls / kerbs
    */
    for(const seg of roadSegments){

        /*
            left kerb
        */
        ctx.beginPath();

        ctx.moveTo(seg.lp.x,seg.lp.y);
        ctx.lineTo(seg.lp2.x,seg.lp2.y);

        ctx.strokeStyle=
            Math.floor(seg.s/5)%2
                ? "#e74c3c"
                : "#f4f4f4";

        ctx.lineWidth=
            Math.max(
                2,
                seg.lp.scale*7
            );

        ctx.stroke();

        /*
            right kerb
        */
        ctx.beginPath();

        ctx.moveTo(seg.rp.x,seg.rp.y);
        ctx.lineTo(seg.rp2.x,seg.rp2.y);

        ctx.strokeStyle=
            Math.floor(seg.s/5)%2
                ? "#3498db"
                : "#f4f4f4";

        ctx.stroke();
    }

    /*
        Centre lane markings.
    */
    for(
        let s=Math.floor(me.s-10);
        s<Math.min(track.length-2,me.s+190);
        s+=12
    ){

        const f=trackFrame(s);

        const a=project3D(
            f.p.x,
            f.p.y,
            spectatorX,
            spectatorY,
            spectatorAngle,
            cameraHeight
        );

        const f2=trackFrame(s+5);

        const b=project3D(
            f2.p.x,
            f2.p.y,
            spectatorX,
            spectatorY,
            spectatorAngle,
            cameraHeight
        );

        if(!a||!b)
            continue;

        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle="rgba(255,255,255,.55)";
        ctx.lineWidth=Math.max(1,a.scale*3);
        ctx.stroke();
    }

    /*
        Obstacles
    */
    for(const o of obstacles){

        if(
            o.s<me.s-20||
            o.s>me.s+190
        )
            continue;

        const f=trackFrame(o.s);

        const ox=
            f.p.x+
            f.n.x*o.lane;

        const oy=
            f.p.y+
            f.n.y*o.lane;

        const base=project3D(
            ox,
            oy,
            spectatorX,
            spectatorY,
            spectatorAngle,
            cameraHeight
        );

        if(!base)
            continue;

        const top={
            x:base.x,
            y:base.y-
                o.height*
                base.scale
        };

        const size=
            Math.max(
                3,
                o.size*base.scale
            );

        /*
            shadow
        */
        ctx.beginPath();

        ctx.ellipse(
            base.x,
            base.y+size*.35,
            size*1.2,
            size*.4,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle="rgba(0,0,0,.35)";
        ctx.fill();

        /*
            obstacle body
        */
        ctx.beginPath();

        ctx.moveTo(
            base.x-size,
            base.y
        );

        ctx.lineTo(
            base.x+size,
            base.y
        );

        ctx.lineTo(
            top.x+size*.72,
            top.y
        );

        ctx.lineTo(
            top.x-size*.72,
            top.y
        );

        ctx.closePath();

        ctx.fillStyle=
            o.type==="bumper"
                ? "#f1c40f"
                : "#d35400";

        ctx.fill();

        ctx.strokeStyle="rgba(0,0,0,.45)";
        ctx.stroke();
    }

    /*
        Other marbles.

        We use actual world positions, not their old centreline
        position, so they visibly move toward the walls.
    */
    const renderMarbles=
        marble
            .filter(m=>
                !m.finished&&
                m.s>me.s-20&&
                m.s<me.s+180
            )
            .sort((a,b)=>b.s-a.s);

    for(const m of renderMarbles){

        const pos=marbleWorldPosition(m);

        const p=project3D(
            pos.x,
            pos.y,
            spectatorX,
            spectatorY,
            spectatorAngle,
            cameraHeight
        );

        if(!p)
            continue;

        draw3DMarble(
            p.x,
            p.y,
            Math.max(
                2,
                m.radius*p.scale*1.25
            ),
            m.color,
            m.id===selected
        );
    }

    /*
        Camera target indicator.
    */
    ctx.fillStyle="rgba(255,255,255,.75)";
    ctx.font="bold 13px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        "SPECTATOR",
        W/2,
        30
    );
}

/* =========================================================
   3D MARBLE
========================================================= */

function draw3DMarble(
    x,
    y,
    r,
    color,
    selectedMarble
){

    /*
        Shadow
    */
    ctx.beginPath();

    ctx.ellipse(
        x,
        y+r*.55,
        r*1.25,
        r*.42,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(0,0,0,.42)";
    ctx.fill();

    /*
        Sphere gradient.
    */
    const grad=ctx.createRadialGradient(
        x-r*.35,
        y-r*.45,
        r*.1,
        x,
        y,
        r
    );

    grad.addColorStop(0,"#fff");
    grad.addColorStop(.15,color);
    grad.addColorStop(.72,color);
    grad.addColorStop(1,"rgba(0,0,0,.75)");

    ctx.beginPath();
    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle=grad;
    ctx.fill();

    if(selectedMarble){

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r+3,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#fff";
        ctx.lineWidth=2;
        ctx.stroke();
    }
}

/* =========================================================
   FIRST PERSON 3D VIEW
========================================================= */

function drawFirstPerson(){

    const sky=ctx.createLinearGradient(
        0,0,
        0,H*.55
    );

    sky.addColorStop(0,"#06101d");
    sky.addColorStop(.55,"#1a3048");
    sky.addColorStop(1,"#4d6170");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#111a18";
    ctx.fillRect(
        0,
        H*.40,
        W,
        H*.60
    );

    if(!marble.length)
        return;

    const me=
        marble.find(m=>m.id===selected)||
        marble[0];

    const cameraHeight=26;

    const start=Math.floor(me.s);
    const end=Math.min(
        track.length-2,
        start+170
    );

    /*
        Road from current marble forward.
    */
    for(
        let s=end;
        s>=start;
        s-=2
    ){

        const f=trackFrame(s);

        const lp=project3D(
            f.p.x-f.n.x*ROAD_HALF,
            f.p.y-f.n.y*ROAD_HALF,
            fpX,
            fpY,
            fpAngle,
            cameraHeight
        );

        const rp=project3D(
            f.p.x+f.n.x*ROAD_HALF,
            f.p.y+f.n.y*ROAD_HALF,
            fpX,
            fpY,
            fpAngle,
            cameraHeight
        );

        const f2=trackFrame(s+2);

        const lp2=project3D(
            f2.p.x-f2.n.x*ROAD_HALF,
            f2.p.y-f2.n.y*ROAD_HALF,
            fpX,
            fpY,
            fpAngle,
            cameraHeight
        );

        const rp2=project3D(
            f2.p.x+f2.n.x*ROAD_HALF,
            f2.p.y+f2.n.y*ROAD_HALF,
            fpX,
            fpY,
            fpAngle,
            cameraHeight
        );

        if(!lp||!rp||!lp2||!rp2)
            continue;

        ctx.beginPath();

        ctx.moveTo(lp.x,lp.y);
        ctx.lineTo(rp.x,rp.y);
        ctx.lineTo(rp2.x,rp2.y);
        ctx.lineTo(lp2.x,lp2.y);

        ctx.closePath();

        ctx.fillStyle=
            Math.floor(s/8)%2
                ? "#252b34"
                : "#2b313a";

        ctx.fill();

        /*
            Walls
        */
        ctx.beginPath();
        ctx.moveTo(lp.x,lp.y);
        ctx.lineTo(lp2.x,lp2.y);

        ctx.strokeStyle=
            Math.floor(s/5)%2
                ? "#e74c3c"
                : "#f4f4f4";

        ctx.lineWidth=Math.max(2,lp.scale*6);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(rp.x,rp.y);
        ctx.lineTo(rp2.x,rp2.y);

        ctx.strokeStyle=
            Math.floor(s/5)%2
                ? "#3498db"
                : "#f4f4f4";

        ctx.stroke();
    }

    /*
        Obstacles ahead.
    */
    for(const o of obstacles){

        if(o.s<me.s||o.s>me.s+170)
            continue;

        const f=trackFrame(o.s);

        const ox=
            f.p.x+
            f.n.x*o.lane;

        const oy=
            f.p.y+
            f.n.y*o.lane;

        const p=project3D(
            ox,
            oy,
            fpX,
            fpY,
            fpAngle,
            cameraHeight
        );

        if(!p)
            continue;

        const r=
            Math.max(
                2,
                o.size*p.scale
            );

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y-r*.4,
            r,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            o.type==="bumper"
                ? "#f1c40f"
                : "#d35400";

        ctx.fill();

        ctx.strokeStyle="rgba(0,0,0,.5)";
        ctx.stroke();
    }

    /*
        First-person marble edge at bottom of screen.
    */
    const bottomR=
        Math.min(W,H)*.075;

    draw3DMarble(
        W/2,
        H*.88,
        bottomR,
        me.color,
        false
    );
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    if(!marble.length)
        return;

    const me=
        marble.find(m=>m.id===selected)||
        marble[0];

    const place=
        [...marble]
            .sort((a,b)=>b.s-a.s)
            .indexOf(me)+1;

    document.getElementById("raceInfo").innerHTML=
        `<strong>${me.name}</strong> &nbsp; `+
        `Position: ${place}/8 &nbsp; `+
        `Speed: ${Math.max(0,me.v).toFixed(1)}`;

    document.getElementById("cameraInfo").textContent=
        firstPerson
            ? "First person"
            : "3D spectator";
}

/* =========================================================
   MAIN DRAW
========================================================= */

function draw(){

    if(state==="menu"){
        clear();
        return;
    }

    if(state==="race"||state==="countdown"){

        if(firstPerson)
            drawFirstPerson();
        else
            drawSpectator();

        updateHUD();

        /*
            Small collision camera shake.
        */
        if(cameraShake>.01){

            /*
                This is intentionally subtle.
            */
            ctx.fillStyle=
                `rgba(255,255,255,${cameraShake*.035})`;

            ctx.fillRect(
                0,
                0,
                W,
                H
            );
        }

        return;
    }

    if(state==="finish"){

        /*
            Keep a still spectator frame behind the result panel.
        */
        drawSpectator();
    }
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

    const dt=
        Math.min(
            .033,
            Math.max(
                0,
                (now-lastTime)/1000
            )
        );

    lastTime=now;

    updateRace(dt);

    if(
        state==="race"||
        state==="countdown"
    ){
        updateCameras(dt);
    }

    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   CONTROLS
========================================================= */

document.addEventListener("keydown",e=>{

    if(e.code==="KeyV"){

        if(state!=="menu"){

            firstPerson=!firstPerson;

            /*
                Re-align spectator camera whenever switching
                views so it doesn't jump wildly.
            */
            resetCameras();
        }
    }

    if(e.code==="KeyR"){

        if(state!=="menu")
            restart();
    }

    if(e.code==="KeyM"){

        muted=!muted;

        if(!muted)
            tone(660,.08);
    }

    if(e.code==="Space"){

        if(state==="race"){

            paused=!paused;

            document.getElementById("message").textContent=
                paused
                    ? "PAUSED"
                    : "";
        }

        e.preventDefault();
    }
});

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById("startBtn")
    .onclick=start;

document.getElementById("nextBtn")
    .onclick=()=>{

        trackIndex=
            (trackIndex+1)%
            trackNames.length;

        trackSelect.value=trackIndex;

        document.getElementById("finishPanel")
            .classList.add("hidden");

        setupMenu();
    };

document.getElementById("menuBtn")
    .onclick=()=>{

        state="menu";
        paused=false;

        setupMenu();
    };

/* =========================================================
   INITIAL MENU
========================================================= */

setupMenu();

</script>
</body>
</html>
